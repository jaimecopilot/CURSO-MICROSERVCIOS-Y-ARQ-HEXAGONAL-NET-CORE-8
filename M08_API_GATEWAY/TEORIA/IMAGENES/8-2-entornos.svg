ddle" font-family="DejaVu Sans,sans-serif" font-size="18" fill="#18324c" font-weight="400">elegido por el cliente</text><line x1="45" y1="680" x2="1195" y2="680" stroke="#cbd9e5"/><text x="60" y="714" text-anchor="start" font-family="DejaVu Sans,sans-serif" font-size="18" fill="#526779" font-weight="400">localhost dentro de un contenedor identifica ese contenedor. Versionar configuración no autoriza a guardar</text><text x="60" y="740" text-anchor="start" font-family="DejaVu Sans,sans-serif" font-size="18" fill="#526779" font-weight="400">credenciales.</text><text x="1180" y="770" text-anchor="end" font-family="DejaVu Sans,sans-serif" font-size="13" fill="#526779" font-weight="400">JAIME GALLO · M08</text></svg>