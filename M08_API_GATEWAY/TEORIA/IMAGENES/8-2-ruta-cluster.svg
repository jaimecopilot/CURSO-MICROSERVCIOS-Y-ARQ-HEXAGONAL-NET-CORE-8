y="DejaVu Sans,sans-serif" font-size="18" fill="#526779" font-weight="400">Añadir un destino no modifica el contrato público. El cluster debe existir y todas las direcciones deben ser</text><text x="60" y="740" text-anchor="start" font-family="DejaVu Sans,sans-serif" font-size="18" fill="#526779" font-weight="400">válidas.</text><text x="1180" y="770" text-anchor="end" font-family="DejaVu Sans,sans-serif" font-size="13" fill="#526779" font-weight="400">JAIME GALLO · M08</text></svg>