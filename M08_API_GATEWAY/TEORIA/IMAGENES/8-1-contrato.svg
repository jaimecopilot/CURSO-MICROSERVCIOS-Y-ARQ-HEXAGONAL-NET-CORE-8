<svg xmlns="http://www.w3.org/2000/svg" width="1240" height="790" viewBox="0 0 1240 790" role="img" aria-label="El borde también debe conservar los resultados"><title>El borde también debe conservar los resultados</title><desc>Una respuesta válida mantiene estado, cuerpo, identidad y enlace al recurso.</desc><defs><marker id="blue" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10Z" fill="#22588a"/></marker><marker id="teal" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10Z" fill="#087e8b"/></marker><marker id="green" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10Z" fill="#217345"/></marker><marker id="gold" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10Z" fill="#966008"/></marker><marker id="red" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10Z" fill="#aa3545"/></marker></defs><rect width="1240" height="790" rx="18" fill="#f8fafc"/><rect x="38" y="35" width="7" height="66" rx="3" fill="#087e8b"/><text x="65" y="66" text-anchor="start" font-family="DejaVu Sans,sans-serif" font-size="28" fill="#18324c" font-weight="700">El borde también debe conservar los resultados</text><text x="65" y="105" text-anchor="start" font-family="DejaVu Sans,sans-serif" font-size="18" fill="#526779" font-weight="400">Una respuesta válida mantiene estado, cuerpo, identidad y enlace al recurso.</text><line x1="45" y1="132" x2="1195" y2="132" stroke="#cbd9e5"/><path d="M385,275 L455,275" fill="none" stroke="#087e8b" stroke-width="3" marker-end="url(#teal)"/><path d="M785,275 L855,275" fill="none" stroke="#087e8b" stroke-width="3" marker-end="url(#teal)"/><path d="M1020,360 L1020,470" fill="none" stroke="#087e8b" stroke-width="3" marker-end="url(#teal)"/><path d="M855,555 L785,555" fill="none" stroke="#087e8b" stroke-width="3" marker-end="url(#teal)"/><path d="M455,555 L385,555" fill="none" stroke="#087e8b" stroke-width="3" marker-end="url(#teal)"/><rect x="55" y="190" width="330" height="170" rx="16" fill="#eaf2fb" stroke="#22588a" stroke-width="2"/><text x="220.0" y="224" text-anchor="middle" font-family="DejaVu Sans,sans-serif" font-size="21" fill="#22588a" font-weight="700">Petición</text><text x="220.0" y="258" text-anchor="middle" font-family="DejaVu Sans,sans-serif" font-size="18" fill="#18324c" font-weight="400">Método + cuerpo + query</text><text x="220.0" y="283" text-anchor="middle" font-family="DejaVu Sans,sans-serif" font-size="18" fill="#18324c" font-weight="400">Correlación validada</text><rect x="455" y="190" width="330" height="170" rx="16" fill="#e4f5f5" stroke="#087e8b" stroke-width="2"/><text x="620.0" y="224" text-anchor="middle" font-family="DejaVu Sans,sans-serif" font-size="21" fill="#087e8b" font-weight="700">Gateway</text><text x="620.0" y="258" text-anchor="middle" font-family="DejaVu Sans,sans-serif" font-size="18" fill="#18324c" font-weight="400">Dirección interna fija</text><text x="620.0" y="283" text-anchor="middle" font-family="DejaVu Sans,sans-serif" font-size="18" fill="#18324c" font-weight="400">Una petición al backend</text><rect x="855" y="190" width="330" height="170" rx="16" fill="#eaf7ee" stroke="#217345" stroke-width="2"/><text x="1020.0" y="224" text-anchor="middle" font-family="DejaVu Sans,sans-serif" font-size="21" fill="#217345" font-weight="700">API responsable</text><text x="1020.0" y="258" text-anchor="middle" font-family="DejaVu Sans,sans-serif" font-size="18" fill="#18324c" font-weight="400">201 / 400 / 404 / 409 / 422</text><text x="1020.0" y="283" text-anchor="middle" font-family="DejaVu Sans,sans-serif" font-size="18" fill="#18324c" font-weight="400">Según el caso de uso</text><rect x="855" y="470" width="330" height="170" rx="16" fill="#eaf7ee" stroke="#217345" stroke-width="2"/><text x="1020.0" y="504" text-anchor="middle" font-family="DejaVu Sans,sans-serif" font-size="21" fill="#217345" font-weight="700">Respuesta de backend</text><text x="1020.0" y="538" text-anchor="middle" font-family="DejaVu Sans,sans-serif" font-size="18" fill="#18324c" font-weight="400">Cuerpo del resultado</text><text x="1020.0" y="563" text-anchor="middle" font-family="DejaVu Sans,sans-serif" font-size="18" fill="#18324c" font-weight="400">Location cuando procede</text><rect x="455" y="470" width="330" height="170" rx="16" fill="#e4f5f5" stroke="#087e8b" stroke-width="2"/><text x="620.0" y="504" text-anchor="middle" font-family="DejaVu Sans,sans-serif" font-size="21" fill="#087e8b" font-weight="700">Traducción del borde</text><text x="620.0" y="538" text-anchor="middle" font-family="DejaVu Sans,sans-serif" font-size="18" fill="#18324c" font-weight="400">Location accesible</text><text x="620.0" y="563" text-anchor="middle" font-family="DejaVu Sans,sans-serif" font-size="18" fill="#18324c" font-weight="400">Estado y cuerpo coherentes</text><rect x="55" y="470" width="330" height="170" rx="16" fill="#eaf2fb" stroke="#22588a" stroke-width="2"/><text x="220.0" y="504" text-anchor="middle" font-family="DejaVu Sans,sans-serif" font-size="21" fill="#22588a" font-weight="700">Cliente</text><text x="220.0" y="538" text-anchor="middle" font-family="DejaVu Sans,sans-serif" font-size="18" fill="#18324c" font-weight="400">Sigue el recurso publicado</text><text x="220.0" y="563" text-anchor="middle" font-family="DejaVu Sans,sans-serif" font-size="18" fill="#18324c" font-weight="400">Distingue fallo y ausencia</text><line x1="45" y1="680" x2="1195" y2="680" stroke="#cbd9e5"/><text x="60" y="714" text-anchor="start" font-family="DejaVu Sans,sans-serif" font-size="18" fill="#526779" font-weight="400">Un error de transporte no equivale a stock cero. El gateway no reintenta automáticamente las escrituras.</text><text x="1180" y="770" text-anchor="end" font-family="DejaVu Sans,sans-serif" font-size="13" fill="#526779" font-weight="400">JAIME GALLO · M08</text></svg>