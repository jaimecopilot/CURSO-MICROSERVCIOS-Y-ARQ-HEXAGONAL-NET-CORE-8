 L855,275" fill="none" stroke="#087e8b" stroke-width="3" marker-end="url(#teal)"/><text x="820.0" y="261.0" text-anchor="middle" font-family="DejaVu Sans,sans-serif" font-size="15" fill="#087e8b" font-weight="700">vuelve</text><path d="M220,360 L220,470" fill="none" stroke="#087e8b" stroke-width="3" marker-end="url(#teal)"/><text x="233.0" y="406.0" text-anchor="start" font-family="DejaVu Sans,sans-serif" font-size="15" fill="#087e8b" font-weight="700">hay demora</text><path d="M620,360 L620,470" fill="none" stroke="#087e8b" stroke-width="3" marker-end="url(#teal)"/><text x="633.0" y="406.0" text-anchor="start" font-family="DejaVu Sans,sans-serif" font-size="15" fill="#087e8b" font-weight="700">si caen todos</text><path d="M1020,360 L1020,470" fill="none" stroke="#087e8b" stroke-width="3" marker-end="url(#teal)"/><text x="1033.0" y="406.0" text-anchor="start" font-family="DejaVu Sans,sans-serif" font-size="15" fill="#087e8b" font-weight="700">habilita</text><rect x="55" y="190" width="330" height="170" rx="16" fill="#eaf7ee" stroke="#217345" stroke-width="2"/><text x="220.0" y="224" text-anchor="middle" font-family="DejaVu Sans,sans-serif" font-size="21" fill="#217345" font-weight="700">Disponible</text><text x="220.0" y="258" text-anchor="middle" font-family="DejaVu Sans,sans-serif" font-size="18" fill="#18324c" font-weight="400">Readiness satisfactoria</text><text x="220.0" y="283" text-anchor="middle" font-family="DejaVu Sans,sans-serif" font-size="18" fill="#18324c" font-weight="400">Puede recibir tráfico</text><rect x="455" y="190" width="330" height="170" rx="16" fill="#ffedf0" stroke="#aa3545" stroke-width="2"/><text x="620.0" y="224" text-anchor="middle" font-family="DejaVu Sans,sans-serif" font-size="21" fill="#aa3545" font-weight="700">Fallo detectado</text><text x="620.0" y="258" text-anchor="middle" font-family="DejaVu Sans,sans-serif" font-size="18" fill="#18324c" font-weight="400">Acumula dos fallos</text><text x="620.0" y="283" text-anchor="middle" font-family="DejaVu Sans,sans-serif" font-size="18" fill="#18324c" font-weight="400">Retira el destino</text><rect x="855" y="190" width="330" height="170" rx="16" fill="#eaf7ee" stroke="#217345" stroke-width="2"/><text x="1020.0" y="224" text-anchor="middle" font-family="DejaVu Sans,sans-serif" font-size="21" fill="#217345" font-weight="700">Recuperado</text><text x="1020.0" y="258" text-anchor="middle" font-family="DejaVu Sans,sans-serif" font-size="18" fill="#18324c" font-weight="400">Sonda satisfactoria</text><text x="1020.0" y="283" text-anchor="middle" font-family="DejaVu Sans,sans-serif" font-size="18" fill="#18324c" font-weight="400">Reincorpora el destino</text><rect x="55" y="470" width="330" height="170" rx="16" fill="#fff5df" stroke="#966008" stroke-width="2"/><text x="220.0" y="504" text-anchor="middle" font-family="DejaVu Sans,sans-serif" font-size="21" fill="#966008" font-weight="700">Ventana de detección</text><text x="220.0" y="538" text-anchor="middle" font-family="DejaVu Sans,sans-serif" font-size="18" fill="#18324c" font-weight="400">Solicitudes en curso</text><text x="220.0" y="563" text-anchor="middle" font-family="DejaVu Sans,sans-serif" font-size="18" fill="#18324c" font-weight="400">todavía pueden fallar</text><rect x="455" y="470" width="330" height="170" rx="16" fill="#ffedf0" stroke="#aa3545" stroke-width="2"/><text x="620.0" y="504" text-anchor="middle" font-family="DejaVu Sans,sans-serif" font-size="21" fill="#aa3545" font-weight="700">Ningún elegible</text><text x="620.0" y="538" text-anchor="middle" font-family="DejaVu Sans,sans-serif" font-size="18" fill="#18324c" font-weight="400">HealthyAndUnknown</text><text x="620.0" y="563" text-anchor="middle" font-family="DejaVu Sans,sans-serif" font-size="18" fill="#18324c" font-weight="400">Devuelve 503 sin destino</text><rect x="855" y="470" width="330" height="170" rx="16" fill="#e4f5f5" stroke="#087e8b" stroke-width="2"/><text x="1020.0" y="504" text-anchor="middle" font-family="DejaVu Sans,sans-serif" font-size="21" fill="#087e8b" font-weight="700">Vuelve el reparto</text><text x="1020.0" y="538" text-anchor="middle" font-family="DejaVu Sans,sans-serif" font-size="18" fill="#18324c" font-weight="400">Solo peticiones nuevas</text><text x="1020.0" y="563" text-anchor="middle" font-family="DejaVu Sans,sans-serif" font-size="18" fill="#18324c" font-weight="400">No repite escrituras</text><line x1="45" y1="680" x2="1195" y2="680" stroke="#cbd9e5"/><text x="60" y="714" text-anchor="start" font-family="DejaVu Sans,sans-serif" font-size="18" fill="#526779" font-weight="400">HealthyOrPanic permite volver a intentar todos si ninguno queda sano. La etapa docente evita esa política de</text><text x="60" y="740" text-anchor="start" font-family="DejaVu Sans,sans-serif" font-size="18" fill="#526779" font-weight="400">reserva.</text><text x="1180" y="770" text-anchor="end" font-family="DejaVu Sans,sans-serif" font-size="13" fill="#526779" font-weight="400">JAIME GALLO · M08</text></svg>