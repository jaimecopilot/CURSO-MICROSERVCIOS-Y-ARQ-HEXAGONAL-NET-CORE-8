<svg xmlns="http://www.w3.org/2000/svg" width="1240" height="790" viewBox="0 0 1240 790" role="img" aria-label="Publicar una ruta implica preservar su significado"><title>Publicar una ruta implica preservar su significado</title><desc>La respuesta se contrasta con el backend, incluidos los caminos de error.</desc><defs><marker id="blue" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10Z" fill="#22588a"/></marker><marker id="teal" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10Z" fill="#087e8b"/></marker><marker id="green" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10Z" fill="#217345"/></marker><marker id="gold" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10Z" fill="#966008"/></marker><marker id="red" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10Z" fill="#aa3545"/></marker></defs><rect width="1240" height="790" rx="18" fill="#f8fafc"/><rect x="38" y="35" width="7" height="66" rx="3" fill="#087e8b"/><text x="65" y="66" text-anchor="start" font-family="DejaVu Sans,sans-serif" font-size="28" fill="#18324c" font-weight="700">Publicar una ruta implica preservar su significado</text><text x="65" y="105" text-anchor="start" font-family="DejaVu Sans,sans-serif" font-size="18" fill="#526779" font-weight="400">La respuesta se contrasta con el backend, incluidos los caminos de error.</text><line x1="45" y1="132" x2="1195" y2="132" stroke="#cbd9e5"/><path d="M220,360 L220,470" fill="none" stroke="#087e8b" stroke-width="3" marker-end="url(#teal)"/><text x="233.0" y="406.0" text-anchor="start" font-family="DejaVu Sans,sans-serif" font-size="15" fill="#087e8b" font-weight="700">comprueba</text><path d="M620,360 L620,470" fill="none" stroke="#087e8b" stroke-width="3" marker-end="url(#teal)"/><text x="633.0" y="406.0" text-anchor="start" font-family="DejaVu Sans,sans-serif" font-size="15" fill="#087e8b" font-weight="700">relaciona</text><path d="M1020,360 L1020,470" fill="none" stroke="#087e8b" stroke-width="3" marker-end="url(#teal)"/><text x="1033.0" y="406.0" text-anchor="start" font-family="DejaVu Sans,sans-serif" font-size="15" fill="#087e8b" font-weight="700">delimita</text><rect x="55" y="190" width="330" height="170" rx="16" fill="#eaf7ee" stroke="#217345" stroke-width="2"/><text x="220.0" y="224" text-anchor="middle" font-family="DejaVu Sans,sans-serif" font-size="21" fill="#217345" font-weight="700">Operación válida</text><text x="220.0" y="258" text-anchor="middle" font-family="DejaVu Sans,sans-serif" font-size="18" fill="#18324c" font-weight="400">Crear y consultar</text><text x="220.0" y="283" text-anchor="middle" font-family="DejaVu Sans,sans-serif" font-size="18" fill="#18324c" font-weight="400">201 y recurso publicado</text><rect x="455" y="190" width="330" height="170" rx="16" fill="#fff5df" stroke="#966008" stroke-width="2"/><text x="620.0" y="224" text-anchor="middle" font-family="DejaVu Sans,sans-serif" font-size="21" fill="#966008" font-weight="700">Errores de contrato</text><text x="620.0" y="258" text-anchor="middle" font-family="DejaVu Sans,sans-serif" font-size="18" fill="#18324c" font-weight="400">400 / 404 / 409 / 422</text><text x="620.0" y="283" text-anchor="middle" font-family="DejaVu Sans,sans-serif" font-size="18" fill="#18324c" font-weight="400">Cuerpo original coherente</text><rect x="855" y="190" width="330" height="170" rx="16" fill="#ffedf0" stroke="#aa3545" stroke-width="2"/><text x="1020.0" y="224" text-anchor="middle" font-family="DejaVu Sans,sans-serif" font-size="21" fill="#aa3545" font-weight="700">Fallo de transporte</text><text x="1020.0" y="258" text-anchor="middle" font-family="DejaVu Sans,sans-serif" font-size="18" fill="#18324c" font-weight="400">502 u otro error técnico</text><text x="1020.0" y="283" text-anchor="middle" font-family="DejaVu Sans,sans-serif" font-size="18" fill="#18324c" font-weight="400">Nunca éxito inventado</text><rect x="55" y="470" width="330" height="170" rx="16" fill="#eaf7ee" stroke="#217345" stroke-width="2"/><text x="220.0" y="504" text-anchor="middle" font-family="DejaVu Sans,sans-serif" font-size="21" fill="#217345" font-weight="700">Location</text><text x="220.0" y="538" text-anchor="middle" font-family="DejaVu Sans,sans-serif" font-size="18" fill="#18324c" font-weight="400">Al seguir el enlace</text><text x="220.0" y="563" text-anchor="middle" font-family="DejaVu Sans,sans-serif" font-size="18" fill="#18324c" font-weight="400">se alcanza el recurso</text><rect x="455" y="470" width="330" height="170" rx="16" fill="#e4f5f5" stroke="#087e8b" stroke-width="2"/><text x="620.0" y="504" text-anchor="middle" font-family="DejaVu Sans,sans-serif" font-size="21" fill="#087e8b" font-weight="700">Correlación</text><text x="620.0" y="538" text-anchor="middle" font-family="DejaVu Sans,sans-serif" font-size="18" fill="#18324c" font-weight="400">Mismo identificador válido</text><text x="620.0" y="563" text-anchor="middle" font-family="DejaVu Sans,sans-serif" font-size="18" fill="#18324c" font-weight="400">Entre gateway y servicios</text><rect x="855" y="470" width="330" height="170" rx="16" fill="#eaf2fb" stroke="#22588a" stroke-width="2"/><text x="1020.0" y="504" text-anchor="middle" font-family="DejaVu Sans,sans-serif" font-size="21" fill="#22588a" font-weight="700">Métodos y superficie</text><text x="1020.0" y="538" text-anchor="middle" font-family="DejaVu Sans,sans-serif" font-size="18" fill="#18324c" font-weight="400">No publicar diagnósticos</text><text x="1020.0" y="563" text-anchor="middle" font-family="DejaVu Sans,sans-serif" font-size="18" fill="#18324c" font-weight="400">Ni destinos arbitrarios</text><line x1="45" y1="680" x2="1195" y2="680" stroke="#cbd9e5"/><text x="60" y="714" text-anchor="start" font-family="DejaVu Sans,sans-serif" font-size="18" fill="#526779" font-weight="400">Una prueba de catálogo verifica datos declarados. Un servidor real verifica la petición y respuesta que</text><text x="60" y="740" text-anchor="start" font-family="DejaVu Sans,sans-serif" font-size="18" fill="#526779" font-weight="400">realmente circularon.</text><text x="1180" y="770" text-anchor="end" font-family="DejaVu Sans,sans-serif" font-size="13" fill="#526779" font-weight="400">JAIME GALLO · M08</text></svg>