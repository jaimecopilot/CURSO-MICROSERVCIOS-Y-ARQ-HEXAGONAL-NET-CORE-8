<svg xmlns="http://www.w3.org/2000/svg" width="1240" height="790" viewBox="0 0 1240 790" role="img" aria-label="La entrada técnica conserva los límites del dominio"><title>La entrada técnica conserva los límites del dominio</title><desc>El gateway y los servicios cooperan sin compartir las reglas del negocio.</desc><defs><marker id="blue" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10Z" fill="#22588a"/></marker><marker id="teal" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10Z" fill="#087e8b"/></marker><marker id="green" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10Z" fill="#217345"/></marker><marker id="gold" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10Z" fill="#966008"/></marker><marker id="red" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10Z" fill="#aa3545"/></marker></defs><rect width="1240" height="790" rx="18" fill="#f8fafc"/><rect x="38" y="35" width="7" height="66" rx="3" fill="#087e8b"/><text x="65" y="66" text-anchor="start" font-family="DejaVu Sans,sans-serif" font-size="28" fill="#18324c" font-weight="700">La entrada técnica conserva los límites del dominio</text><text x="65" y="105" text-anchor="start" font-family="DejaVu Sans,sans-serif" font-size="18" fill="#526779" font-weight="400">El gateway y los servicios cooperan sin compartir las reglas del negocio.</text><line x1="45" y1="132" x2="1195" y2="132" stroke="#cbd9e5"/><path d="M385,275 L455,275" fill="none" stroke="#087e8b" stroke-width="3" marker-end="url(#teal)"/><text x="420.0" y="261.0" text-anchor="middle" font-family="DejaVu Sans,sans-serif" font-size="15" fill="#087e8b" font-weight="700">envía</text><path d="M785,275 L855,275" fill="none" stroke="#087e8b" stroke-width="3" marker-end="url(#teal)"/><text x="820.0" y="261.0" text-anchor="middle" font-family="DejaVu Sans,sans-serif" font-size="15" fill="#087e8b" font-weight="700">adapta</text><path d="M620,360 L620,470" fill="none" stroke="#087e8b" stroke-width="3" marker-end="url(#teal)"/><text x="633.0" y="406.0" text-anchor="start" font-family="DejaVu Sans,sans-serif" font-size="15" fill="#087e8b" font-weight="700">ejecuta</text><rect x="55" y="190" width="330" height="170" rx="16" fill="#e4f5f5" stroke="#087e8b" stroke-width="2"/><text x="220.0" y="224" text-anchor="middle" font-family="DejaVu Sans,sans-serif" font-size="21" fill="#087e8b" font-weight="700">Gateway</text><text x="220.0" y="258" text-anchor="middle" font-family="DejaVu Sans,sans-serif" font-size="18" fill="#18324c" font-weight="400">Enrutamiento</text><text x="220.0" y="283" text-anchor="middle" font-family="DejaVu Sans,sans-serif" font-size="18" fill="#18324c" font-weight="400">Correlación y resumen HTTP</text><rect x="455" y="190" width="330" height="170" rx="16" fill="#eaf7ee" stroke="#217345" stroke-width="2"/><text x="620.0" y="224" text-anchor="middle" font-family="DejaVu Sans,sans-serif" font-size="21" fill="#217345" font-weight="700">Servicio</text><text x="620.0" y="258" text-anchor="middle" font-family="DejaVu Sans,sans-serif" font-size="18" fill="#18324c" font-weight="400">Validación y caso de uso</text><text x="620.0" y="283" text-anchor="middle" font-family="DejaVu Sans,sans-serif" font-size="18" fill="#18324c" font-weight="400">Result y contrato HTTP</text><rect x="855" y="190" width="330" height="170" rx="16" fill="#eaf2fb" stroke="#22588a" stroke-width="2"/><text x="1020.0" y="224" text-anchor="middle" font-family="DejaVu Sans,sans-serif" font-size="21" fill="#22588a" font-weight="700">Infraestructura</text><text x="1020.0" y="258" text-anchor="middle" font-family="DejaVu Sans,sans-serif" font-size="18" fill="#18324c" font-weight="400">SQL Server, RabbitMQ</text><text x="1020.0" y="283" text-anchor="middle" font-family="DejaVu Sans,sans-serif" font-size="18" fill="#18324c" font-weight="400">Outbox e inbox de M06</text><rect x="55" y="470" width="330" height="170" rx="16" fill="#fff5df" stroke="#966008" stroke-width="2"/><text x="220.0" y="504" text-anchor="middle" font-family="DejaVu Sans,sans-serif" font-size="21" fill="#966008" font-weight="700">Políticas posibles</text><text x="220.0" y="538" text-anchor="middle" font-family="DejaVu Sans,sans-serif" font-size="18" fill="#18324c" font-weight="400">Autenticación y cuotas</text><text x="220.0" y="563" text-anchor="middle" font-family="DejaVu Sans,sans-serif" font-size="18" fill="#18324c" font-weight="400">Requieren implementación</text><rect x="455" y="470" width="330" height="170" rx="16" fill="#eaf7ee" stroke="#217345" stroke-width="2"/><text x="620.0" y="504" text-anchor="middle" font-family="DejaVu Sans,sans-serif" font-size="21" fill="#217345" font-weight="700">Reglas de negocio</text><text x="620.0" y="538" text-anchor="middle" font-family="DejaVu Sans,sans-serif" font-size="18" fill="#18324c" font-weight="400">Planificar, consultar stock</text><text x="620.0" y="563" text-anchor="middle" font-family="DejaVu Sans,sans-serif" font-size="18" fill="#18324c" font-weight="400">Persistir cambios válidos</text><rect x="855" y="470" width="330" height="170" rx="16" fill="#e4f5f5" stroke="#087e8b" stroke-width="2"/><text x="1020.0" y="504" text-anchor="middle" font-family="DejaVu Sans,sans-serif" font-size="21" fill="#087e8b" font-weight="700">Independencia</text><text x="1020.0" y="538" text-anchor="middle" font-family="DejaVu Sans,sans-serif" font-size="18" fill="#18324c" font-weight="400">Gateway sin referencias</text><text x="1020.0" y="563" text-anchor="middle" font-family="DejaVu Sans,sans-serif" font-size="18" fill="#18324c" font-weight="400">a dominio ni persistencia</text><line x1="45" y1="680" x2="1195" y2="680" stroke="#cbd9e5"/><text x="60" y="714" text-anchor="start" font-family="DejaVu Sans,sans-serif" font-size="18" fill="#526779" font-weight="400">Los indicadores del catálogo no instalan políticas. La API conserva sus decisiones aunque la petición cruce un</text><text x="60" y="740" text-anchor="start" font-family="DejaVu Sans,sans-serif" font-size="18" fill="#526779" font-weight="400">proxy.</text><text x="1180" y="770" text-anchor="end" font-family="DejaVu Sans,sans-serif" font-size="13" fill="#526779" font-weight="400">JAIME GALLO · M08</text></svg>