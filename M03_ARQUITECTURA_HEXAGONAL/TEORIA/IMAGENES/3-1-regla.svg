<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="620" viewBox="0 0 1200 620" role="img" aria-label="La regla de dependencia"><defs><marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="8" markerHeight="8" orient="auto"><path d="M0 0L10 5L0 10z" fill="#147E92"/></marker></defs><rect width="1200" height="620" rx="22" fill="#F8FAFC"/><rect x="36" y="32" width="7" height="56" rx="3" fill="#147E92"/><text x="62" y="64" font-family="DejaVu Sans,Arial" font-size="29" font-weight="700" fill="#17314A">La regla de dependencia</text><text x="63" y="99" font-family="DejaVu Sans,Arial" font-size="18" fill="#5B7184">El núcleo no conoce los detalles de ejecución</text><line x1="44" y1="120" x2="1155" y2="120" stroke="#D8E6EF" stroke-width="2"/><rect x="65" y="174" width="465" height="166" rx="17" fill="#FFFFFF" stroke="#B7C9D5" stroke-width="1.6"/><rect x="65" y="174" width="465" height="10" rx="5" fill="#247397"/><rect x="75" y="196" width="445" height="127" rx="12" fill="#EBF3F9"/><text x="297.5" y="238" fill="#247397" font-family="DejaVu Sans,Arial" font-weight="700" font-size="19" text-anchor="middle">API</text><text x="297.5" y="277" fill="#247397" font-family="DejaVu Sans,Arial" font-weight="400" font-size="15" text-anchor="middle">Invoca casos de uso</text><rect x="662" y="174" width="465" height="166" rx="17" fill="#FFFFFF" stroke="#B7C9D5" stroke-width="1.6"/><rect x="662" y="174" width="465" height="10" rx="5" fill="#147E92"/><rect x="672" y="196" width="445" height="127" rx="12" fill="#E7F6F6"/><text x="894.5" y="238" fill="#147E92" font-family="DejaVu Sans,Arial" font-weight="700" font-size="19" text-anchor="middle">Aplicación</text><text x="894.5" y="277" fill="#147E92" font-family="DejaVu Sans,Arial" font-weight="400" font-size="15" text-anchor="middle">Declara IOrdenRepositorio</text><rect x="65" y="382" width="465" height="166" rx="17" fill="#FFFFFF" stroke="#B7C9D5" stroke-width="1.6"/><rect x="65" y="382" width="465" height="10" rx="5" fill="#177D65"/><rect x="75" y="404" width="445" height="127" rx="12" fill="#E7F6EE"/><text x="297.5" y="446" fill="#177D65" font-family="DejaVu Sans,Arial" font-weight="700" font-size="19" text-anchor="middle">Dominio</text><text x="297.5" y="485" fill="#177D65" font-family="DejaVu Sans,Arial" font-weight="400" font-size="15" text-anchor="middle">Reglas y entidades</text><rect x="662" y="382" width="465" height="166" rx="17" fill="#FFFFFF" stroke="#B7C9D5" stroke-width="1.6"/><rect x="662" y="382" width="465" height="10" rx="5" fill="#AF752A"/><rect x="672" y="404" width="445" height="127" rx="12" fill="#FEF5E9"/><text x="894.5" y="446" fill="#AF752A" font-family="DejaVu Sans,Arial" font-weight="700" font-size="19" text-anchor="middle">Infraestructura</text><text x="894.5" y="485" fill="#AF752A" font-family="DejaVu Sans,Arial" font-weight="400" font-size="15" text-anchor="middle">Implementa IOrdenRepositorio</text><line x1="540" y1="255" x2="652" y2="255" stroke="#147E92" stroke-width="4" marker-end="url(#arrow)"/><line x1="710" y1="345" x2="530" y2="414" stroke="#147E92" stroke-width="4" marker-end="url(#arrow)"/><line x1="895" y1="382" x2="895" y2="347" stroke="#147E92" stroke-width="4" marker-end="url(#arrow)"/><line x1="48" y1="561" x2="1152" y2="561" stroke="#D8E6EF" stroke-width="1.6"/><text x="60" y="591" fill="#5B7184" font-family="DejaVu Sans,Arial" font-weight="400" font-size="15" text-anchor="start">Las flechas de referencia apuntan desde API/infraestructura hacia contratos internos; dominio no apunta hacia SQL.</text></svg>