<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="620" viewBox="0 0 1200 620" role="img" aria-label="Las capas clasifican responsabilidades"><defs><marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="8" markerHeight="8" orient="auto"><path d="M0 0L10 5L0 10z" fill="#147E92"/></marker></defs><rect width="1200" height="620" rx="22" fill="#F8FAFC"/><rect x="36" y="32" width="7" height="56" rx="3" fill="#147E92"/><text x="62" y="64" font-family="DejaVu Sans,Arial" font-size="29" font-weight="700" fill="#17314A">Las capas clasifican responsabilidades</text><text x="63" y="99" font-family="DejaVu Sans,Arial" font-size="18" fill="#5B7184">No confundas función con librería</text><line x1="44" y1="120" x2="1155" y2="120" stroke="#D8E6EF" stroke-width="2"/><rect x="180" y="150" width="850" height="88" rx="15" fill="#EBF3F9" stroke="#247397" stroke-width="2"/><text x="450" y="183" fill="#247397" font-family="DejaVu Sans,Arial" font-weight="700" font-size="22" text-anchor="middle">Presentación / API</text><text x="640" y="216" fill="#17314A" font-family="DejaVu Sans,Arial" font-weight="400" font-size="17" text-anchor="middle">HTTP, JSON, resultado público</text><line x1="605" y1="239" x2="605" y2="250" stroke="#147E92" stroke-width="4" marker-end="url(#arrow)"/><rect x="180" y="254" width="850" height="88" rx="15" fill="#E7F6F6" stroke="#147E92" stroke-width="2"/><text x="450" y="287" fill="#147E92" font-family="DejaVu Sans,Arial" font-weight="700" font-size="22" text-anchor="middle">Aplicación</text><text x="640" y="320" fill="#17314A" font-family="DejaVu Sans,Arial" font-weight="400" font-size="17" text-anchor="middle">OrdenesCasoUso: coordina operaciones</text><line x1="605" y1="343" x2="605" y2="354" stroke="#147E92" stroke-width="4" marker-end="url(#arrow)"/><rect x="180" y="358" width="850" height="88" rx="15" fill="#E7F6EE" stroke="#177D65" stroke-width="2"/><text x="450" y="391" fill="#177D65" font-family="DejaVu Sans,Arial" font-weight="700"