<svg xmlns="http://www.w3.org/2000/svg" width="1220" height="760" viewBox="0 0 1220 760" role="img" aria-label="Puerto, adaptador, proveedor y motor son piezas distintas"><title>Puerto, adaptador, proveedor y motor son piezas distintas</title><desc>La dependencia de código apunta al puerto; la ejecución llega hasta SQL Server.</desc><defs><marker id="blue" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10Z" fill="#247397"/></marker><marker id="green" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10Z" fill="#177D65"/></marker><marker id="gold" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10Z" fill="#98621C"/></marker><marker id="red" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10Z" fill="#A23D48"/></marker><marker id="gray" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10Z" fill="#526779"/></marker></defs><rect width="1220" height="760" rx="20" fill="#F8FAFC"/><rect x="38" y="31" width="7" height="62" rx="3" fill="#247397"/><text x="65" y="65" text-anchor="start" font-family="DejaVu Sans,Arial,sans-serif" font-size="27" font-weight="700" fill="#17314A">Puerto, adaptador, proveedor y motor son piezas distintas</text><text x="65" y="103" text-anchor="start" font-family="DejaVu Sans,Arial,sans-serif" font-size="18" font-weight="400" fill="#526779">La dependencia de código apunta al puerto; la ejecución llega hasta SQL Server.</text><line x1="45" y1="130" x2="1175" y2="130" stroke="#D3E1EB"/><rect x="55" y="175" width="330" height="155" rx="15" fill="#E7F6EE" stroke="#177D65" stroke-width="2"/><text x="220.0" y="208" text-anchor="middle" font-family="DejaVu Sans,Arial,sans-serif" font-size="21" font-weight="700" fill="#177D65">Caso de uso</text><text x="220.0" y="244" text-anchor="middle" font-family="DejaVu Sans,Arial,sans-serif" font-size="18" font-weight="400" fill="#17314A">OrdenesCasoUso</text><text x="220.0" y="269" text-anchor="middle" font-family="DejaVu Sans,Arial,sans-serif" font-size="18" font-weight="400" fill="#17314A">Decide y coordina</text><rect x="445" y="175" width="330" height="155" rx="15" fill="#E7F6EE" stroke="#177D65" stroke-width="2"/><text x="610.0" y="208" text-anchor="middle" font-family="DejaVu Sans,Arial,sans-serif" font-size="21" font-weight="700" fill="#177D65">Puerto de salida</text><text x="610.0" y="244" text-anchor="middle" font-family="DejaVu Sans,Arial,sans-serif" font-size="18" font-weight="400" fill="#17314A">IOrdenRepositorio</text><text x="610.0" y="269" text-anchor="middle" font-family="DejaVu Sans,Arial,sans-serif" font-size="18" font-weight="400" fill="#17314A">Contrato de aplicación</text><rect x="835" y="175" width="330" height="155" rx="15" fill="#EBF3F9" stroke="#247397" stroke-width="2"/><text x="1000.0" y="208" text-anchor="middle" font-family="DejaVu Sans,Arial,sans-serif" font-size="21" font-weight="700" fill="#247397">Adaptador de salida</text><text x="1000.0" y="244" text-anchor="middle" font-family="DejaVu Sans,Arial,sans-serif" font-size="18" font-weight="400" fill="#17314A">OrdenRepositorioSqlServer</text><text x="1000.0" y="269" text-anchor="middle" font-family="DejaVu Sans,Arial,sans-serif" font-size="18" font-weight="400" fill="#17314A">Implementa el contrato</text><path d="M385,252 L445,252" stroke="#247397" stroke-width="3" fill="none" marker-end="url(#blue)"/><path d="M835,252 L775,252" stroke="#247397" stroke-width="3" fill="none" marker-end="url(#blue)" stroke-dasharray="7 6"/><text x="805" y="158" text-anchor="middle" font-family="DejaVu Sans,Arial,sans-serif" font-size="16" font-weight="400" fill="#526779">implementa</text><rect x="55" y="440" width="330" height="155" rx="15" fill="#FEF5E9" stroke="#98621C" stroke-width="2"/><text x="220.0" y="473" text-anchor="middle" font-family="DejaVu Sans,Arial,sans-serif" font-size="21" font-weight="700" fill="#98621C">Entrada HTTP</text><text x="220.0" y="509" text-anchor="middle" font-family="DejaVu Sans,Arial,sans-serif" font-size="18" font-weight="400" fill="#17314A">Endpoint Minimal API</text><text x="220.0" y="534" text-anchor="middle" font-family="DejaVu Sans,Arial,sans-serif" font-size="18" font-weight="400" fill="#17314A">Traduce petición y respuesta</text><rect x="445" y="440" width="330" height="155" rx="15" fill="#EBF3F9" stroke="#247397" stroke-width="2"/><text x="610.0" y="473" text-anchor="middle" font-family="DejaVu Sans,Arial,sans-serif" font-size="21" font-weight="700" fill="#247397">Proveedor EF Core</text><text x="610.0" y="509" text-anchor="middle" font-family="DejaVu Sans,Arial,sans-serif" font-size="18" font-weight="400" fill="#17314A">UseSqlServer</text><text x="610.0" y="534" text-anchor="middle" font-family="DejaVu Sans,Arial,sans-serif" font-size="18" font-weight="400" fill="#17314A">Traduce LINQ y mapeos</text><rect x="835" y="440" width="330" height="155" rx="15" fill="#F1F5F8" stroke="#526779" stroke-width="2"/><text x="1000.0" y="473" text-anchor="middle" font-family="DejaVu Sans,Arial,sans-serif" font-size="21" font-weight="700" fill="#526779">Motor SQL Server</text><text x="1000.0" y="509" text-anchor="middle" font-family="DejaVu Sans,Arial,sans-serif" font-size="18" font-weight="400" fill="#17314A">Ejecuta SQL y restricciones</text><text x="1000.0" y="534" text-anchor="middle" font-family="DejaVu Sans,Arial,sans-serif" font-size="18" font-weight="400" fill="#17314A">LocalDB o contenedor</text><path d="M220,440 L220,330" stroke="#247397" stroke-width="3" fill="none" marker-end="url(#blue)"/><rect x="185.765625" y="373" width="68.46875" height="26" rx="5" fill="#F8FAFC"/><text x="220" y="392" text-anchor="middle" font-family="DejaVu Sans,Arial,sans-serif" font-size="16" font-weight="400" fill="#247397">invoca</text><path d="M1000,330 L1000,380 L610,380 L610,440" stroke="#247397" stroke-width="3" fill="none" marker-end="url(#blue)"/><rect x="782.8515625" y="353" width="44.296875" height="26" rx="5" fill="#F8FAFC"/><text x="805" y="372" text-anchor="middle" font-family="DejaVu Sans,Arial,sans-serif" font-size="16" font-weight="400" fill="#247397">usa</text><path d="M775,517 L835,517" stroke="#247397" stroke-width="3" fill="none" marker-end="url(#blue)"/><line x1="45" y1="655" x2="1175" y2="655" stroke="#D3E1EB"/><text x="65" y="692" text-anchor="start" font-family="DejaVu Sans,Arial,sans-serif" font-size="18" font-weight="400" fill="#526779">Cambiar el servidor de una prueba cambia la conexión. Se conservan el puerto, el adaptador EF y el proveedor SQL</text><text x="65" y="717" text-anchor="start" font-family="DejaVu Sans,Arial,sans-serif" font-size="18" font-weight="400" fill="#526779">Server.</text></svg>