<svg xmlns="http://www.w3.org/2000/svg" width="1220" height="760" viewBox="0 0 1220 760" role="img" aria-label="Solicitud y notificación tienen contratos diferentes"><title>Solicitud y notificación tienen contratos diferentes</title><desc>Command y Query usan Send; una notificación se distribuye con Publish.</desc><defs><marker id="blue" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10Z" fill="#247397"/></marker><marker id="green" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10Z" fill="#177D65"/></marker><marker id="gold" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10Z" fill="#98621C"/></marker><marker id="teal" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10Z" fill="#147E92"/></marker><marker id="red" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10Z" fill="#A23D48"/></marker><marker id="gray" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10Z" fill="#526779"/></marker></defs><rect width="1220" height="760" rx="20" fill="#F8FAFC"/><rect x="38" y="31" width="7" height="62" rx="3" fill="#147E92"/><text x="65" y="65" text-anchor="start" font-family="DejaVu Sans,Arial,sans-serif" font-size="28" font-weight="700" fill="#17314A">Solicitud y notificación tienen contratos diferentes</text><text x="65" y="102" text-anchor="start" font-family="DejaVu Sans,Arial,sans-serif" font-size="18" font-weight="400" fill="#526779">Command y Query usan Send; una notificación se distribuye con Publish.</text><line x1="45" y1="128" x2="1175" y2="128" stroke="#D3E1EB"/><path d="M510,282.5 H610.0 V282.5 H710" fill="none" stroke="#147E92" stroke-width="3" marker-end="url(#teal)"/><rect x="588.8" y="255.5" width="42.4" height="23" rx="5" fill="#F8FAFC"/><text x="610.0" y="272.5" text-anchor="middle" font-family="DejaVu Sans,Arial,sans-serif" font-size="13" font-weight="400" fill="#147E92">Send</text><path d="M510,522.5 H610.0 V522.5 H710" fill="none" stroke="#147E92" stroke-width="3" marker-end="url(#teal)"/><rect x="577.4" y="495.5" width="65.19999999999999" height="23" rx="5" fill="#F8FAFC"/><text x="610.0" y="512.5" text-anchor="middle" font-family="DejaVu Sans,Arial,sans-serif" font-size="13" font-weight="400" fill="#147E92">Publish</text><rect x="90" y="210" width="420" height="145" rx="15" fill="#EBF3F9" stroke="#247397" stroke-width="2"/><rect x="90" y="210" width="7" height="145" rx="3" fill="#247397"/><text x="300.0" y="242" text-anchor="middle" font-family="DejaVu Sans,Arial,sans-serif" font-size="20" font-weight="700" fill="#247397">IRequest&lt;T&gt;</text><text x="300.0" y="272" text-anchor="middle" font-family="DejaVu Sans,Arial,sans-serif" font-size="17" font-weight="400" fill="#17314A">Una solicitud con respuesta</text><rect x="710" y="210" width="420" height="145" rx="15" fill="#E7F6EE" stroke="#177D65" stroke-width="2"/><rect x="710" y="210" width="7" height="145" rx="3" fill="#177D65"/><text x="920.0" y="242" text-anchor="middle" font-family="DejaVu Sans,Arial,sans-serif" font-size="20" font-weight="700" fill="#177D65">IRequestHandler</text><text x="920.0" y="272" text-anchor="middle" font-family="DejaVu Sans,Arial,sans-serif" font-size="17" font-weight="400" fill="#17314A">Un manejador apropiado</text><rect x="90" y="450" width="420" height="145" rx="15" fill="#E7F6F6" stroke="#147E92" stroke-width="2"/><rect x="90" y="450" width="7" height="145" rx="3" fill="#147E92"/><text x="300.0" y="482" text-anchor="middle" font-family="DejaVu Sans,Arial,sans-serif" font-size="20" font-weight="700" fill="#147E92">INotification</text><text x="300.0" y="512" text-anchor="middle" font-family="DejaVu Sans,Arial,sans-serif" font-size="17" font-weight="400" fill="#17314A">Un hecho sin respuesta tipada</text><rect x="710" y="450" width="420" height="145" rx="15" fill="#FEF5E9" stroke="#98621C" stroke-width="2"/><rect x="710" y="450" width="7" height="145" rx="3" fill="#98621C"/><text x="920.0" y="482" text-anchor="middle" font-family="DejaVu Sans,Arial,sans-serif" font-size="20" font-weight="700" fill="#98621C">INotificationHandler</text><text x="920.0" y="512" text-anchor="middle" font-family="DejaVu Sans,Arial,sans-serif" font-size="17" font-weight="400" fill="#17314A">Cero, uno o varios receptores</text><line x1="45" y1="670" x2="1175" y2="670" stroke="#D3E1EB"/><text x="60" y="701" text-anchor="start" font-family="DejaVu Sans,Arial,sans-serif" font-size="17" font-weight="400" fill="#526779">La notificación es local al proceso. La estrategia predeterminada espera a los receptores secuencialmente y</text><text x="60" y="726" text-anchor="start" font-family="DejaVu Sans,Arial,sans-serif" font-size="17" font-weight="400" fill="#526779">puede fallar.</text></svg>