<svg xmlns="http://www.w3.org/2000/svg" width="1220" height="760" viewBox="0 0 1220 760" role="img" aria-label="Una prueba de rollback necesita una escritura previa"><title>Una prueba de rollback necesita una escritura previa</title><desc>El control negativo permite comprobar que el test detecta una persistencia parcial.</desc><defs><marker id="blue" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10Z" fill="#247397"/></marker><marker id="green" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10Z" fill="#177D65"/></marker><marker id="gold" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10Z" fill="#98621C"/></marker><marker id="red" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10Z" fill="#A23D48"/></marker><marker id="gray" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10Z" fill="#526779"/></marker></defs><rect width="1220" height="760" rx="20" fill="#F8FAFC"/><rect x="38" y="31" width="7" height="62" rx="3" fill="#247397"/><text x="65" y="65" text-anchor="start" font-family="DejaVu Sans,Arial,sans-serif" font-size="27" font-weight="700" fill="#17314A">Una prueba de rollback necesita una escritura previa</text><text x="65" y="103" text-anchor="start" font-family="DejaVu Sans,Arial,sans-serif" font-size="18" font-weight="400" fill="#526779">El control negativo permite comprobar que el test detecta una persistencia parcial.</text><line x1="45" y1="130" x2="1175" y2="130" stroke="#D3E1EB"/><rect x="55" y="175" width="330" height="155" rx="15" fill="#EBF3F9" stroke="#247397" stroke-width="2"/><text x="220.0" y="208" text-anchor="middle" font-family="DejaVu Sans,Arial,sans-serif" font-size="21" font-weight="700" fill="#247397">Preparar dos altas</text><text x="220.0" y="244" text-anchor="middle" font-family="DejaVu Sans,Arial,sans-serif" font-size="18" font-weight="400" fill="#17314A">Mismo DbContext</text><text x="220.0" y="269" text-anchor="middle" font-family="DejaVu Sans,Arial,sans-serif" font-size="18" font-weight="400" fill="#17314A">Un SaveChangesAsync</text><rect x="445" y="175" width="330" height="155" rx="15" fill="#FEF5E9" stroke="#98621C" stroke-width="2"/><text x="610.0" y="208" text-anchor="middle" font-family="DejaVu Sans,Arial,sans-serif" font-size="21" font-weight="700" fill="#98621C">Primera escritura</text><text x="610.0" y="244" text-anchor="middle" font-family="DejaVu Sans,Arial,sans-serif" font-size="18" font-weight="400" fill="#17314A">El motor la ejecuta</text><text x="610.0" y="269" text-anchor="middle" font-family="DejaVu Sans,Arial,sans-serif" font-size="18" font-weight="400" fill="#17314A">El test registra el hecho</text><rect x="835" y="175" width="330" height="155" rx="15" fill="#FFF0F1" stroke="#A23D48" stroke-width="2"/><text x="1000.0" y="208" text-anchor="middle" font-family="DejaVu Sans,Arial,sans-serif" font-size="21" font-weight="700" fill="#A23D48">Fallo posterior</text><text x="1000.0" y="244" text-anchor="middle" font-family="DejaVu Sans,Arial,sans-serif" font-size="18" font-weight="400" fill="#17314A">Se fuerza el error</text><text x="1000.0" y="269" text-anchor="middle" font-family="DejaVu Sans,Arial,sans-serif" font-size="18" font-weight="400" fill="#17314A">antes de la segunda alta</text><path d="M385,252 L445,252" stroke="#247397" stroke-width="3" fill="none" marker-end="url(#blue)"/><path d="M775,252 L835,252" stroke="#247397" stroke-width="3" fill="none" marker-end="url(#blue)"/><rect x="55" y="440" width="330" height="155" rx="15" fill="#EBF3F9" stroke="#247397" stroke-width="2"/><text x="220.0" y="473" text-anchor="middle" font-family="DejaVu Sans,Arial,sans-serif" font-size="21" font-weight="700" fill="#247397">Nuevo contexto lector</text><text x="220.0" y="509" text-anchor="middle" font-family="DejaVu Sans,Arial,sans-serif" font-size="18" font-weight="400" fill="#17314A">Consulta fuera del contexto</text><text x="220.0" y="534" text-anchor="middle" font-family="DejaVu Sans,Arial,sans-serif" font-size="18" font-weight="400" fill="#17314A">que sufrió la excepción</text><rect x="445" y="440" width="330" height="155" rx="15" fill="#E7F6EE" stroke="#177D65" stroke-width="2"/><text x="610.0" y="473" text-anchor="middle" font-family="DejaVu Sans,Arial,sans-serif" font-size="21" font-weight="700" fill="#177D65">Con transacción</text><text x="610.0" y="509" text-anchor="middle" font-family="DejaVu Sans,Arial,sans-serif" font-size="18" font-weight="400" fill="#17314A">Se revierte el lote</text><text x="610.0" y="534" text-anchor="middle" font-family="DejaVu Sans,Arial,sans-serif" font-size="18" font-weight="400" fill="#17314A">Cero filas persistidas</text><rect x="835" y="440" width="330" height="155" rx="15" fill="#FFF0F1" stroke="#A23D48" stroke-width="2"/><text x="1000.0" y="473" text-anchor="middle" font-family="DejaVu Sans,Arial,sans-serif" font-size="21" font-weight="700" fill="#A23D48">Control sin transacción</text><text x="1000.0" y="509" text-anchor="middle" font-family="DejaVu Sans,Arial,sans-serif" font-size="18" font-weight="400" fill="#17314A">Sobrevive la primera alta</text><text x="1000.0" y="534" text-anchor="middle" font-family="DejaVu Sans,Arial,sans-serif" font-size="18" font-weight="400" fill="#17314A">Una fila persistida</text><path d="M1000,330 L1000,440" stroke="#247397" stroke-width="3" fill="none" marker-end="url(#blue)"/><path d="M1000,380 L610,380 L610,440" stroke="#177D65" stroke-width="3" fill="none" marker-end="url(#green)"/><path d="M445,517 L385,517" stroke="#177D65" stroke-width="3" fill="none" marker-end="url(#green)"/><path d="M1000,595 L1000,625 L220,625 L220,595" stroke="#A23D48" stroke-width="3" fill="none" marker-end="url(#red)"/><line x1="45" y1="655" x2="1175" y2="655" stroke="#D3E1EB"/><text x="65" y="692" text-anchor="start" font-family="DejaVu Sans,Arial,sans-serif" font-size="18" font-weight="400" fill="#526779">El test controla el batching para observar cada INSERT. No se desactiva la transacción de la aplicación: solo se crea una</text><text x="65" y="717" text-anchor="start" font-family="DejaVu Sans,Arial,sans-serif" font-size="18" font-weight="400" fill="#526779">contraprueba.</text></svg>