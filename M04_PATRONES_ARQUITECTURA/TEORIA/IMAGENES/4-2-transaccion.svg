Sans,Arial,sans-serif" font-size="20" font-weight="700" fill="#98621C">SaveChangesAsync</text><text x="610.0" y="272" text-anchor="middle" font-family="DejaVu Sans,Arial,sans-serif" font-size="17" font-weight="400" fill="#17314A">Escribe dentro de la</text><text x="610.0" y="296" text-anchor="middle" font-family="DejaVu Sans,Arial,sans-serif" font-size="17" font-weight="400" fill="#17314A">transacción</text><rect x="855" y="210" width="300" height="145" rx="15" fill="#E7F6EE" stroke="#177D65" stroke-width="2"/><rect x="855" y="210" width="7" height="145" rx="3" fill="#177D65"/><text x="1005.0" y="242" text-anchor="middle" font-family="DejaVu Sans,Arial,sans-serif" font-size="20" font-weight="700" fill="#177D65">CommitAsync</text><text x="1005.0" y="272" text-anchor="middle" font-family="DejaVu Sans,Arial,sans-serif" font-size="17" font-weight="400" fill="#17314A">Hace duraderos los</text><text x="1005.0" y="296" text-anchor="middle" font-family="DejaVu Sans,Arial,sans-serif" font-size="17" font-weight="400" fill="#17314A">cambios</text><rect x="460" y="455" width="300" height="145" rx="15" fill="#FFF0F1" stroke="#A23D48" stroke-width="2"/><rect x="460" y="455" width="7" height="145" rx="3" fill="#A23D48"/><text x="610.0" y="487" text-anchor="middle" font-family="DejaVu Sans,Arial,sans-serif" font-size="20" font-weight="700" fill="#A23D48">Fallo de la operación</text><text x="610.0" y="517" text-anchor="middle" font-family="DejaVu Sans,Arial,sans-serif" font-size="17" font-weight="400" fill="#17314A">No anunciar éxito</text><rect x="855" y="455" width="300" height="145" rx="15" fill="#FFF0F1" stroke="#A23D48" stroke-width="2"/><rect x="855" y="455" width="7" height="145" rx="3" fill="#A23D48"/><text x="1005.0" y="487" text-anchor="middle" font-family="DejaVu Sans,Arial,sans-serif" font-size="20" font-weight="700" fill="#A23D48">RollbackAsync</text><text x="1005.0" y="517" text-anchor="middle" font-family="DejaVu Sans,Arial,sans-serif" font-size="17" font-weight="400" fill="#17314A">Revierte la transacción</text><text x="1005.0" y="541" text-anchor="middle" font-family="DejaVu Sans,Arial,sans-serif" font-size="17" font-weight="400" fill="#17314A">abierta</text><line x1="45" y1="670" x2="1175" y2="670" stroke="#D3E1EB"/><text x="60" y="701" text-anchor="start" font-family="DejaVu Sans,Arial,sans-serif" font-size="17" font-weight="400" fill="#526779">Con una sola llamada a SaveChanges suele bastar la transacción implícita relacional. Revertir SQL no</text><text x="60" y="726" text-anchor="start" font-family="DejaVu Sans,Arial,sans-serif" font-size="17" font-weight="400" fill="#526779">restaura objetos en memoria.</text></svg>