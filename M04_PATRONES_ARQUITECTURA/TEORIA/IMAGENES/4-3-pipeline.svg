Arial,sans-serif" font-size="17" font-weight="400" fill="#17314A">Ejecuta validadores</text><rect x="865" y="205" width="300" height="145" rx="15" fill="#E7F6EE" stroke="#177D65" stroke-width="2"/><rect x="865" y="205" width="7" height="145" rx="3" fill="#177D65"/><text x="1015.0" y="237" text-anchor="middle" font-family="DejaVu Sans,Arial,sans-serif" font-size="20" font-weight="700" fill="#177D65">Manejador</text><text x="1015.0" y="267" text-anchor="middle" font-family="DejaVu Sans,Arial,sans-serif" font-size="17" font-weight="400" fill="#17314A">Ejecuta reglas y</text><text x="1015.0" y="291" text-anchor="middle" font-family="DejaVu Sans,Arial,sans-serif" font-size="17" font-weight="400" fill="#17314A">persistencia</text><rect x="460" y="460" width="300" height="155" rx="15" fill="#FFF0F1" stroke="#A23D48" stroke-width="2"/><rect x="460" y="460" width="7" height="155" rx="3" fill="#A23D48"/><text x="610.0" y="492" text-anchor="middle" font-family="DejaVu Sans,Arial,sans-serif" font-size="20" font-weight="700" fill="#A23D48">Fallo de validación</text><text x="610.0" y="522" text-anchor="middle" font-family="DejaVu Sans,Arial,sans-serif" font-size="17" font-weight="400" fill="#17314A">Excepción traducida o</text><text x="610.0" y="546" text-anchor="middle" font-family="DejaVu Sans,Arial,sans-serif" font-size="17" font-weight="400" fill="#17314A">Result tipado</text><line x1="45" y1="670" x2="1175" y2="670" stroke="#D3E1EB"/><text x="60" y="701" text-anchor="start" font-family="DejaVu Sans,Arial,sans-serif" font-size="17" font-weight="400" fill="#526779">Los comportamientos se anidan según su registro. La práctica usa logging; las variantes de validación se</text><text x="60" y="726" text-anchor="start" font-family="DejaVu Sans,Arial,sans-serif" font-size="17" font-weight="400" fill="#526779">estudian por separado.</text></svg>