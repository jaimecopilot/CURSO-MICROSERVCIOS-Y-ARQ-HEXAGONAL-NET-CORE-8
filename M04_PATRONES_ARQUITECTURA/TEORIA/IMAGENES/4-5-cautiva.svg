<svg xmlns="http://www.w3.org/2000/svg" width="1220" height="760" viewBox="0 0 1220 760" role="img" aria-label="Un singleton no debe capturar un servicio scoped"><title>Un singleton no debe capturar un servicio scoped</title><desc>La duración del consumidor puede retener recursos fuera de su ámbito previsto.</desc><defs><marker id="blue" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10Z" fill="#247397"/></marker><marker id="green" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10Z" fill="#177D65"/></marker><marker id="gold" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10Z" fill="#98621C"/></marker><marker id="teal" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10Z" fill="#147E92"/></marker><marker id="red" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10Z" fill="#A23D48"/></marker><marker id="gray" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10Z" fill="#526779"/></marker></defs><rect width="1220" height="760" rx="20" fill="#F8FAFC"/><rect x="38" y="31" width="7" height="62" rx="3" fill="#147E92"/><text x="65" y="65" text-anchor="start" font-family="DejaVu Sans,Arial,sans-serif" font-size="28" font-weight="700" fill="#17314A">Un singleton no debe capturar un servicio scoped</text><text x="65" y="102" text-anchor="start" font-family="DejaVu Sans,Arial,sans-serif" font-size="18" font-weight="400" fill="#526779">La duración del consumidor puede retener recursos fuera de su ámbito previsto.</text><line x1="45" y1="128" x2="1175" y2="128" stroke="#D3E1EB"/><path d="M510,280.0 H610.0 V280.0 H710" fill="none" stroke="#A23D48" stroke-width="3" marker-end="url(#red)"/><rect x="543.2" y="253.0" width="133.6" height="23" rx="5" fill="#F8FAFC"/><text x="610.0" y="270.0" text-anchor="middle" font-family="DejaVu Sans,Arial,sans-serif" font-size="13" font-weight="400" fill="#A23D48">captura inválida</text><path d="M510,525.0 H610.0 V525.0 H710" fill="none" stroke="#177D65" stroke-width="3" marker-end="url(#green)"/><rect x="562.2" y="498.0" width="95.6" height="23" rx="5" fill="#F8FAFC"/><text x="610.0" y="515.0" text-anchor="middle" font-family="DejaVu Sans,Arial,sans-serif" font-size="13" font-weight="400" fill="#177D65">crea ámbito</text><rect x="90" y="205" width="420" height="150" rx="15" fill="#FFF0F1" stroke="#A23D48" stroke-width="2"/><rect x="90" y="205" width="7" height="150" rx="3" fill="#A23D48"/><text x="300.0" y="237" text-anchor="middle" font-family="DejaVu Sans,Arial,sans-serif" font-size="20" font-weight="700" fill="#A23D48">Singleton</text><text x="300.0" y="267" text-anchor="middle" font-family="DejaVu Sans,Arial,sans-serif" font-size="17" font-weight="400" fill="#17314A">Vive con el proveedor raíz</text><rect x="710" y="205" width="420" height="150" rx="15" fill="#FFF0F1" stroke="#A23D48" stroke-width="2"/><rect x="710" y="205" width="7" height="150" rx="3" fill="#A23D48"/><text x="920.0" y="237" text-anchor="middle" font-family="DejaVu Sans,Arial,sans-serif" font-size="20" font-weight="700" fill="#A23D48">DbContext scoped</text><text x="920.0" y="267" text-anchor="middle" font-family="DejaVu Sans,Arial,sans-serif" font-size="17" font-weight="400" fill="#17314A">Vida prevista: una operación</text><rect x="90" y="450" width="420" height="150" rx="15" fill="#EBF3F9" stroke="#247397" stroke-width="2"/><rect x="90" y="450" width="7" height="150" rx="3" fill="#247397"/><text x="300.0" y="482" text-anchor="middle" font-family="DejaVu Sans,Arial,sans-serif" font-size="20" font-weight="700" fill="#247397">Servicio en segundo plano</text><text x="300.0" y="512" text-anchor="middle" font-family="DejaVu Sans,Arial,sans-serif" font-size="17" font-weight="400" fill="#17314A">Recibe IServiceScopeFactory</text><rect x="710" y="450" width="420" height="150" rx="15" fill="#E7F6EE" stroke="#177D65" stroke-width="2"/><rect x="710" y="450" width="7" height="150" rx="3" fill="#177D65"/><text x="920.0" y="482" text-anchor="middle" font-family="DejaVu Sans,Arial,sans-serif" font-size="20" font-weight="700" fill="#177D65">Ámbito por operación</text><text x="920.0" y="512" text-anchor="middle" font-family="DejaVu Sans,Arial,sans-serif" font-size="17" font-weight="400" fill="#17314A">Resuelve y libera el trabajo</text><line x1="45" y1="670" x2="1175" y2="670" stroke="#D3E1EB"/><text x="60" y="701" text-anchor="start" font-family="DejaVu Sans,Arial,sans-serif" font-size="17" font-weight="400" fill="#526779">ValidateScopes detecta dependencias cautivas. Un scoped sí puede depender de transient; revisa concurrencia</text><text x="60" y="726" text-anchor="start" font-family="DejaVu Sans,Arial,sans-serif" font-size="17" font-weight="400" fill="#526779">y propiedad de recursos.</text></svg>