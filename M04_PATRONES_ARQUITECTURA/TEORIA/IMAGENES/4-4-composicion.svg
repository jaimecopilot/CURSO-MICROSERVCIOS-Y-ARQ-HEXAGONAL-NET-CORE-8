<svg xmlns="http://www.w3.org/2000/svg" width="1220" height="760" viewBox="0 0 1220 760" role="img" aria-label="Tres operaciones para consumir y encadenar Result"><title>Tres operaciones para consumir y encadenar Result</title><desc>Cada transformación mantiene visible el canal de fallo.</desc><defs><marker id="blue" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10Z" fill="#247397"/></marker><marker id="green" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10Z" fill="#177D65"/></marker><marker id="gold" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10Z" fill="#98621C"/></marker><marker id="teal" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10Z" fill="#147E92"/></marker><marker id="red" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10Z" fill="#A23D48"/></marker><marker id="gray" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10Z" fill="#526779"/></marker></defs><rect width="1220" height="760" rx="20" fill="#F8FAFC"/><rect x="38" y="31" width="7" height="62" rx="3" fill="#147E92"/><text x="65" y="65" text-anchor="start" font-family="DejaVu Sans,Arial,sans-serif" font-size="28" font-weight="700" fill="#17314A">Tres operaciones para consumir y encadenar Result</text><text x="65" y="102" text-anchor="start" font-family="DejaVu Sans,Arial,sans-serif" font-size="18" font-weight="400" fill="#526779">Cada transformación mantiene visible el canal de fallo.</text><line x1="45" y1="128" x2="1175" y2="128" stroke="#D3E1EB"/><rect x="55" y="215" width="340" height="220" rx="15" fill="#EBF3F9" stroke="#247397" stroke-width="2"/><rect x="55" y="215" width="7" height="220" rx="3" fill="#247397"/><text x="225.0" y="247" text-anchor="middle" font-family="DejaVu Sans,Arial,sans-serif" font-size="20" font-weight="700" fill="#247397">Map</text><text x="225.0" y="277" text-anchor="middle" font-family="DejaVu Sans,Arial,sans-serif" font-size="17" font-weight="400" fill="#17314A">T → U</text><text x="225.0" y="301" text-anchor="middle" font-family="DejaVu Sans,Arial,sans-serif" font-size="17" font-weight="400" fill="#17314A">Transforma el valor de éxito</text><rect x="440" y="215" width="340" height="220" rx="15" fill="#E7F6F6" stroke="#147E92" stroke-width="2"/><rect x="440" y="215" width="7" height="220" rx="3" fill="#147E92"/><text x="610.0" y="247" text-anchor="middle" font-family="DejaVu Sans,Arial,sans-serif" font-size="20" font-weight="700" fill="#147E92">Bind</text><text x="610.0" y="277" text-anchor="middle" font-family="DejaVu Sans,Arial,sans-serif" font-size="17" font-weight="400" fill="#17314A">T → Result&lt;U&gt;</text><text x="610.0" y="301" text-anchor="middle" font-family="DejaVu Sans,Arial,sans-serif" font-size="17" font-weight="400" fill="#17314A">Encadena otra operación</text><rect x="825" y="215" width="340" height="220" rx="15" fill="#E7F6EE" stroke="#177D65" stroke-width="2"/><rect x="825" y="215" width="7" height="220" rx="3" fill="#177D65"/><text x="995.0" y="247" text-anchor="middle" font-family="DejaVu Sans,Arial,sans-serif" font-size="20" font-weight="700" fill="#177D65">Match</text><text x="995.0" y="277" text-anchor="middle" font-family="DejaVu Sans,Arial,sans-serif" font-size="17" font-weight="400" fill="#17314A">Éxito o fallo → U</text><text x="995.0" y="301" text-anchor="middle" font-family="DejaVu Sans,Arial,sans-serif" font-size="17" font-weight="400" fill="#17314A">Elige una salida común</text><rect x="235" y="500" width="750" height="120" rx="15" fill="#FFF0F1" stroke="#A23D48" stroke-width="2"/><rect x="235" y="500" width="7" height="120" rx="3" fill="#A23D48"/><text x="610.0" y="532" text-anchor="middle" font-family="DejaVu Sans,Arial,sans-serif" font-size="20" font-weight="700" fill="#A23D48">Cortocircuito del fallo</text><text x="610.0" y="562" text-anchor="middle" font-family="DejaVu Sans,Arial,sans-serif" font-size="17" font-weight="400" fill="#17314A">Map y Bind no ejecutan su delegado si el resultado ya es fallido.</text><line x1="45" y1="670" x2="1175" y2="670" stroke="#D3E1EB"/><text x="60" y="701" text-anchor="start" font-family="DejaVu Sans,Arial,sans-serif" font-size="17" font-weight="400" fill="#526779">BindAsync devuelve Task&lt;Result&lt;U&gt;&gt;. Una lambda async no es compatible con un Bind que espere un resultado</text><text x="60" y="726" text-anchor="start" font-family="DejaVu Sans,Arial,sans-serif" font-size="17" font-weight="400" fill="#526779">síncrono.</text></svg>