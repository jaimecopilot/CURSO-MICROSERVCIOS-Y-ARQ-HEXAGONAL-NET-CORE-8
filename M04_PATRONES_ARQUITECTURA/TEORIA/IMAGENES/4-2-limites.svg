<svg xmlns="http://www.w3.org/2000/svg" width="1220" height="760" viewBox="0 0 1220 760" role="img" aria-label="La transacción local tiene una frontera"><title>La transacción local tiene una frontera</title><desc>Los efectos externos necesitan garantías explícitas de entrega y recuperación.</desc><defs><marker id="blue" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10Z" fill="#247397"/></marker><marker id="green" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10Z" fill="#177D65"/></marker><marker id="gold" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10Z" fill="#98621C"/></marker><marker id="teal" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10Z" fill="#147E92"/></marker><marker id="red" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10Z" fill="#A23D48"/></marker><marker id="gray" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10Z" fill="#526779"/></marker></defs><rect width="1220" height="760" rx="20" fill="#F8FAFC"/><rect x="38" y="31" width="7" height="62" rx="3" fill="#147E92"/><text x="65" y="65" text-anchor="start" font-family="DejaVu Sans,Arial,sans-serif" font-size="28" font-weight="700" fill="#17314A">La transacción local tiene una frontera</text><text x="65" y="102" text-anchor="start" font-family="DejaVu Sans,Arial,sans-serif" font-size="18" font-weight="400" fill="#526779">Los efectos externos necesitan garantías explícitas de entrega y recuperación.</text><line x1="45" y1="128" x2="1175" y2="128" stroke="#D3E1EB"/><rect x="65" y="175" width="440" height="435" rx="19" fill="#E7F6EE" fill-opacity="0.45" stroke="#177D65" stroke-width="1.5" stroke-dasharray="6 5"/><text x="83" y="202" text-anchor="start" font-family="DejaVu Sans,Arial,sans-serif" font-size="17" font-weight="700" fill="#177D65">Transacción SQL local</text><rect x="600" y="175" width="530" height="435" rx="19" fill="#FEF5E9" fill-opacity="0.45" stroke="#98621C" stroke-width="1.5" stroke-dasharray="6 5"/><text x="618" y="202" text-anchor="start" font-family="DejaVu Sans,Arial,sans-serif" font-size="17" font-weight="700" fill="#98621C">Fuera de esa transacción</text><path d="M460,500.0 H555.0 V300.0 H650" fill="none" stroke="#147E92" stroke-width="3" marker-end="url(#teal)"/><rect x="484.4" y="373.0" width="141.2" height="23" rx="5" fill="#F8FAFC"/><text x="555.0" y="390.0" text-anchor="middle" font-family="DejaVu Sans,Arial,sans-serif" font-size="13" font-weight="400" fill="#147E92">después de commit</text><path d="M860.0,365 V407.5 H860.0 V450" fill="none" stroke="#147E92" stroke-width="3" marker-end="url(#teal)"/><rect x="835.0" y="381.5" width="50.0" height="23" rx="5" fill="#F8FAFC"/><text x="860.0" y="398.5" text-anchor="middle" font-family="DejaVu Sans,Arial,sans-serif" font-size="13" font-weight="400" fill="#147E92">envía</text><rect x="110" y="230" width="350" height="120" rx="15" fill="#E7F6EE" stroke="#177D65" stroke-width="2"/><rect x="110" y="230" width="7" height="120" rx="3" fill="#177D65"/><text x="285.0" y="262" text-anchor="middle" font-family="DejaVu Sans,Arial,sans-serif" font-size="20" font-weight="700" fill="#177D65">Orden</text><text x="285.0" y="292" text-anchor="middle" font-family="DejaVu Sans,Arial,sans-serif" font-size="17" font-weight="400" fill="#17314A">Cambio de negocio</text><rect x="110" y="440" width="350" height="120" rx="15" fill="#E7F6F6" stroke="#147E92" stroke-width="2"/><rect x="110" y="440" width="7" height="120" rx="3" fill="#147E92"/><text x="285.0" y="472" text-anchor="middle" font-family="DejaVu Sans,Arial,sans-serif" font-size="20" font-weight="700" fill="#147E92">Outbox</text><text x="285.0" y="502" text-anchor="middle" font-family="DejaVu Sans,Arial,sans-serif" font-size="17" font-weight="400" fill="#17314A">Hecho pendiente de publicar</text><rect x="650" y="235" width="420" height="130" rx="15" fill="#EBF3F9" stroke="#247397" stroke-width="2"/><rect x="650" y="235" width="7" height="130" rx="3" fill="#247397"/><text x="860.0" y="267" text-anchor="middle" font-family="DejaVu Sans,Arial,sans-serif" font-size="20" font-weight="700" fill="#247397">Publicador</text><text x="860.0" y="297" text-anchor="middle" font-family="DejaVu Sans,Arial,sans-serif" font-size="17" font-weight="400" fill="#17314A">Lee y envía lo pendiente</text><rect x="650" y="450" width="420" height="130" rx="15" fill="#FEF5E9" stroke="#98621C" stroke-width="2"/><rect x="650" y="450" width="7" height="130" rx="3" fill="#98621C"/><text x="860.0" y="482" text-anchor="middle" font-family="DejaVu Sans,Arial,sans-serif" font-size="20" font-weight="700" fill="#98621C">Broker o correo</text><text x="860.0" y="512" text-anchor="middle" font-family="DejaVu Sans,Arial,sans-serif" font-size="17" font-weight="400" fill="#17314A">Efecto fuera de SQL</text><line x1="45" y1="670" x2="1175" y2="670" stroke="#D3E1EB"/><text x="60" y="701" text-anchor="start" font-family="DejaVu Sans,Arial,sans-serif" font-size="17" font-weight="400" fill="#526779">Una saga compensa pasos; no ofrece la misma atomicidad ACID. Una notificación MediatR tampoco es un outbox</text><text x="60" y="726" text-anchor="start" font-family="DejaVu Sans,Arial,sans-serif" font-size="17" font-weight="400" fill="#526779">persistente.</text></svg>