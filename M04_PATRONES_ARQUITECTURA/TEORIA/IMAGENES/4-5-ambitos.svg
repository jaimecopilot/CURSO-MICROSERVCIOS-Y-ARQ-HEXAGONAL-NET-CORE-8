<svg xmlns="http://www.w3.org/2000/svg" width="1220" height="760" viewBox="0 0 1220 760" role="img" aria-label="Scoped: una instancia por ámbito de resolución"><title>Scoped: una instancia por ámbito de resolución</title><desc>Dos peticiones tienen dos contextos; dentro de cada petición se comparte el suyo.</desc><defs><marker id="blue" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10Z" fill="#247397"/></marker><marker id="green" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10Z" fill="#177D65"/></marker><marker id="gold" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10Z" fill="#98621C"/></marker><marker id="teal" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10Z" fill="#147E92"/></marker><marker id="red" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10Z" fill="#A23D48"/></marker><marker id="gray" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10Z" fill="#526779"/></marker></defs><rect width="1220" height="760" rx="20" fill="#F8FAFC"/><rect x="38" y="31" width="7" height="62" rx="3" fill="#147E92"/><text x="65" y="65" text-anchor="start" font-family="DejaVu Sans,Arial,sans-serif" font-size="28" font-weight="700" fill="#17314A">Scoped: una instancia por ámbito de resolución</text><text x="65" y="102" text-anchor="start" font-family="DejaVu Sans,Arial,sans-serif" font-size="18" font-weight="400" fill="#526779">Dos peticiones tienen dos contextos; dentro de cada petición se comparte el suyo.</text><line x1="45" y1="128" x2="1175" y2="128" stroke="#D3E1EB"/><rect x="60" y="175" width="460" height="480" rx="19" fill="#EBF3F9" fill-opacity="0.45" stroke="#247397" stroke-width="1.5" stroke-dasharray="6 5"/><text x="78" y="202" text-anchor="start" font-family="DejaVu Sans,Arial,sans-serif" font-size="17" font-weight="700" fill="#247397">Ámbito A</text><rect x="695" y="175" width="460" height="480" rx="19" fill="#E7F6EE" fill-opacity="0.45" stroke="#177D65" stroke-width="1.5" stroke-dasharray="6 5"/><text x="713" y="202" text-anchor="start" font-family="DejaVu Sans,Arial,sans-serif" font-size="17" font-weight="700" fill="#177D65">Ámbito B</text><rect x="95" y="235" width="390" height="110" rx="15" fill="#E7F6F6" stroke="#147E92" stroke-width="2"/><rect x="95" y="235" width="7" height="110" rx="3" fill="#147E92"/><text x="290.0" y="267" text-anchor="middle" font-family="DejaVu Sans,Arial,sans-serif" font-size="20" font-weight="700" fill="#147E92">Repositorio A</text><text x="290.0" y="297" text-anchor="middle" font-family="DejaVu Sans,Arial,sans-serif" font-size="17" font-weight="400" fill="#17314A">Trabajo de la petición A</text><rect x="95" y="390" width="390" height="110" rx="15" fill="#E7F6F6" stroke="#147E92" stroke-width="2"/><rect x="95" y="390" width="7" height="110" rx="3" fill="#147E92"/><text x="290.0" y="422" text-anchor="middle" font-family="DejaVu Sans,Arial,sans-serif" font-size="20" font-weight="700" fill="#147E92">Unidad A</text><text x="290.0" y="452" text-anchor="middle" font-family="DejaVu Sans,Arial,sans-serif" font-size="17" font-weight="400" fill="#17314A">Confirma trabajo de A</text><rect x="95" y="540" width="390" height="110" rx="15" fill="#FEF5E9" stroke="#98621C" stroke-width="2"/><rect x="95" y="540" width="7" height="110" rx="3" fill="#98621C"/><text x="290.0" y="572" text-anchor="middle" font-family="DejaVu Sans,Arial,sans-serif" font-size="20" font-weight="700" fill="#98621C">Contexto A</text><text x="290.0" y="602" text-anchor="middle" font-family="DejaVu Sans,Arial,sans-serif" font-size="17" font-weight="400" fill="#17314A">HexagonalDbContext A</text><rect x="730" y="235" width="390" height="110" rx="15" fill="#E7F6F6" stroke="#147E92" stroke-width="2"/><rect x="730" y="235" width="7" height="110" rx="3" fill="#147E92"/><text x="925.0" y="267" text-anchor="middle" font-family="DejaVu Sans,Arial,sans-serif" font-size="20" font-weight="700" fill="#147E92">Repositorio B</text><text x="925.0" y="297" text-anchor="middle" font-family="DejaVu Sans,Arial,sans-serif" font-size="17" font-weight="400" fill="#17314A">Trabajo de la petición B</text><rect x="730" y="390" width="390" height="110" rx="15" fill="#E7F6F6" stroke="#147E92" stroke-width="2"/><rect x="730" y="390" width="7" height="110" rx="3" fill="#147E92"/><text x="925.0" y="422" text-anchor="middle" font-family="DejaVu Sans,Arial,sans-serif" font-size="20" font-weight="700" fill="#147E92">Unidad B</text><text x="925.0" y="452" text-anchor="middle" font-family="DejaVu Sans,Arial,sans-serif" font-size="17" font-weight="400" fill="#17314A">Confirma trabajo de B</text><rect x="730" y="540" width="390" height="110" rx="15" fill="#FEF5E9" stroke="#98621C" stroke-width="2"/><rect x="730" y="540" width="7" height="110" rx="3" fill="#98621C"/><text x="925.0" y="572" text-anchor="middle" font-family="DejaVu Sans,Arial,sans-serif" font-size="20" font-weight="700" fill="#98621C">Contexto B</text><text x="925.0" y="602" text-anchor="middle" font-family="DejaVu Sans,Arial,sans-serif" font-size="17" font-weight="400" fill="#17314A">HexagonalDbContext B</text><line x1="45" y1="670" x2="1175" y2="670" stroke="#D3E1EB"/><text x="60" y="701" text-anchor="start" font-family="DejaVu Sans,Arial,sans-serif" font-size="17" font-weight="400" fill="#526779">Repositorio y unidad de A reciben Contexto A; repositorio y unidad de B reciben Contexto B. No ejecutar</text><text x="60" y="726" text-anchor="start" font-family="DejaVu Sans,Arial,sans-serif" font-size="17" font-weight="400" fill="#526779">operaciones paralelas en uno.</text></svg>