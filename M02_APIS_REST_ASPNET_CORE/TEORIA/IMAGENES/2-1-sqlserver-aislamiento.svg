<svg xmlns="http://www.w3.org/2000/svg" width="1220" height="760" viewBox="0 0 1220 760" role="img" aria-label="Servidor compartido, datos aislados por prueba"><title>Servidor compartido, datos aislados por prueba</title><desc>BaseSqlServer.Crear() elige el servidor y reserva una base con nombre único.</desc><defs><marker id="blue" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10Z" fill="#247397"/></marker><marker id="green" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10Z" fill="#177D65"/></marker><marker id="gold" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10Z" fill="#98621C"/></marker><marker id="red" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10Z" fill="#A23D48"/></marker><marker id="gray" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10Z" fill="#526779"/></marker></defs><rect width="1220" height="760" rx="20" fill="#F8FAFC"/><rect x="38" y="31" width="7" height="62" rx="3" fill="#247397"/><text x="65" y="65" text-anchor="start" font-family="DejaVu Sans,Arial,sans-serif" font-size="27" font-weight="700" fill="#17314A">Servidor compartido, datos aislados por prueba</text><text x="65" y="103" text-anchor="start" font-family="DejaVu Sans,Arial,sans-serif" font-size="18" font-weight="400" fill="#526779">BaseSqlServer.Crear() elige el servidor y reserva una base con nombre único.</text><line x1="45" y1="130" x2="1175" y2="130" stroke="#D3E1EB"/><rect x="55" y="175" width="330" height="155" rx="15" fill="#FEF5E9" stroke="#98621C" stroke-width="2"/><text x="220.0" y="208" text-anchor="middle" font-family="DejaVu Sans,Arial,sans-serif" font-size="20" font-weight="700" fill="#98621C">ACERIA_TEST_SQLSERVER</text><text x="220.0" y="244" text-anchor="middle" font-family="DejaVu Sans,Arial,sans-serif" font-size="18" font-weight="400" fill="#17314A">Conexión a master</text><text x="220.0" y="269" text-anchor="middle" font-family="DejaVu Sans,Arial,sans-serif" font-size="18" font-weight="400" fill="#17314A">LocalDB o servidor de CI</text><rect x="55" y="430" width="330" height="155" rx="15" fill="#EBF3F9" stroke="#247397" stroke-width="2"/><text x="220.0" y="463" text-anchor="middle" font-family="DejaVu Sans,Arial,sans-serif" font-size="21" font-weight="700" fill="#247397">Sin variable de entorno</text><text x="220.0" y="499" text-anchor="middle" font-family="DejaVu Sans,Arial,sans-serif" font-size="18" font-weight="400" fill="#17314A">Testcontainers inicia</text><text x="220.0" y="524" text-anchor="middle" font-family="DejaVu Sans,Arial,sans-serif" font-size="18" font-weight="400" fill="#17314A">SQL Server con Docker</text><rect x="445" y="300" width="330" height="165" rx="15" fill="#E7F6EE" stroke="#177D65" stroke-width="2"/><text x="610.0" y="333" text-anchor="middle" font-family="DejaVu Sans,Arial,sans-serif" font-size="21" font-weight="700" fill="#177D65">Servidor SQL disponible</text><text x="610.0" y="369" text-anchor="middle" font-family="DejaVu Sans,Arial,sans-serif" font-size="18" font-weight="400" fill="#17314A">Motor real y conexión válida</text><text x="610.0" y="394" text-anchor="middle" font-family="DejaVu Sans,Arial,sans-serif" font-size="18" font-weight="400" fill="#17314A">Si falla, falla la prueba</text><rect x="835" y="175" width="330" height="155" rx="15" fill="#EBF3F9" stroke="#247397" stroke-width="2"/><text x="1000.0" y="208" text-anchor="middle" font-family="DejaVu Sans,Arial,sans-serif" font-size="21" font-weight="700" fill="#247397">Caso de prueba A</text><text x="1000.0" y="244" text-anchor="middle" font-family="DejaVu Sans,Arial,sans-serif" font-size="18" font-weight="400" fill="#17314A">Base con GUID A</text><text x="1000.0" y="269" text-anchor="middle" font-family="DejaVu Sans,Arial,sans-serif" font-size="18" font-weight="400" fill="#17314A">Esquema y datos propios</text><rect x="835" y="430" width="330" height="155" rx="15" fill="#EBF3F9" stroke="#247397" stroke-width="2"/><text x="1000.0" y="463" text-anchor="middle" font-family="DejaVu Sans,Arial,sans-serif" font-size="21" font-weight="700" fill="#247397">Caso de prueba B</text><text x="1000.0" y="499" text-anchor="middle" font-family="DejaVu Sans,Arial,sans-serif" font-size="18" font-weight="400" fill="#17314A">Base con GUID B</text><text x="1000.0" y="524" text-anchor="middle" font-family="DejaVu Sans,Arial,sans-serif" font-size="18" font-weight="400" fill="#17314A">Esquema y datos propios</text><path d="M385,252 L415,252 L415,340 L445,340" stroke="#247397" stroke-width="3" fill="none" marker-end="url(#blue)"/><path d="M385,507 L415,507 L415,425 L445,425" stroke="#247397" stroke-width="3" fill="none" marker-end="url(#blue)"/><path d="M775,340 L805,340 L805,252 L835,252" stroke="#247397" stroke-width="3" fill="none" marker-end="url(#blue)"/><path d="M775,425 L805,425 L805,507 L835,507" stroke="#247397" stroke-width="3" fill="none" marker-end="url(#blue)"/><line x1="45" y1="655" x2="1175" y2="655" stroke="#D3E1EB"/><text x="65" y="692" text-anchor="start" font-family="DejaVu Sans,Arial,sans-serif" font-size="18" font-weight="400" fill="#526779">Cada caso elimina su propia base al terminar. Una base del curso o del alumno nunca se utiliza como destino de estas</text><text x="65" y="717" text-anchor="start" font-family="DejaVu Sans,Arial,sans-serif" font-size="18" font-weight="400" fill="#526779">pruebas.</text></svg>