<svg xmlns="http://www.w3.org/2000/svg" width="1220" height="760" viewBox="0 0 1220 760" role="img" aria-label="La imagen se convierte en un servidor SQL real"><title>La imagen se convierte en un servidor SQL real</title><desc>Docker ejecuta el motor; Testcontainers prepara su ciclo de vida para la prueba.</desc><defs><marker id="blue" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10Z" fill="#247397"/></marker><marker id="green" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10Z" fill="#177D65"/></marker><marker id="gold" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10Z" fill="#98621C"/></marker><marker id="red" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10Z" fill="#A23D48"/></marker><marker id="gray" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10Z" fill="#526779"/></marker></defs><rect width="1220" height="760" rx="20" fill="#F8FAFC"/><rect x="38" y="31" width="7" height="62" rx="3" fill="#247397"/><text x="65" y="65" text-anchor="start" font-family="DejaVu Sans,Arial,sans-serif" font-size="27" font-weight="700" fill="#17314A">La imagen se convierte en un servidor SQL real</text><text x="65" y="103" text-anchor="start" font-family="DejaVu Sans,Arial,sans-serif" font-size="18" font-weight="400" fill="#526779">Docker ejecuta el motor; Testcontainers prepara su ciclo de vida para la prueba.</text><line x1="45" y1="130" x2="1175" y2="130" stroke="#D3E1EB"/><rect x="55" y="175" width="330" height="155" rx="15" fill="#F1F5F8" stroke="#526779" stroke-width="2"/><text x="220.0" y="208" text-anchor="middle" font-family="DejaVu Sans,Arial,sans-serif" font-size="21" font-weight="700" fill="#526779">Imagen de Microsoft</text><text x="220.0" y="244" text-anchor="middle" font-family="DejaVu Sans,Arial,sans-serif" font-size="18" font-weight="400" fill="#17314A">Paquete con SQL Server 2022</text><text x="220.0" y="269" text-anchor="middle" font-family="DejaVu Sans,Arial,sans-serif" font-size="18" font-weight="400" fill="#17314A">Etiqueta CU14 fijada</text><rect x="445" y="175" width="330" height="155" rx="15" fill="#EBF3F9" stroke="#247397" stroke-width="2"/><text x="610.0" y="208" text-anchor="middle" font-family="DejaVu Sans,Arial,sans-serif" font-size="21" font-weight="700" fill="#247397">Docker Engine</text><text x="610.0" y="244" text-anchor="middle" font-family="DejaVu Sans,Arial,sans-serif" font-size="18" font-weight="400" fill="#17314A">Crea un proceso aislado</text><text x="610.0" y="269" text-anchor="middle" font-family="DejaVu Sans,Arial,sans-serif" font-size="18" font-weight="400" fill="#17314A">Usa contenedores Linux</text><rect x="835" y="175" width="330" height="155" rx="15" fill="#E7F6EE" stroke="#177D65" stroke-width="2"/><text x="1000.0" y="208" text-anchor="middle" font-family="DejaVu Sans,Arial,sans-serif" font-size="21" font-weight="700" fill="#177D65">Contenedor SQL Server</text><text x="1000.0" y="244" text-anchor="middle" font-family="DejaVu Sans,Arial,sans-serif" font-size="18" font-weight="400" fill="#17314A">Motor en ejecución</text><text x="1000.0" y="269" text-anchor="middle" font-family="DejaVu Sans,Arial,sans-serif" font-size="18" font-weight="400" fill="#17314A">Edición Express</text><path d="M385,252 L445,252" stroke="#247397" stroke-width="3" fill="none" marker-end="url(#blue)"/><path d="M775,252 L835,252" stroke="#247397" stroke-width="3" fill="none" marker-end="url(#blue)"/><rect x="55" y="440" width="330" height="155" rx="15" fill="#EBF3F9" stroke="#247397" stroke-width="2"/><text x="220.0" y="473" text-anchor="middle" font-family="DejaVu Sans,Arial,sans-serif" font-size="21" font-weight="700" fill="#247397">Proceso de pruebas .NET</text><text x="220.0" y="509" text-anchor="middle" font-family="DejaVu Sans,Arial,sans-serif" font-size="18" font-weight="400" fill="#17314A">API de prueba + EF Core</text><text x="220.0" y="534" text-anchor="middle" font-family="DejaVu Sans,Arial,sans-serif" font-size="18" font-weight="400" fill="#17314A">UseSqlServer</text><rect x="445" y="440" width="330" height="155" rx="15" fill="#FEF5E9" stroke="#98621C" stroke-width="2"/><text x="610.0" y="473" text-anchor="middle" font-family="DejaVu Sans,Arial,sans-serif" font-size="21" font-weight="700" fill="#98621C">Puerto del host</text><text x="610.0" y="509" text-anchor="middle" font-family="DejaVu Sans,Arial,sans-serif" font-size="18" font-weight="400" fill="#17314A">Asignación dinámica</text><text x="610.0" y="534" text-anchor="middle" font-family="DejaVu Sans,Arial,sans-serif" font-size="18" font-weight="400" fill="#17314A">Cadena de conexión real</text><rect x="835" y="440" width="330" height="155" rx="15" fill="#E7F6EE" stroke="#177D65" stroke-width="2"/><text x="1000.0" y="473" text-anchor="middle" font-family="DejaVu Sans,Arial,sans-serif" font-size="21" font-weight="700" fill="#177D65">Puerto del contenedor</text><text x="1000.0" y="509" text-anchor="middle" font-family="DejaVu Sans,Arial,sans-serif" font-size="18" font-weight="400" fill="#17314A">SQL escucha en 1433</text><text x="1000.0" y="534" text-anchor="middle" font-family="DejaVu Sans,Arial,sans-serif" font-size="18" font-weight="400" fill="#17314A">Base aislada por caso</text><path d="M385,517 L445,517" stroke="#247397" stroke-width="3" fill="none" marker-end="url(#blue)"/><path d="M775,517 L835,517" stroke="#247397" stroke-width="3" fill="none" marker-end="url(#blue)"/><path d="M1000,330 L1000,440" stroke="#247397" stroke-width="3" fill="none" marker-end="url(#blue)"/><rect x="959.0625" y="374" width="81.875" height="26" rx="5" fill="#F8FAFC"/><text x="1000" y="393" text-anchor="middle" font-family="DejaVu Sans,Arial,sans-serif" font-size="16" font-weight="400" fill="#247397">escucha</text><text x="610" y="387" text-anchor="middle" font-family="DejaVu Sans,Arial,sans-serif" font-size="19" font-weight="400" fill="#526779">Testcontainers obtiene la dirección; el test no adivina el puerto.</text><line x1="45" y1="655" x2="1175" y2="655" stroke="#D3E1EB"/><text x="65" y="692" text-anchor="start" font-family="DejaVu Sans,Arial,sans-serif" font-size="18" font-weight="400" fill="#526779">LocalDB sigue siendo el entorno de la API del alumno. El contenedor pertenece a la ejecución de tests; no emula SQL</text><text x="65" y="717" text-anchor="start" font-family="DejaVu Sans,Arial,sans-serif" font-size="18" font-weight="400" fill="#526779">Server.</text></svg>