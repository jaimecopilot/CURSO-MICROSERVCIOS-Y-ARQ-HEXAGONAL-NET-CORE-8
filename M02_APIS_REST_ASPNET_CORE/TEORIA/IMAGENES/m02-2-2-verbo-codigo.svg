<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="440" viewBox="0 0 1200 440"><rect width="1200" height="440" rx="24" fill="#f7fafc"/><rect x="24" y="24" width="6" height="46" rx="3" fill="#147e92"/><text x="48" y="58" font-family="DejaVu Sans,Arial,sans-serif" font-size="29" fill="#142f49" font-weight="700">La operación se define por verbo, recurso y resultado</text><line x1="48" y1="76" x2="1150" y2="76" stroke="#d9e6ef" stroke-width="2"/><rect x="65" y="94" width="340.6666666666667" height="133" rx="15" fill="#ffffff" stroke="#b5cedc" stroke-width="2"/><rect x="65" y="94" width="340.6666666666667" height="9" rx="4" fill="#0f728c"/><text x="235.33333333333334" y="148" text-anchor="middle" font-family="DejaVu Sans,Arial,sans-serif" font-weight="700" font-size="23" fill="#16334a">GET</text><text x="235.33333333333334" y="180" text-anchor="middle" font-family="DejaVu Sans,Arial,sans-serif" font-size="18" fill="#36536b">Consulta → 200 / 404</text><rect x="429.6666666666667" y="94" width="340.6666666666667" height="133" rx="15" fill="#ffffff" stroke="#b5cedc" stroke-width="2"/><rect x="429.6666666666667" y="94" width="340.6666666666667" height="9" rx="4" fill="#247397"/><text x="600" y="148" text-anchor="middle" font-family="DejaVu Sans,Arial,sans-serif" font-weight="700" font-size="23" fill="#16334a">POST</text><text x="600" y="180" text-anchor="middle" font-family="DejaVu Sans,Arial,sans-serif" font-size="18" fill="#36536b">Creación → 201 / 400</text><rect x="794.3333333333334" y="94" width="340.6666666666667" height="133" rx="15" fill="#ffffff" stroke="#b5cedc" stroke-width="2"/><rect x="794.3333333333334" y="94" width="340.6666666666667" height="9" rx="4" fill="#2c8181"/><text x="964.6666666666667" y="148" text-anchor="middle" font-family="DejaVu Sans,Arial,sans-serif" font-weight="700" font-size="23" fill="#16334a">PUT</text><text x="964.6666666666667" y="180" text-anchor="middle" font-family="DejaVu Sans,Arial,sans-serif" font-size="18" fill="#36536b">Reemplazo → 200 / 204</text><rect x="65" y="243" width="340.6666666666667" height="133" rx="15" fill="#ffffff" stroke="#b5cedc" stroke-width="2"/><rect x="65" y="243" width="340.6666666666667" height="9" rx="4" fill="#476b99"/><text x="235.33333333333334" y="297" text-anchor="middle" font-family="DejaVu Sans,Arial,sans-serif" font-weight="700" font-size="23" fill="#16334a">PATCH</text><text x="235.33333333333334" y="329" text-anchor="middle" font-family="DejaVu Sans,Arial,sans-serif" font-size="18" fill="#36536b">Cambio parcial → 200 / 204</text><rect x="429.6666666666667" y="243" width="340.6666666666667" height="133" rx="15" fill="#ffffff" stroke="#b5cedc" stroke-width="2"/><rect x="429.6666666666667" y="243" width="340.6666666666667" height="9" rx="4" fill="#287899"/><text x="600" y="297" text-anchor="middle" font-family="DejaVu Sans,Arial,sans-serif" font-weight="700" font-size="23" fill="#16334a">DELETE</text><text x="600" y="329" text-anchor="middle" font-family="DejaVu Sans,Arial,sans-serif" font-size="18" fill="#36536b">Eliminación → 204 / 404</text><rect x="794.3333333333334" y="243" width="340.6666666666667" height="133" rx="15" fill="#ffffff" stroke="#b5cedc" stroke-width="2"/><rect x="794.3333333333334" y="243" width="340.6666666666667" height="9" rx="4" fill="#59769a"/><text x="964.6666666666667" y="297" text-anchor="middle" font-family="DejaVu Sans,Arial,sans-serif" font-weight="700" font-size="23" fill="#16334a">Error</text><text x="964.6666666666667" y="329" text-anchor="middle" font-family="DejaVu Sans,Arial,sans-serif" font-size="18" fill="#36536b">400, 409, 422 y 500</text><text x="66" y="414" font-family="DejaVu Sans,Arial,sans-serif" font-size="18" fill="#536a7a">Las restricciones se combinan: cada una contribuye a las propiedades del sistema.</text></svg>