<svg xmlns="http://www.w3.org/2000/svg" width="1220" height="760" viewBox="0 0 1220 760" role="img" aria-label="Preparar cambios no abre una transacción SQL"><title>Preparar cambios no abre una transacción SQL</title><desc>Alcance local de una confirmación con EF Core y proveedor relacional.</desc><defs><marker id="blue" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10Z" fill="#247397"/></marker><marker id="green" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10Z" fill="#177D65"/></marker><marker id="gold" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10Z" fill="#98621C"/></marker><marker id="teal" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10Z" fill="#147E92"/></marker><marker id="red" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10Z" fill="#A23D48"/></marker><marker id="gray" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10Z" fill="#526779"/></marker></defs><rect width="1220" height="760" rx="20" fill="#F8FAFC"/><rect x="38" y="31" width="7" height="62" rx="3" fill="#147E92"/><text x="65" y="65" text-anchor="start" font-family="DejaVu Sans,Arial,sans-serif" font-size="28" font-weight="700" fill="#17314A">Preparar cambios no abre una transacción SQL</text><text x="65" y="102" text-anchor="start" font-family="DejaVu Sans,Arial,sans-serif" font-size="18" font-weight="400" fill="#526779">Alcance local de una confirmación con EF Core y proveedor relacional.</text><line x1="45" y1="128" x2="1175" y2="128" stroke="#D3E1EB"/><path d="M380,312.5 H412.5 V312.5 H445" fill="none" stroke="#147E92" stroke-width="3" marker-end="url(#teal)"/><rect x="376.1" y="285.5" width="72.8" height="23" rx="5" fill="#F8FAFC"/><text x="412.5" y="302.5" text-anchor="middle" font-family="DejaVu Sans,Arial,sans-serif" font-size="13" font-weight="400" fill="#147E92">solicita</text><path d="M755,312.5 H787.5 V312.5 H820" fill="none" stroke="#147E92" stroke-width="3" marker-end="url(#teal)"/><rect x="762.5" y="285.5" width="50.0" height="23" rx="5" fill="#F8FAFC"/><text x="787.5" y="302.5" text-anchor="middle" font-family="DejaVu Sans,Arial,sans-serif" font-size="13" font-weight="400" fill="#147E92">éxito</text><rect x="70" y="220" width="310" height="185" rx="15" fill="#EBF3F9" stroke="#247397" stroke-width="2"/><rect x="70" y="220" width="7" height="185" rx="3" fill="#247397"/><text x="225.0" y="252" text-anchor="middle" font-family="DejaVu Sans,Arial,sans-serif" font-size="20" font-weight="700" fill="#247397">Antes del commit</text><text x="225.0" y="282" text-anchor="middle" font-family="DejaVu Sans,Arial,sans-serif" font-size="17" font-weight="400" fill="#17314A">Cargar, modificar y seguir</text><text x="225.0" y="306" text-anchor="middle" font-family="DejaVu Sans,Arial,sans-serif" font-size="17" font-weight="400" fill="#17314A">la orden en memoria</text><rect x="445" y="220" width="310" height="185" rx="15" fill="#E7F6F6" stroke="#147E92" stroke-width="2"/><rect x="445" y="220" width="7" height="185" rx="3" fill="#147E92"/><text x="600.0" y="252" text-anchor="middle" font-family="DejaVu Sans,Arial,sans-serif" font-size="20" font-weight="700" fill="#147E92">CommitAsync</text><text x="600.0" y="282" text-anchor="middle" font-family="DejaVu Sans,Arial,sans-serif" font-size="17" font-weight="400" fill="#17314A">SaveChangesAsync</text><text x="600.0" y="306" text-anchor="middle" font-family="DejaVu Sans,Arial,sans-serif" font-size="17" font-weight="400" fill="#17314A">Orden y líneas</text><rect x="820" y="220" width="310" height="185" rx="15" fill="#E7F6EE" stroke="#177D65" stroke-width="2"/><rect x="820" y="220" width="7" height="185" rx="3" fill="#177D65"/><text x="975.0" y="252" text-anchor="middle" font-family="DejaVu Sans,Arial,sans-serif" font-size="20" font-weight="700" fill="#177D65">Confirmado</text><text x="975.0" y="282" text-anchor="middle" font-family="DejaVu Sans,Arial,sans-serif" font-size="17" font-weight="400" fill="#17314A">Cambios duraderos</text><text x="975.0" y="306" text-anchor="middle" font-family="DejaVu Sans,Arial,sans-serif" font-size="17" font-weight="400" fill="#17314A">en la base de Producción</text><rect x="295" y="485" width="630" height="125" rx="15" fill="#FEF5E9" stroke="#98621C" stroke-width="2"/><rect x="295" y="485" width="7" height="125" rx="3" fill="#98621C"/><text x="610.0" y="517" text-anchor="middle" font-family="DejaVu Sans,Arial,sans-serif" font-size="20" font-weight="700" fill="#98621C">Fuera de esta garantía</text><text x="610.0" y="547" text-anchor="middle" font-family="DejaVu Sans,Arial,sans-serif" font-size="17" font-weight="400" fill="#17314A">Lecturas previas y servicios remotos no quedan cubiertos</text><text x="610.0" y="571" text-anchor="middle" font-family="DejaVu Sans,Arial,sans-serif" font-size="17" font-weight="400" fill="#17314A">automáticamente</text><line x1="45" y1="670" x2="1175" y2="670" stroke="#D3E1EB"/><text x="60" y="701" text-anchor="start" font-family="DejaVu Sans,Arial,sans-serif" font-size="17" font-weight="400" fill="#526779">Si se necesitan varios guardados atómicos, hay que definir una transacción explícita. Revertir SQL no</text><text x="60" y="726" text-anchor="start" font-family="DejaVu Sans,Arial,sans-serif" font-size="17" font-weight="400" fill="#526779">restaura objetos en memoria.</text></svg>