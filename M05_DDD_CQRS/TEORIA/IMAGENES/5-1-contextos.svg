<svg xmlns="http://www.w3.org/2000/svg" width="1220" height="760" viewBox="0 0 1220 760" role="img" aria-label="Una palabra puede tener significados distintos"><title>Una palabra puede tener significados distintos</title><desc>Contextos delimitados: fronteras de lenguaje y de modelo.</desc><defs><marker id="blue" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10Z" fill="#247397"/></marker><marker id="green" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10Z" fill="#177D65"/></marker><marker id="gold" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10Z" fill="#98621C"/></marker><marker id="teal" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10Z" fill="#147E92"/></marker><marker id="red" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10Z" fill="#A23D48"/></marker><marker id="gray" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10Z" fill="#526779"/></marker></defs><rect width="1220" height="760" rx="20" fill="#F8FAFC"/><rect x="38" y="31" width="7" height="62" rx="3" fill="#147E92"/><text x="65" y="65" text-anchor="start" font-family="DejaVu Sans,Arial,sans-serif" font-size="28" font-weight="700" fill="#17314A">Una palabra puede tener significados distintos</text><text x="65" y="102" text-anchor="start" font-family="DejaVu Sans,Arial,sans-serif" font-size="18" font-weight="400" fill="#526779">Contextos delimitados: fronteras de lenguaje y de modelo.</text><line x1="45" y1="128" x2="1175" y2="128" stroke="#D3E1EB"/><rect x="45" y="175" width="1130" height="400" rx="19" fill="#F1F5F8" fill-opacity="0.45" stroke="#526779" stroke-width="1.5" stroke-dasharray="6 5"/><text x="63" y="202" text-anchor="start" font-family="DejaVu Sans,Arial,sans-serif" font-size="17" font-weight="700" fill="#526779">Acería: no existe un único modelo compartido de Orden</text><rect x="70" y="230" width="310" height="220" rx="15" fill="#E7F6EE" stroke="#177D65" stroke-width="2"/><rect x="70" y="230" width="7" height="220" rx="3" fill="#177D65"/><text x="225.0" y="262" text-anchor="middle" font-family="DejaVu Sans,Arial,sans-serif" font-size="20" font-weight="700" fill="#177D65">Producción</text><text x="225.0" y="292" text-anchor="middle" font-family="DejaVu Sans,Arial,sans-serif" font-size="17" font-weight="400" fill="#17314A">Orden = fabricación</text><text x="225.0" y="316" text-anchor="middle" font-family="DejaVu Sans,Arial,sans-serif" font-size="17" font-weight="400" fill="#17314A">Implementado en M5</text><rect x="445" y="230" width="310" height="220" rx="15" fill="#FEF5E9" stroke="#98621C" stroke-width="2"/><rect x="445" y="230" width="7" height="220" rx="3" fill="#98621C"/><text x="600.0" y="262" text-anchor="middle" font-family="DejaVu Sans,Arial,sans-serif" font-size="20" font-weight="700" fill="#98621C">Aprovisionamiento</text><text x="600.0" y="292" text-anchor="middle" font-family="DejaVu Sans,Arial,sans-serif" font-size="17" font-weight="400" fill="#17314A">Orden = compra</text><text x="600.0" y="316" text-anchor="middle" font-family="DejaVu Sans,Arial,sans-serif" font-size="17" font-weight="400" fill="#17314A">Mapa conceptual</text><rect x="820" y="230" width="310" height="220" rx="15" fill="#EBF3F9" stroke="#247397" stroke-width="2"/><rect x="820" y="230" width="7" height="220" rx="3" fill="#247397"/><text x="975.0" y="262" text-anchor="middle" font-family="DejaVu Sans,Arial,sans-serif" font-size="20" font-weight="700" fill="#247397">Clientes</text><text x="975.0" y="292" text-anchor="middle" font-family="DejaVu Sans,Arial,sans-serif" font-size="17" font-weight="400" fill="#17314A">Cliente = expediente</text><text x="975.0" y="316" text-anchor="middle" font-family="DejaVu Sans,Arial,sans-serif" font-size="17" font-weight="400" fill="#17314A">comercial</text><text x="975.0" y="340" text-anchor="middle" font-family="DejaVu Sans,Arial,sans-serif" font-size="17" font-weight="400" fill="#17314A">Mapa conceptual</text><line x1="45" y1="670" x2="1175" y2="670" stroke="#D3E1EB"/><text x="60" y="701" text-anchor="start" font-family="DejaVu Sans,Arial,sans-serif" font-size="17" font-weight="400" fill="#526779">Los contratos entre contextos se diseñan explícitamente. Nombrar un contexto no significa que exista un</text><text x="60" y="726" text-anchor="start" font-family="DejaVu Sans,Arial,sans-serif" font-size="17" font-weight="400" fill="#526779">servicio desplegado.</text></svg>