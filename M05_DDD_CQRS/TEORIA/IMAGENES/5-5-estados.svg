<svg xmlns="http://www.w3.org/2000/svg" width="1220" height="760" viewBox="0 0 1220 760" role="img" aria-label="Estados reales de la orden del ejercicio"><title>Estados reales de la orden del ejercicio</title><desc>La secuencia expresa transiciones permitidas, no un control físico de planta.</desc><defs><marker id="blue" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10Z" fill="#247397"/></marker><marker id="green" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10Z" fill="#177D65"/></marker><marker id="gold" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10Z" fill="#98621C"/></marker><marker id="teal" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10Z" fill="#147E92"/></marker><marker id="red" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10Z" fill="#A23D48"/></marker><marker id="gray" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10Z" fill="#526779"/></marker></defs><rect width="1220" height="760" rx="20" fill="#F8FAFC"/><rect x="38" y="31" width="7" height="62" rx="3" fill="#147E92"/><text x="65" y="65" text-anchor="start" font-family="DejaVu Sans,Arial,sans-serif" font-size="28" font-weight="700" fill="#17314A">Estados reales de la orden del ejercicio</text><text x="65" y="102" text-anchor="start" font-family="DejaVu Sans,Arial,sans-serif" font-size="18" font-weight="400" fill="#526779">La secuencia expresa transiciones permitidas, no un control físico de planta.</text><line x1="45" y1="128" x2="1175" y2="128" stroke="#D3E1EB"/><path d="M375,300.0 H410.0 V300.0 H445" fill="none" stroke="#147E92" stroke-width="3" marker-end="url(#teal)"/><rect x="366.0" y="273.0" width="88.0" height="23" rx="5" fill="#F8FAFC"/><text x="410.0" y="290.0" text-anchor="middle" font-family="DejaVu Sans,Arial,sans-serif" font-size="13" font-weight="400" fill="#147E92">Planificar</text><path d="M755,300.0 H790.0 V300.0 H825" fill="none" stroke="#147E92" stroke-width="3" marker-end="url(#teal)"/><rect x="749.8" y="273.0" width="80.39999999999999" height="23" rx="5" fill="#F8FAFC"/><text x="790.0" y="290.0" text-anchor="middle" font-family="DejaVu Sans,Arial,sans-serif" font-size="13" font-weight="400" fill="#147E92">Finalizar</text><rect x="65" y="210" width="310" height="180" rx="15" fill="#EBF3F9" stroke="#247397" stroke-width="2"/><rect x="65" y="210" width="7" height="180" rx="3" fill="#247397"/><text x="220.0" y="242" text-anchor="middle" font-family="DejaVu Sans,Arial,sans-serif" font-size="20" font-weight="700" fill="#247397">Borrador</text><text x="220.0" y="272" text-anchor="middle" font-family="DejaVu Sans,Arial,sans-serif" font-size="17" font-weight="400" fill="#17314A">La orden nace con</text><text x="220.0" y="296" text-anchor="middle" font-family="DejaVu Sans,Arial,sans-serif" font-size="17" font-weight="400" fill="#17314A">una primera línea</text><rect x="445" y="210" width="310" height="180" rx="15" fill="#E7F6F6" stroke="#147E92" stroke-width="2"/><rect x="445" y="210" width="7" height="180" rx="3" fill="#147E92"/><text x="600.0" y="242" text-anchor="middle" font-family="DejaVu Sans,Arial,sans-serif" font-size="20" font-weight="700" fill="#147E92">Planificada</text><text x="600.0" y="272" text-anchor="middle" font-family="DejaVu Sans,Arial,sans-serif" font-size="17" font-weight="400" fill="#17314A">Planificación aceptada</text><text x="600.0" y="296" text-anchor="middle" font-family="DejaVu Sans,Arial,sans-serif" font-size="17" font-weight="400" fill="#17314A">por el agregado</text><rect x="825" y="210" width="310" height="180" rx="15" fill="#E7F6EE" stroke="#177D65" stroke-width="2"/><rect x="825" y="210" width="7" height="180" rx="3" fill="#177D65"/><text x="980.0" y="242" text-anchor="middle" font-family="DejaVu Sans,Arial,sans-serif" font-size="20" font-weight="700" fill="#177D65">Finalizada</text><text x="980.0" y="272" text-anchor="middle" font-family="DejaVu Sans,Arial,sans-serif" font-size="17" font-weight="400" fill="#17314A">Transición final aceptada</text><rect x="295" y="485" width="630" height="125" rx="15" fill="#FFF0F1" stroke="#A23D48" stroke-width="2"/><rect x="295" y="485" width="7" height="125" rx="3" fill="#A23D48"/><text x="610.0" y="517" text-anchor="middle" font-family="DejaVu Sans,Arial,sans-serif" font-size="20" font-weight="700" fill="#A23D48">Transición incompatible</text><text x="610.0" y="547" text-anchor="middle" font-family="DejaVu Sans,Arial,sans-serif" font-size="17" font-weight="400" fill="#17314A">Se rechaza sin cambiar la orden; HTTP 409 en el adaptador</text><line x1="45" y1="670" x2="1175" y2="670" stroke="#D3E1EB"/><text x="60" y="701" text-anchor="start" font-family="DejaVu Sans,Arial,sans-serif" font-size="17" font-weight="400" fill="#526779">Finalizar un borrador directamente es inválido. Añadir líneas y sus límites también se validan mediante la</text><text x="60" y="726" text-anchor="start" font-family="DejaVu Sans,Arial,sans-serif" font-size="17" font-weight="400" fill="#526779">raíz.</text></svg>