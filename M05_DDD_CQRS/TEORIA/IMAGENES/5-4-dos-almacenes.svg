<svg xmlns="http://www.w3.org/2000/svg" width="1220" height="760" viewBox="0 0 1220 760" role="img" aria-label="Variante conceptual: proyección asíncrona"><title>Variante conceptual: proyección asíncrona</title><desc>Este módulo no implementa outbox ni un segundo almacén de lectura.</desc><defs><marker id="blue" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10Z" fill="#247397"/></marker><marker id="green" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10Z" fill="#177D65"/></marker><marker id="gold" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10Z" fill="#98621C"/></marker><marker id="teal" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10Z" fill="#147E92"/></marker><marker id="red" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10Z" fill="#A23D48"/></marker><marker id="gray" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10Z" fill="#526779"/></marker></defs><rect width="1220" height="760" rx="20" fill="#F8FAFC"/><rect x="38" y="31" width="7" height="62" rx="3" fill="#147E92"/><text x="65" y="65" text-anchor="start" font-family="DejaVu Sans,Arial,sans-serif" font-size="28" font-weight="700" fill="#17314A">Variante conceptual: proyección asíncrona</text><text x="65" y="102" text-anchor="start" font-family="DejaVu Sans,Arial,sans-serif" font-size="18" font-weight="400" fill="#526779">Este módulo no implementa outbox ni un segundo almacén de lectura.</text><line x1="45" y1="128" x2="1175" y2="128" stroke="#D3E1EB"/><path d="M380,295.0 H412.5 V295.0 H445" fill="none" stroke="#147E92" stroke-width="3" marker-end="url(#teal)"/><rect x="387.5" y="268.0" width="50.0" height="23" rx="5" fill="#F8FAFC"/><text x="412.5" y="285.0" text-anchor="middle" font-family="DejaVu Sans,Arial,sans-serif" font-size="13" font-weight="400" fill="#147E92">envía</text><path d="M755,295.0 H787.5 V295.0 H820" fill="none" stroke="#147E92" stroke-width="3" marker-end="url(#teal)"/><rect x="754.9" y="268.0" width="65.19999999999999" height="23" rx="5" fill="#F8FAFC"/><text x="787.5" y="285.0" text-anchor="middle" font-family="DejaVu Sans,Arial,sans-serif" font-size="13" font-weight="400" fill="#147E92">propaga</text><rect x="70" y="205" width="310" height="180" rx="15" fill="#E7F6EE" stroke="#177D65" stroke-width="2"/><rect x="70" y="205" width="7" height="180" rx="3" fill="#177D65"/><text x="225.0" y="237" text-anchor="middle" font-family="DejaVu Sans,Arial,sans-serif" font-size="20" font-weight="700" fill="#177D65">Escritura local</text><text x="225.0" y="267" text-anchor="middle" font-family="DejaVu Sans,Arial,sans-serif" font-size="17" font-weight="400" fill="#17314A">Orden + evento pendiente</text><text x="225.0" y="291" text-anchor="middle" font-family="DejaVu Sans,Arial,sans-serif" font-size="17" font-weight="400" fill="#17314A">en una transacción</text><rect x="445" y="205" width="310" height="180" rx="15" fill="#E7F6F6" stroke="#147E92" stroke-width="2"/><rect x="445" y="205" width="7" height="180" rx="3" fill="#147E92"/><text x="600.0" y="237" text-anchor="middle" font-family="DejaVu Sans,Arial,sans-serif" font-size="20" font-weight="700" fill="#147E92">Publicador</text><text x="600.0" y="267" text-anchor="middle" font-family="DejaVu Sans,Arial,sans-serif" font-size="17" font-weight="400" fill="#17314A">Lee outbox</text><text x="600.0" y="291" text-anchor="middle" font-family="DejaVu Sans,Arial,sans-serif" font-size="17" font-weight="400" fill="#17314A">y reintenta entrega</text><rect x="820" y="205" width="310" height="180" rx="15" fill="#EBF3F9" stroke="#247397" stroke-width="2"/><rect x="820" y="205" width="7" height="180" rx="3" fill="#247397"/><text x="975.0" y="237" text-anchor="middle" font-family="DejaVu Sans,Arial,sans-serif" font-size="20" font-weight="700" fill="#247397">Proyección de lectura</text><text x="975.0" y="267" text-anchor="middle" font-family="DejaVu Sans,Arial,sans-serif" font-size="17" font-weight="400" fill="#17314A">Consume con idempotencia</text><text x="975.0" y="291" text-anchor="middle" font-family="DejaVu Sans,Arial,sans-serif" font-size="17" font-weight="400" fill="#17314A">y actualiza la vista</text><rect x="295" y="480" width="630" height="130" rx="15" fill="#FEF5E9" stroke="#98621C" stroke-width="2"/><rect x="295" y="480" width="7" height="130" rx="3" fill="#98621C"/><text x="610.0" y="512" text-anchor="middle" font-family="DejaVu Sans,Arial,sans-serif" font-size="20" font-weight="700" fill="#98621C">Ventana de retraso</text><text x="610.0" y="542" text-anchor="middle" font-family="DejaVu Sans,Arial,sans-serif" font-size="17" font-weight="400" fill="#17314A">La lectura puede ir por detrás; observar versión y</text><text x="610.0" y="566" text-anchor="middle" font-family="DejaVu Sans,Arial,sans-serif" font-size="17" font-weight="400" fill="#17314A">recuperar fallos</text><line x1="45" y1="670" x2="1175" y2="670" stroke="#D3E1EB"/><text x="60" y="701" text-anchor="start" font-family="DejaVu Sans,Arial,sans-serif" font-size="17" font-weight="400" fill="#526779">Dos almacenes no mejoran un sistema por sí solos. Deben diseñarse duplicados, orden, reconstrucción y</text><text x="60" y="726" text-anchor="start" font-family="DejaVu Sans,Arial,sans-serif" font-size="17" font-weight="400" fill="#526779">retraso tolerable.</text></svg>