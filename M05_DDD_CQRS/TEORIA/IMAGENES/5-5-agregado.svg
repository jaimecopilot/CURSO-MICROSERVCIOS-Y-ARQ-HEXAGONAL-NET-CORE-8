f" font-size="20" font-weight="700" fill="#177D65">OrdenProduccion</text><text x="605.0" y="287" text-anchor="middle" font-family="DejaVu Sans,Arial,sans-serif" font-size="17" font-weight="400" fill="#17314A">Identidad, estado</text><text x="605.0" y="311" text-anchor="middle" font-family="DejaVu Sans,Arial,sans-serif" font-size="17" font-weight="400" fill="#17314A">y capacidad total</text><rect x="450" y="455" width="310" height="160" rx="15" fill="#E7F6F6" stroke="#147E92" stroke-width="2"/><rect x="450" y="455" width="7" height="160" rx="3" fill="#147E92"/><text x="605.0" y="487" text-anchor="middle" font-family="DejaVu Sans,Arial,sans-serif" font-size="20" font-weight="700" fill="#147E92">LineaDeOrden</text><text x="605.0" y="517" text-anchor="middle" font-family="DejaVu Sans,Arial,sans-serif" font-size="17" font-weight="400" fill="#17314A">Identidad propia</text><text x="605.0" y="541" text-anchor="middle" font-family="DejaVu Sans,Arial,sans-serif" font-size="17" font-weight="400" fill="#17314A">Cantidad y material</text><rect x="840" y="455" width="300" height="160" rx="15" fill="#FEF5E9" stroke="#98621C" stroke-width="2"/><rect x="840" y="455" width="7" height="160" rx="3" fill="#98621C"/><text x="990.0" y="487" text-anchor="middle" font-family="DejaVu Sans,Arial,sans-serif" font-size="20" font-weight="700" fill="#98621C">Value objects</text><text x="990.0" y="517" text-anchor="middle" font-family="DejaVu Sans,Arial,sans-serif" font-size="17" font-weight="400" fill="#17314A">NombreMaterial</text><text x="990.0" y="541" text-anchor="middle" font-family="DejaVu Sans,Arial,sans-serif" font-size="17" font-weight="400" fill="#17314A">CantidadProduccion</text><line x1="45" y1="670" x2="1175" y2="670" stroke="#D3E1EB"/><text x="60" y="701" text-anchor="start" font-family="DejaVu Sans,Arial,sans-serif" font-size="17" font-weight="400" fill="#526779">No se modifican hijos saltándose la raíz. La relación con otros contextos se diseña con referencias y</text><text x="60" y="726" text-anchor="start" font-family="DejaVu Sans,Arial,sans-serif" font-size="17" font-weight="400" fill="#526779">contratos explícitos.</text></svg>