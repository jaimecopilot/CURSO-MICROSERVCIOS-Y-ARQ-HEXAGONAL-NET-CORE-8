<svg xmlns="http://www.w3.org/2000/svg" width="1220" height="760" viewBox="0 0 1220 760" role="img" aria-label="CQRS: dos responsabilidades, una base SQL Server"><title>CQRS: dos responsabilidades, una base SQL Server</title><desc>La consulta posterior verifica datos confirmados desde un contexto nuevo.</desc><defs><marker id="blue" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10Z" fill="#247397"/></marker><marker id="green" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10Z" fill="#177D65"/></marker><marker id="gold" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10Z" fill="#98621C"/></marker><marker id="red" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10Z" fill="#A23D48"/></marker><marker id="gray" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10Z" fill="#526779"/></marker></defs><rect width="1220" height="760" rx="20" fill="#F8FAFC"/><rect x="38" y="31" width="7" height="62" rx="3" fill="#247397"/><text x="65" y="65" text-anchor="start" font-family="DejaVu Sans,Arial,sans-serif" font-size="27" font-weight="700" fill="#17314A">CQRS: dos responsabilidades, una base SQL Server</text><text x="65" y="103" text-anchor="start" font-family="DejaVu Sans,Arial,sans-serif" font-size="18" font-weight="400" fill="#526779">La consulta posterior verifica datos confirmados desde un contexto nuevo.</text><line x1="45" y1="130" x2="1175" y2="130" stroke="#D3E1EB"/><rect x="55" y="175" width="330" height="155" rx="15" fill="#FEF5E9" stroke="#98621C" stroke-width="2"/><text x="220.0" y="208" text-anchor="middle" font-family="DejaVu Sans,Arial,sans-serif" font-size="21" font-weight="700" fill="#98621C">Command</text><text x="220.0" y="244" text-anchor="middle" font-family="DejaVu Sans,Arial,sans-serif" font-size="18" font-weight="400" fill="#17314A">Crear o modificar la orden</text><text x="220.0" y="269" text-anchor="middle" font-family="DejaVu Sans,Arial,sans-serif" font-size="18" font-weight="400" fill="#17314A">Handler y caso de uso</text><rect x="445" y="175" width="330" height="155" rx="15" fill="#E7F6EE" stroke="#177D65" stroke-width="2"/><text x="610.0" y="208" text-anchor="middle" font-family="DejaVu Sans,Arial,sans-serif" font-size="21" font-weight="700" fill="#177D65">Agregado</text><text x="610.0" y="244" text-anchor="middle" font-family="DejaVu Sans,Arial,sans-serif" font-size="18" font-weight="400" fill="#17314A">Orden y líneas</text><text x="610.0" y="269" text-anchor="middle" font-family="DejaVu Sans,Arial,sans-serif" font-size="18" font-weight="400" fill="#17314A">Protege las invariantes</text><rect x="835" y="175" width="330" height="155" rx="15" fill="#EBF3F9" stroke="#247397" stroke-width="2"/><text x="1000.0" y="208" text-anchor="middle" font-family="DejaVu Sans,Arial,sans-serif" font-size="21" font-weight="700" fill="#247397">Confirmación</text><text x="1000.0" y="244" text-anchor="middle" font-family="DejaVu Sans,Arial,sans-serif" font-size="18" font-weight="400" fill="#17314A">SaveChangesAsync</text><text x="1000.0" y="269" text-anchor="middle" font-family="DejaVu Sans,Arial,sans-serif" font-size="18" font-weight="400" fill="#17314A">Transacción local</text><path d="M385,252 L445,252" stroke="#247397" stroke-width="3" fill="none" marker-end="url(#blue)"/><path d="M775,252 L835,252" stroke="#247397" stroke-width="3" fill="none" marker-end="url(#blue)"/><rect x="55" y="440" width="330" height="155" rx="15" fill="#E7F6EE" stroke="#177D65" stroke-width="2"/><text x="220.0" y="473" text-anchor="middle" font-family="DejaVu Sans,Arial,sans-serif" font-size="21" font-weight="700" fill="#177D65">DTO de respuesta</text><text x="220.0" y="509" text-anchor="middle" font-family="DejaVu Sans,Arial,sans-serif" font-size="18" font-weight="400" fill="#17314A">Datos de lectura</text><text x="220.0" y="534" text-anchor="middle" font-family="DejaVu Sans,Arial,sans-serif" font-size="18" font-weight="400" fill="#17314A">No modifica el agregado</text><rect x="445" y="440" width="330" height="155" rx="15" fill="#FEF5E9" stroke="#98621C" stroke-width="2"/><text x="610.0" y="473" text-anchor="middle" font-family="DejaVu Sans,Arial,sans-serif" font-size="21" font-weight="700" fill="#98621C">Query</text><text x="610.0" y="509" text-anchor="middle" font-family="DejaVu Sans,Arial,sans-serif" font-size="18" font-weight="400" fill="#17314A">Contexto nuevo</text><text x="610.0" y="534" text-anchor="middle" font-family="DejaVu Sans,Arial,sans-serif" font-size="18" font-weight="400" fill="#17314A">Proyección sin tracking</text><rect x="835" y="440" width="330" height="155" rx="15" fill="#F1F5F8" stroke="#526779" stroke-width="2"/><text x="1000.0" y="473" text-anchor="middle" font-family="DejaVu Sans,Arial,sans-serif" font-size="21" font-weight="700" fill="#526779">Base de Producción</text><text x="1000.0" y="509" text-anchor="middle" font-family="DejaVu Sans,Arial,sans-serif" font-size="18" font-weight="400" fill="#17314A">SQL Server real</text><text x="1000.0" y="534" text-anchor="middle" font-family="DejaVu Sans,Arial,sans-serif" font-size="18" font-weight="400" fill="#17314A">Órdenes y líneas persistidas</text><path d="M1000,330 L1000,440" stroke="#247397" stroke-width="3" fill="none" marker-end="url(#blue)"/><rect x="961.7421875" y="373" width="76.515625" height="26" rx="5" fill="#F8FAFC"/><text x="1000" y="392" text-anchor="middle" font-family="DejaVu Sans,Arial,sans-serif" font-size="16" font-weight="400" fill="#247397">commit</text><path d="M835,517 L775,517" stroke="#247397" stroke-width="3" fill="none" marker-end="url(#blue)"/><path d="M445,517 L385,517" stroke="#247397" stroke-width="3" fill="none" marker-end="url(#blue)"/><line x1="45" y1="655" x2="1175" y2="655" stroke="#D3E1EB"/><text x="65" y="692" text-anchor="start" font-family="DejaVu Sans,Arial,sans-serif" font-size="18" font-weight="400" fill="#526779">El test espera a que termine el command y después lee la misma base. Esta variante no añade una réplica ni una</text><text x="65" y="717" text-anchor="start" font-family="DejaVu Sans,Arial,sans-serif" font-size="18" font-weight="400" fill="#526779">proyección asíncrona.</text></svg>