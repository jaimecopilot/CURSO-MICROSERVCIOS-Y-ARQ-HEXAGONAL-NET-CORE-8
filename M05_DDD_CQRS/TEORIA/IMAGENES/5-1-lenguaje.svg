2.8" height="23" rx="5" fill="#F8FAFC"/><text x="410.0" y="275.0" text-anchor="middle" font-family="DejaVu Sans,Arial,sans-serif" font-size="13" font-weight="400" fill="#147E92">acuerdan</text><path d="M755,285.0 H790.0 V285.0 H825" fill="none" stroke="#147E92" stroke-width="3" marker-end="url(#teal)"/><rect x="757.4" y="258.0" width="65.19999999999999" height="23" rx="5" fill="#F8FAFC"/><text x="790.0" y="275.0" text-anchor="middle" font-family="DejaVu Sans,Arial,sans-serif" font-size="13" font-weight="400" fill="#147E92">expresa</text><path d="M980.0,365 V412.5 H600.0 V460" fill="none" stroke="#147E92" stroke-width="3" marker-end="url(#teal)"/><rect x="753.6" y="386.5" width="72.8" height="23" rx="5" fill="#F8FAFC"/><text x="790.0" y="403.5" text-anchor="middle" font-family="DejaVu Sans,Arial,sans-serif" font-size="13" font-weight="400" fill="#147E92">verifica</text><rect x="65" y="205" width="310" height="160" rx="15" fill="#EBF3F9" stroke="#247397" stroke-width="2"/><rect x="65" y="205" width="7" height="160" rx="3" fill="#247397"/><text x="220.0" y="237" text-anchor="middle" font-family="DejaVu Sans,Arial,sans-serif" font-size="20" font-weight="700" fill="#247397">Expertos de Producción</text><text x="220.0" y="267" text-anchor="middle" font-family="DejaVu Sans,Arial,sans-serif" font-size="17" font-weight="400" fill="#17314A">Explican qué significa</text><text x="220.0" y="291" text-anchor="middle" font-family="DejaVu Sans,Arial,sans-serif" font-size="17" font-weight="400" fill="#17314A">planificar</text><rect x="445" y="205" width="310" height="160" rx="15" fill="#E7F6F6" stroke="#147E92" stroke-width="2"/><rect x="445" y="205" width="7" height="160" rx="3" fill="#147E92"/><text x="600.0" y="237" text-anchor="middle" font-family="DejaVu Sans,Arial,sans-serif" font-size="20" font-weight="700" fill="#147E92">Lenguaje ubicuo</text><text x="600.0" y="267" text-anchor="middle" font-family="DejaVu Sans,Arial,sans-serif" font-size="17" font-weight="400" fill="#17314A">Orden, línea, capacidad,</text><text x="600.0" y="291" text-anchor="middle" font-family="DejaVu Sans,Arial,sans-serif" font-size="17" font-weight="400" fill="#17314A">estado</text><rect x="825" y="205" width="310" height="160" rx="15" fill="#E7F6EE" stroke="#177D65" stroke-width="2"/><rect x="825" y="205" width="7" height="160" rx="3" fill="#177D65"/><text x="980.0" y="237" text-anchor="middle" font-family="DejaVu Sans,Arial,sans-serif" font-size="20" font-weight="700" fill="#177D65">Modelo de dominio</text><text x="980.0" y="267" text-anchor="middle" font-family="DejaVu Sans,Arial,sans-serif" font-size="17" font-weight="400" fill="#17314A">Métodos y reglas con esos</text><text x="980.0" y="291" text-anchor="middle" font-family="DejaVu Sans,Arial,sans-serif" font-size="17" font-weight="400" fill="#17314A">nombres</text><rect x="445" y="460" width="310" height="160" rx="15" fill="#FEF5E9" stroke="#98621C" stroke-width="2"/><rect x="445" y="460" width="7" height="160" rx="3" fill="#98621C"/><text x="600.0" y="492" text-anchor="middle" font-family="DejaVu Sans,Arial,sans-serif" font-size="20" font-weight="700" fill="#98621C">Ejemplos verificables</text><text x="600.0" y="522" text-anchor="middle" font-family="DejaVu Sans,Arial,sans-serif" font-size="17" font-weight="400" fill="#17314A">Borrador no puede</text><text x="600.0" y="546" text-anchor="middle" font-family="DejaVu Sans,Arial,sans-serif" font-size="17" font-weight="400" fill="#17314A">finalizarse directamente</text><line x1="45" y1="670" x2="1175" y2="670" stroke="#D3E1EB"/><text x="60" y="701" text-anchor="start" font-family="DejaVu Sans,Arial,sans-serif" font-size="17" font-weight="400" fill="#526779">La comprensión del negocio precede a los detalles de persistencia. Una prueba de catálogo no sustituye una</text><text x="60" y="726" text-anchor="start" font-family="DejaVu Sans,Arial,sans-serif" font-size="17" font-weight="400" fill="#526779">regla ejecutada.</text></svg>