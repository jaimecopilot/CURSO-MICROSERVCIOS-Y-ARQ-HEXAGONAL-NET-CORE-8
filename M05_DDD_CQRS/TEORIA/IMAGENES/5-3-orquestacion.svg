al)"/><rect x="377.4" y="235.5" width="65.19999999999999" height="23" rx="5" fill="#F8FAFC"/><text x="410.0" y="252.5" text-anchor="middle" font-family="DejaVu Sans,Arial,sans-serif" font-size="13" font-weight="400" fill="#147E92">entrada</text><path d="M755,262.5 H790.0 V262.5 H825" fill="none" stroke="#147E92" stroke-width="3" marker-end="url(#teal)"/><rect x="757.4" y="235.5" width="65.19999999999999" height="23" rx="5" fill="#F8FAFC"/><text x="790.0" y="252.5" text-anchor="middle" font-family="DejaVu Sans,Arial,sans-serif" font-size="13" font-weight="400" fill="#147E92">prepara</text><path d="M980.0,335 V392.5 H980.0 V450" fill="none" stroke="#147E92" stroke-width="3" marker-end="url(#teal)"/><rect x="920.8" y="366.5" width="118.39999999999999" height="23" rx="5" fill="#F8FAFC"/><text x="980.0" y="383.5" text-anchor="middle" font-family="DejaVu Sans,Arial,sans-serif" font-size="13" font-weight="400" fill="#147E92">mismo contexto</text><path d="M825,525.0 H790.0 V525.0 H755" fill="none" stroke="#147E92" stroke-width="3" marker-end="url(#teal)"/><rect x="765.0" y="498.0" width="50.0" height="23" rx="5" fill="#F8FAFC"/><text x="790.0" y="515.0" text-anchor="middle" font-family="DejaVu Sans,Arial,sans-serif" font-size="13" font-weight="400" fill="#147E92">éxito</text><rect x="65" y="190" width="310" height="145" rx="15" fill="#EBF3F9" stroke="#247397" stroke-width="2"/><rect x="65" y="190" width="7" height="145" rx="3" fill="#247397"/><text x="220.0" y="222" text-anchor="middle" font-family="DejaVu Sans,Arial,sans-serif" font-size="20" font-weight="700" fill="#247397">Intención de crear</text><text x="220.0" y="252" text-anchor="middle" font-family="DejaVu Sans,Arial,sans-serif" font-size="17" font-weight="400" fill="#17314A">Datos y CancellationToken</text><rect x="445" y="190" width="310" height="145" rx="15" fill="#E7F6EE" stroke="#177D65" stroke-width="2"/><rect x="445" y="190" width="7" height="145" rx="3" fill="#177D65"/><text x="600.0" y="222" text-anchor="middle" font-family="DejaVu Sans,Arial,sans-serif" font-size="20" font-weight="700" fill="#177D65">Caso de uso</text><text x="600.0" y="252" text-anchor="middle" font-family="DejaVu Sans,Arial,sans-serif" font-size="17" font-weight="400" fill="#17314A">Construye el agregado</text><text x="600.0" y="276" text-anchor="middle" font-family="DejaVu Sans,Arial,sans-serif" font-size="17" font-weight="400" fill="#17314A">válido</text><rect x="825" y="190" width="310" height="145" rx="15" fill="#E7F6F6" stroke="#147E92" stroke-width="2"/><rect x="825" y="190" width="7" height="145" rx="3" fill="#147E92"/><text x="980.0" y="222" text-anchor="middle" font-family="DejaVu Sans,Arial,sans-serif" font-size="20" font-weight="700" fill="#147E92">Repositorio</text><text x="980.0" y="252" text-anchor="middle" font-family="DejaVu Sans,Arial,sans-serif" font-size="17" font-weight="400" fill="#17314A">Prepara el alta</text><rect x="445" y="450" width="310" height="150" rx="15" fill="#E7F6EE" stroke="#177D65" stroke-width="2"/><rect x="445" y="450" width="7" height="150" rx="3" fill="#177D65"/><text x="600.0" y="482" text-anchor="middle" font-family="DejaVu Sans,Arial,sans-serif" font-size="20" font-weight="700" fill="#177D65">Resultado de éxito</text><text x="600.0" y="512" text-anchor="middle" font-family="DejaVu Sans,Arial,sans-serif" font-size="17" font-weight="400" fill="#17314A">Solo después del commit</text><rect x="825" y="450" width="310" height="150" rx="15" fill="#FEF5E9" stroke="#98621C" stroke-width="2"/><rect x="825" y="450" width="7" height="150" rx="3" fill="#98621C"/><text x="980.0" y="482" text-anchor="middle" font-family="DejaVu Sans,Arial,sans-serif" font-size="20" font-weight="700" fill="#98621C">Unidad de trabajo</text><text x="980.0" y="512" text-anchor="middle" font-family="DejaVu Sans,Arial,sans-serif" font-size="17" font-weight="400" fill="#17314A">Confirma cambios</text><text x="980.0" y="536" text-anchor="middle" font-family="DejaVu Sans,Arial,sans-serif" font-size="17" font-weight="400" fill="#17314A">pendientes</text><line x1="45" y1="670" x2="1175" y2="670" stroke="#D3E1EB"/><text x="60" y="701" text-anchor="start" font-family="DejaVu Sans,Arial,sans-serif" font-size="17" font-weight="400" fill="#526779">La cancelación se propaga a los puertos. Un fallo técnico de confirmación no debe transformarse en un éxito</text><text x="60" y="726" text-anchor="start" font-family="DejaVu Sans,Arial,sans-serif" font-size="17" font-weight="400" fill="#526779">de negocio.</text></svg>