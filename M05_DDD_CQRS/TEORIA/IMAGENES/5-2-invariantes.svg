<svg xmlns="http://www.w3.org/2000/svg" width="1220" height="760" viewBox="0 0 1220 760" role="img" aria-label="La raíz protege las reglas del conjunto"><title>La raíz protege las reglas del conjunto</title><desc>Una línea válida no basta si el total de la orden supera su capacidad.</desc><defs><marker id="blue" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10Z" fill="#247397"/></marker><marker id="green" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10Z" fill="#177D65"/></marker><marker id="gold" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10Z" fill="#98621C"/></marker><marker id="teal" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10Z" fill="#147E92"/></marker><marker id="red" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10Z" fill="#A23D48"/></marker><marker id="gray" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10Z" fill="#526779"/></marker></defs><rect width="1220" height="760" rx="20" fill="#F8FAFC"/><rect x="38" y="31" width="7" height="62" rx="3" fill="#147E92"/><text x="65" y="65" text-anchor="start" font-family="DejaVu Sans,Arial,sans-serif" font-size="28" font-weight="700" fill="#17314A">La raíz protege las reglas del conjunto</text><text x="65" y="102" text-anchor="start" font-family="DejaVu Sans,Arial,sans-serif" font-size="18" font-weight="400" fill="#526779">Una línea válida no basta si el total de la orden supera su capacidad.</text><line x1="45" y1="128" x2="1175" y2="128" stroke="#D3E1EB"/><path d="M390,270.0 H417.5 V270.0 H445" fill="none" stroke="#147E92" stroke-width="3" marker-end="url(#teal)"/><rect x="377.3" y="243.0" width="80.39999999999999" height="23" rx="5" fill="#F8FAFC"/><text x="417.5" y="260.0" text-anchor="middle" font-family="DejaVu Sans,Arial,sans-serif" font-size="13" font-weight="400" fill="#147E92">intención</text><path d="M770,270.0 H797.5 V270.0 H825" fill="none" stroke="#A23D48" stroke-width="3" marker-end="url(#red)"/><rect x="764.9" y="243.0" width="65.19999999999999" height="23" rx="5" fill="#F8FAFC"/><text x="797.5" y="260.0" text-anchor="middle" font-family="DejaVu Sans,Arial,sans-serif" font-size="13" font-weight="400" fill="#A23D48">rechaza</text><path d="M390,525.0 H417.5 V525.0 H445" fill="none" stroke="#177D65" stroke-width="3" marker-end="url(#green)"/><rect x="388.7" y="498.0" width="57.599999999999994" height="23" rx="5" fill="#F8FAFC"/><text x="417.5" y="515.0" text-anchor="middle" font-family="DejaVu Sans,Arial,sans-serif" font-size="13" font-weight="400" fill="#177D65">acepta</text><rect x="65" y="195" width="325" height="150" rx="15" fill="#EBF3F9" stroke="#247397" stroke-width="2"/><rect x="65" y="195" width="7" height="150" rx="3" fill="#247397"/><text x="227.5" y="227" text-anchor="middle" font-family="DejaVu Sans,Arial,sans-serif" font-size="20" font-weight="700" fill="#247397">Añadir una línea</text><text x="227.5" y="257" text-anchor="middle" font-family="DejaVu Sans,Arial,sans-serif" font-size="17" font-weight="400" fill="#17314A">Cantidad solicitada: 40</text><rect x="445" y="195" width="325" height="150" rx="15" fill="#E7F6F6" stroke="#147E92" stroke-width="2"/><rect x="445" y="195" width="7" height="150" rx="3" fill="#147E92"/><text x="607.5" y="227" text-anchor="middle" font-family="DejaVu Sans,Arial,sans-serif" font-size="20" font-weight="700" fill="#147E92">OrdenProduccion</text><text x="607.5" y="257" text-anchor="middle" font-family="DejaVu Sans,Arial,sans-serif" font-size="17" font-weight="400" fill="#17314A">Estado permitido</text><text x="607.5" y="281" text-anchor="middle" font-family="DejaVu Sans,Arial,sans-serif" font-size="17" font-weight="400" fill="#17314A">Total actual: 480</text><rect x="825" y="195" width="325" height="150" rx="15" fill="#FFF0F1" stroke="#A23D48" stroke-width="2"/><rect x="825" y="195" width="7" height="150" rx="3" fill="#A23D48"/><text x="987.5" y="227" text-anchor="middle" font-family="DejaVu Sans,Arial,sans-serif" font-size="20" font-weight="700" fill="#A23D48">Rechazo sin mutación</text><text x="987.5" y="257" text-anchor="middle" font-family="DejaVu Sans,Arial,sans-serif" font-size="17" font-weight="400" fill="#17314A">480 + 40 supera 500</text><rect x="65" y="450" width="325" height="150" rx="15" fill="#EBF3F9" stroke="#247397" stroke-width="2"/><rect x="65" y="450" width="7" height="150" rx="3" fill="#247397"/><text x="227.5" y="482" text-anchor="middle" font-family="DejaVu Sans,Arial,sans-serif" font-size="20" font-weight="700" fill="#247397">Entrada alternativa</text><text x="227.5" y="512" text-anchor="middle" font-family="DejaVu Sans,Arial,sans-serif" font-size="17" font-weight="400" fill="#17314A">Cantidad solicitada: 20</text><rect x="445" y="450" width="325" height="150" rx="15" fill="#E7F6EE" stroke="#177D65" stroke-width="2"/><rect x="445" y="450" width="7" height="150" rx="3" fill="#177D65"/><text x="607.5" y="482" text-anchor="middle" font-family="DejaVu Sans,Arial,sans-serif" font-size="20" font-weight="700" fill="#177D65">Nuevo estado válido</text><text x="607.5" y="512" text-anchor="middle" font-family="DejaVu Sans,Arial,sans-serif" font-size="17" font-weight="400" fill="#17314A">480 + 20 = 500</text><text x="607.5" y="536" text-anchor="middle" font-family="DejaVu Sans,Arial,sans-serif" font-size="17" font-weight="400" fill="#17314A">La raíz incorpora la línea</text><line x1="45" y1="670" x2="1175" y2="670" stroke="#D3E1EB"/><text x="60" y="701" text-anchor="start" font-family="DejaVu Sans,Arial,sans-serif" font-size="17" font-weight="400" fill="#526779">La capacidad de 500 es una regla didáctica. La validación debe ocurrir antes de modificar la colección o</text><text x="60" y="726" text-anchor="start" font-family="DejaVu Sans,Arial,sans-serif" font-size="17" font-weight="400" fill="#526779">anunciar éxito.</text></svg>