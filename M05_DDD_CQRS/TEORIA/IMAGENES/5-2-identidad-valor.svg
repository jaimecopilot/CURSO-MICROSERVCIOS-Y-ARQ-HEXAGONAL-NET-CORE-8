="255.5" width="148.79999999999998" height="23" rx="5" fill="#F8FAFC"/><text x="610.0" y="272.5" text-anchor="middle" font-family="DejaVu Sans,Arial,sans-serif" font-size="13" font-weight="400" fill="#147E92">conserva identidad</text><path d="M520,532.5 H610.0 V532.5 H700" fill="none" stroke="#147E92" stroke-width="3" marker-end="url(#teal)"/><rect x="535.6" y="505.5" width="148.79999999999998" height="23" rx="5" fill="#F8FAFC"/><text x="610.0" y="522.5" text-anchor="middle" font-family="DejaVu Sans,Arial,sans-serif" font-size="13" font-weight="400" fill="#147E92">igualdad por valor</text><rect x="80" y="205" width="440" height="155" rx="15" fill="#E7F6EE" stroke="#177D65" stroke-width="2"/><rect x="80" y="205" width="7" height="155" rx="3" fill="#177D65"/><text x="300.0" y="237" text-anchor="middle" font-family="DejaVu Sans,Arial,sans-serif" font-size="20" font-weight="700" fill="#177D65">Orden · identidad A</text><text x="300.0" y="267" text-anchor="middle" font-family="DejaVu Sans,Arial,sans-serif" font-size="17" font-weight="400" fill="#17314A">Borrador</text><text x="300.0" y="291" text-anchor="middle" font-family="DejaVu Sans,Arial,sans-serif" font-size="17" font-weight="400" fill="#17314A">Total 20</text><rect x="700" y="205" width="440" height="155" rx="15" fill="#E7F6EE" stroke="#177D65" stroke-width="2"/><rect x="700" y="205" width="7" height="155" rx="3" fill="#177D65"/><text x="920.0" y="237" text-anchor="middle" font-family="DejaVu Sans,Arial,sans-serif" font-size="20" font-weight="700" fill="#177D65">Orden · identidad A</text><text x="920.0" y="267" text-anchor="middle" font-family="DejaVu Sans,Arial,sans-serif" font-size="17" font-weight="400" fill="#17314A">Planificada</text><text x="920.0" y="291" text-anchor="middle" font-family="DejaVu Sans,Arial,sans-serif" font-size="17" font-weight="400" fill="#17314A">Total 20</text><rect x="80" y="455" width="440" height="155" rx="15" fill="#EBF3F9" stroke="#247397" stroke-width="2"/><rect x="80" y="455" width="7" height="155" rx="3" fill="#247397"/><text x="300.0" y="487" text-anchor="middle" font-family="DejaVu Sans,Arial,sans-serif" font-size="20" font-weight="700" fill="#247397">CantidadProduccion(20)</text><text x="300.0" y="517" text-anchor="middle" font-family="DejaVu Sans,Arial,sans-serif" font-size="17" font-weight="400" fill="#17314A">Instancia uno</text><rect x="700" y="455" width="440" height="155" rx="15" fill="#E7F6F6" stroke="#147E92" stroke-width="2"/><rect x="700" y="455" width="7" height="155" rx="3" fill="#147E92"/><text x="920.0" y="487" text-anchor="middle" font-family="DejaVu Sans,Arial,sans-serif" font-size="20" font-weight="700" fill="#147E92">CantidadProduccion(20)</text><text x="920.0" y="517" text-anchor="middle" font-family="DejaVu Sans,Arial,sans-serif" font-size="17" font-weight="400" fill="#17314A">Instancia dos</text><text x="920.0" y="541" text-anchor="middle" font-family="DejaVu Sans,Arial,sans-serif" font-size="17" font-weight="400" fill="#17314A">Valor equivalente</text><line x1="45" y1="670" x2="1175" y2="670" stroke="#D3E1EB"/><text x="60" y="701" text-anchor="start" font-family="DejaVu Sans,Arial,sans-serif" font-size="17" font-weight="400" fill="#526779">Una entidad puede tener representación inmutable. Un value object no tiene identidad independiente y se</text><text x="60" y="726" text-anchor="start" font-family="DejaVu Sans,Arial,sans-serif" font-size="17" font-weight="400" fill="#526779">reemplaza por otro valor.</text></svg>