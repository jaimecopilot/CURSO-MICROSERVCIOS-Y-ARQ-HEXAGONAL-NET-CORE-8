er-end="url(#teal)"/><rect x="381.2" y="258.0" width="57.599999999999994" height="23" rx="5" fill="#F8FAFC"/><text x="410.0" y="275.0" text-anchor="middle" font-family="DejaVu Sans,Arial,sans-serif" font-size="13" font-weight="400" fill="#147E92">invoca</text><path d="M755,285.0 H790.0 V285.0 H825" fill="none" stroke="#147E92" stroke-width="3" marker-end="url(#teal)"/><rect x="753.6" y="258.0" width="72.8" height="23" rx="5" fill="#F8FAFC"/><text x="790.0" y="275.0" text-anchor="middle" font-family="DejaVu Sans,Arial,sans-serif" font-size="13" font-weight="400" fill="#147E92">consulta</text><path d="M980.0,365 V417.5 H600.0 V470" fill="none" stroke="#147E92" stroke-width="3" marker-end="url(#teal)"/><rect x="753.6" y="391.5" width="72.8" height="23" rx="5" fill="#F8FAFC"/><text x="790.0" y="408.5" text-anchor="middle" font-family="DejaVu Sans,Arial,sans-serif" font-size="13" font-weight="400" fill="#147E92">devuelve</text><rect x="65" y="205" width="310" height="160" rx="15" fill="#EBF3F9" stroke="#247397" stroke-width="2"/><rect x="65" y="205" width="7" height="160" rx="3" fill="#247397"/><text x="220.0" y="237" text-anchor="middle" font-family="DejaVu Sans,Arial,sans-serif" font-size="20" font-weight="700" fill="#247397">Query handler</text><text x="220.0" y="267" text-anchor="middle" font-family="DejaVu Sans,Arial,sans-serif" font-size="17" font-weight="400" fill="#17314A">Detalle o lista de órdenes</text><rect x="445" y="205" width="310" height="160" rx="15" fill="#E7F6F6" stroke="#147E92" stroke-width="2"/><rect x="445" y="205" width="7" height="160" rx="3" fill="#147E92"/><text x="600.0" y="237" text-anchor="middle" font-family="DejaVu Sans,Arial,sans-serif" font-size="20" font-weight="700" fill="#147E92">Puerto de lectura</text><text x="600.0" y="267" text-anchor="middle" font-family="DejaVu Sans,Arial,sans-serif" font-size="17" font-weight="400" fill="#17314A">IOrdenProduccionLecturas</text><rect x="825" y="205" width="310" height="160" rx="15" fill="#FEF5E9" stroke="#98621C" stroke-width="2"/><rect x="825" y="205" width="7" height="160" rx="3" fill="#98621C"/><text x="980.0" y="237" text-anchor="middle" font-family="DejaVu Sans,Arial,sans-serif" font-size="20" font-weight="700" fill="#98621C">Adaptador EF Core</text><text x="980.0" y="267" text-anchor="middle" font-family="DejaVu Sans,Arial,sans-serif" font-size="17" font-weight="400" fill="#17314A">AsNoTracking</text><text x="980.0" y="291" text-anchor="middle" font-family="DejaVu Sans,Arial,sans-serif" font-size="17" font-weight="400" fill="#17314A">Proyección de columnas</text><rect x="445" y="470" width="310" height="150" rx="15" fill="#E7F6EE" stroke="#177D65" stroke-width="2"/><rect x="445" y="470" width="7" height="150" rx="3" fill="#177D65"/><text x="600.0" y="502" text-anchor="middle" font-family="DejaVu Sans,Arial,sans-serif" font-size="20" font-weight="700" fill="#177D65">DTO de aplicación</text><text x="600.0" y="532" text-anchor="middle" font-family="DejaVu Sans,Arial,sans-serif" font-size="17" font-weight="400" fill="#17314A">Identidad, estado y datos</text><text x="600.0" y="556" text-anchor="middle" font-family="DejaVu Sans,Arial,sans-serif" font-size="17" font-weight="400" fill="#17314A">según el contrato</text><line x1="45" y1="670" x2="1175" y2="670" stroke="#D3E1EB"/><text x="60" y="701" text-anchor="start" font-family="DejaVu Sans,Arial,sans-serif" font-size="17" font-weight="400" fill="#526779">No se llama a commit. AsNoTracking facilita la lectura, pero la ausencia de escrituras se verifica con</text><text x="60" y="726" text-anchor="start" font-family="DejaVu Sans,Arial,sans-serif" font-size="17" font-weight="400" fill="#526779">contrato y pruebas.</text></svg>