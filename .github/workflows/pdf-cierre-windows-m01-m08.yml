name: PDF de cierre M02-M08 y Docker Windows
on:
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: pdf-windows-${{ github.ref }}
  cancel-in-progress: false
jobs:
  pdf:
    runs-on: ubuntu-22.04
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: '3.12'}
      - name: Instalar el motor editorial de M08
        run: >-
          python -m pip install
          Markdown==3.11.3 mistune==3.1.3 WeasyPrint==70.0 PyMuPDF==1.26.6
          CairoSVG==2.9.1 beautifulsoup4==4.15.0 pydyf==0.13.0
          tinycss2==1.5.1 tinyhtml5==2.1.0 cssselect2==0.10.1
          fonttools==4.61.1 Pillow==13.0.0 cairocffi==1.7.1 cffi==2.1.1
          brotli==1.2.1 zopfli==0.4.3 webencodings==0.6.1
          defusedxml==0.7.1 soupsieve==4.1 pycparser==3.0
      - name: Regenerar prácticas M02-M08 y manual Docker, sin omitir verificaciones
        run: |
          python .github/scripts/generar_pdf_m02.py
          python .github/scripts/m03_generar_pdf.py
          python .github/scripts/m04_generar_pdf.py
          python .github/scripts/m05_generar_pdf.py
          python .github/scripts/m06_generar_pdf.py --solo PRACTICAS
          python .github/scripts/m07_generar_pdf.py --solo PRACTICAS
          python .github/scripts/m08_generar_pdf.py --solo PRACTICAS
          python PRACTICA_TRANSVERSAL_DOCKER_WINDOWS/generar_pdf.py
      - name: Comprobar presencia de Docker en los ocho PDF y ausencia de páginas vacías
        run: |
          python - <<'PY'
          from pathlib import Path
          import fitz
          directories=['M02_APIS_REST_ASPNET_CORE','M03_ARQUITECTURA_HEXAGONAL','M04_PATRONES_ARQUITECTURA','M05_DDD_CQRS','M06_COMUNICACION_MICROSERVICIOS','M07_OBSERVABILIDAD_RESILIENCIA','M08_API_GATEWAY']
          paths=[Path(d)/'PRACTICAS'/f'M{i+2:02}_PRACTICAS.pdf' for i,d in enumerate(directories)]
          paths.append(Path('PRACTICA_TRANSVERSAL_DOCKER_WINDOWS/PRACTICAS_DOCKER_WINDOWS.pdf'))
          for p in paths:
              assert p.is_file() and p.stat().st_size>10000,p
              pdf=fitz.open(p)
              begin=' '.join(pdf[i].get_text() for i in range(min(8,len(pdf))))
              assert 'Docker' in begin,p
              assert all(page.get_text().strip() for page in pdf),p
              print(p,len(pdf),flush=True)
          PY
      - name: Publicar PDFs y reportes editoriales en la rama de revisión
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add M02_APIS_REST_ASPNET_CORE/PRACTICAS/*.pdf
          git add M03_ARQUITECTURA_HEXAGONAL/TEORIA/*.pdf M03_ARQUITECTURA_HEXAGONAL/PRACTICAS/*.pdf M03_ARQUITECTURA_HEXAGONAL/REPORTE_PDF_M03.json
          git add M04_PATRONES_ARQUITECTURA/TEORIA/*.pdf M04_PATRONES_ARQUITECTURA/PRACTICAS/*.pdf M04_PATRONES_ARQUITECTURA/REPORTE_PDF_M04.json
          git add M05_DDD_CQRS/TEORIA/*.pdf M05_DDD_CQRS/PRACTICAS/*.pdf M05_DDD_CQRS/REPORTE_PDF_M05.json
          git add M06_COMUNICACION_MICROSERVICIOS/PRACTICAS/*.pdf M06_COMUNICACION_MICROSERVICIOS/REPORTE_PDF_M06.json
          git add M07_OBSERVABILIDAD_RESILIENCIA/PRACTICAS/*.pdf M07_OBSERVABILIDAD_RESILIENCIA/REPORTE_PDF_M07.json
          git add M08_API_GATEWAY/PRACTICAS/*.pdf M08_API_GATEWAY/REPORTE_PDF_M08.json
          git add PRACTICA_TRANSVERSAL_DOCKER_WINDOWS/PRACTICAS_DOCKER_WINDOWS.pdf PRACTICA_TRANSVERSAL_DOCKER_WINDOWS/REPORTE_PDF_DOCKER.json
          if ! git diff --cached --quiet; then
            git commit -m 'docs(pdf): sincronizar prácticas Windows Docker y manual M02-M08'
            git push origin "HEAD:$GITHUB_REF_NAME"
          fi
