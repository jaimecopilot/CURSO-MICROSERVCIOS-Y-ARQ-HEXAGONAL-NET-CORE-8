name: PDF practicas corregidas M09

on:
  push:
    branches: [version-corregida]
    paths:
      - 'M09_DESPLIEGUE_DOCKER/PRACTICAS/M09_PRACTICAS.md'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: m09-pdf-version-corregida
  cancel-in-progress: true

jobs:
  render:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Obtener rama de correccion
        uses: actions/checkout@v4
        with:
          ref: version-corregida
          persist-credentials: true

      - name: Instalar generador
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Instalar dependencias
        run: |
          python -m pip install "Markdown>=3.7,<4" "weasyprint>=62,<69" "PyMuPDF>=1.24,<2"

      - name: Generar PDF exclusivamente M09
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          from html import escape
          import markdown
          from weasyprint import HTML

          md = Path("M09_DESPLIEGUE_DOCKER/PRACTICAS/M09_PRACTICAS.md")
          html_body = markdown.markdown(
              md.read_text(encoding="utf-8"),
              extensions=["fenced_code", "tables", "sane_lists"],
          )
          style = """
          @page {
            size: A4;
            margin: 18mm 17mm 19mm 17mm;
            @bottom-center { content: counter(page); color: #536173; font: 8pt 'DejaVu Sans', sans-serif; }
          }
          body { font-family: 'DejaVu Sans', 'Liberation Sans', sans-serif; font-size: 9.25pt; line-height: 1.5; color: #202733; }
          h1 { font-size: 17pt; color: #162942; margin: 18pt 0 11pt; break-after: avoid; }
          h2 { font-size: 13pt; color: #254365; margin: 17pt 0 8pt; break-after: avoid; }
          h3 { font-size: 11pt; color: #2e5678; margin: 13pt 0 6pt; break-after: avoid; }
          p { margin: 0 0 8pt; orphans: 3; widows: 3; }
          ul, ol { margin: 5pt 0 9pt; padding-left: 17pt; }
          li { margin: 2pt 0; }
          pre { font-family: 'DejaVu Sans Mono', monospace; font-size: 7.15pt; line-height: 1.34;
                color: #263442; background: #f4f6f9; border-left: 2pt solid #b6cce0;
                padding: 6pt; white-space: pre-wrap; overflow-wrap: anywhere; margin: 8pt 0 10pt; }
          code { font-family: 'DejaVu Sans Mono', monospace; font-size: 0.88em; overflow-wrap: anywhere; }
          pre code { font-size: 1em; }
          table { border-collapse: collapse; width: 100%; font-size: 8.05pt; margin: 8pt 0; }
          th, td { border: 0.55pt solid #bbc5cf; padding: 4.5pt; vertical-align: top; overflow-wrap: anywhere; }
          th { background: #edf1f5; }
          a { color: #1d5680; text-decoration: none; }
          """
          html = (
              "<!doctype html><html lang='es'><head><meta charset='utf-8'>"
              + "<title>" + escape(md.stem) + "</title><style>" + style
              + "</style></head><body>" + html_body + "</body></html>"
          )
          out = md.with_suffix(".pdf")
          HTML(string=html, base_url=md.parent.resolve().as_uri() + "/").write_pdf(str(out))
          assert out.stat().st_size > 30000, "PDF demasiado pequeno"
          print(f"PDF generado: {out} ({out.stat().st_size} bytes)")
          PY

      - name: Cabeceras y comprobaciones editoriales
        shell: bash
        run: |
          python - <<'PY'
          import sys
          from pathlib import Path
          import fitz
          sys.path.insert(0, str(Path("tools").resolve()))
          import pdf_running_headers as running
          path = Path("M09_DESPLIEGUE_DOCKER/PRACTICAS/M09_PRACTICAS.pdf")
          pages, _, adjusted = running.process(path, 9, False, True)
          running.process(path, 9, True, True)
          doc = fitz.open(path)
          assert 8 <= len(doc) <= 100, f"Paginacion inesperada: {len(doc)}"
          joined = " ".join(page.get_text("text") for page in doc)
          for step in range(1, 17):
              assert f"Paso 9.{step}" in joined, f"Falta paso 9.{step}"
          for term in ("SQL Server", "RabbitMQ", "YARP", "PowerShell", "Docker", "202", "409"):
              assert term in joined, f"Falta tema: {term}"
          for i, page in enumerate(doc, 1):
              assert running.header_present(page, 9, True), f"Sin cabecera: pagina {i}"
              assert len(page.get_text("text").strip()) > 45, f"Pagina vacia: {i}"
              pix = page.get_pixmap(matrix=fitz.Matrix(.4, .4), alpha=False)
              assert len(pix.samples) > 1000, f"Error al rasterizar pagina {i}"
          assert pages == len(doc)
          print(f"M09 validado: {pages}/{pages} cabeceras; 16 pasos; PDF indexable; {adjusted} paginas reencuadradas")
          PY

      - name: Publicar PDF en version-corregida
        shell: bash
        run: |
          git fetch origin version-corregida
          if [ "$(git rev-parse HEAD)" != "$(git rev-parse origin/version-corregida)" ]; then
            echo "La rama avanzo durante la ejecucion; no sobrescribir una version posterior"
            exit 1
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -- M09_DESPLIEGUE_DOCKER/PRACTICAS/M09_PRACTICAS.pdf
          if git diff --cached --quiet; then
            echo "PDF ya sincronizado"
          else
            git commit -m "Actualizar PDF corregido de practicas M09"
            git push origin HEAD:version-corregida
          fi
