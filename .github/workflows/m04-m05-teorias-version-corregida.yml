name: M04 y M05 teorias corregidas - PDF y auditoria
on:
  push:
    branches: ['resguardo/tecnico-m01-m08-20261112']
    paths: ['.github/workflows/m04-m05-teorias-version-corregida.yml']
  workflow_dispatch:
permissions:
  contents: write
jobs:
  editorial:
    name: Regenerar y verificar teoría M04-M05 sin modificar prácticas
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    steps:
      - name: Descargar versión corregida
        uses: actions/checkout@v4
        with:
          ref: version-corregida
          fetch-depth: 1
      - name: Descargar materiales de control de main
        uses: actions/checkout@v4
        with:
          ref: main
          path: _base_main
          fetch-depth: 1
      - name: Descargar herramienta técnica fuera de la edición docente
        uses: actions/checkout@v4
        with:
          ref: resguardo/tecnico-m01-m08-20261112
          path: _ci_tecnica
          fetch-depth: 1
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Instalar dependencias del generador
        shell: bash
        run: |
          python -m pip install --disable-pip-version-check 'markdown==3.10.1' 'weasyprint==67.0' 'pymupdf==1.26.5'
      - name: Preservación literal de código e imágenes y maquetación PDF
        shell: bash
        run: |
          set -euo pipefail
          python _ci_tecnica/.github/scripts/m04_m05_regenerar_teorias_editoriales.py
      - name: Publicar ambos PDF en version-corregida
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add M04_PATRONES_ARQUITECTURA/TEORIA/M04_TEORIA.pdf M05_DDD_CQRS/TEORIA/M05_TEORIA.pdf
          if ! git diff --cached --quiet; then
            git commit -m 'docs(m04-m05 teoria): publicar PDF coherentes con redacción editorial'
            git push origin HEAD:refs/heads/version-corregida
          else
            echo 'PDF ya sincronizados'
          fi
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: m04-m05-teorias-editoriales-pdf
          path: |
            M04_PATRONES_ARQUITECTURA/TEORIA/M04_TEORIA.pdf
            M05_DDD_CQRS/TEORIA/M05_TEORIA.pdf
            /tmp/teorias_m04_m05_auditoria.json
