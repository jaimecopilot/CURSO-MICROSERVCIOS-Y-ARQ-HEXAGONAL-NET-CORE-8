name: M04 M05 - Practicas Windows SQL HTTP

on:
  push:
    branches: [version-corregida]
    paths:
      - 'tools/auditar_reconstruccion_practicas.py'
      - 'tools/auditar_continuidad_modular.py'
      - 'M04_PATRONES_ARQUITECTURA/PRACTICAS/M04_PRACTICAS.md'
      - 'M05_DDD_CQRS/PRACTICAS/M05_PRACTICAS.md'
      - 'M04_PATRONES_ARQUITECTURA/PROYECTO/**'
      - 'M05_DDD_CQRS/PROYECTO/**'
      - 'tools/validar_practicas_m04_m05.py'
      - '.github/workflows/m04-m05-windows-e2e.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  m04-windows:
    name: Prácticas M04 - xUnit, SQL y HTTP
    runs-on: windows-2022
    timeout-minutes: 55
    env:
      ACERIA_TEST_SQLSERVER: 'Server=.\SQLEXPRESS;Database=master;Trusted_Connection=True;TrustServerCertificate=True;Encrypt=False'
      ACERIA_SQL_ORIGIN: 'WindowsSQLExpress'
    steps:
      - name: Permitir rutas largas
        shell: pwsh
        run: git config --global core.longpaths true
      - uses: actions/checkout@v4
        with:
          ref: version-corregida
          sparse-checkout: |
            M03_ARQUITECTURA_HEXAGONAL
            M04_PATRONES_ARQUITECTURA
            M05_DDD_CQRS
            tools
          sparse-checkout-cone-mode: true
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Preparar SQL Server Express real
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $service = Get-Service -Name 'MSSQL$SQLEXPRESS' -ErrorAction SilentlyContinue
          if ($null -eq $service) {
            choco install sql-server-express --version=2022.16.0.20260305 -y --no-progress
            if ($LASTEXITCODE -notin @(0,3010,1641)) { throw "Falló la instalación de SQL Express" }
            $service = Get-Service -Name 'MSSQL$SQLEXPRESS' -ErrorAction Stop
          }
          if ($service.Status -ne 'Running') { Start-Service -Name 'MSSQL$SQLEXPRESS' }
          if ((Get-Service -Name 'MSSQL$SQLEXPRESS').Status -ne 'Running') { throw "SQL Express no disponible" }
          Write-Host 'SQL Server Express activo'
      - name: Auditar y ejecutar M04
        shell: pwsh
        run: |
          $env:ACERIA_SQL_EVIDENCE_DIR = Join-Path $env:RUNNER_TEMP 'evidencia-sql-m04'
          python tools/validar_practicas_m04_m05.py --module 4 --reconstruir-incremental --report M04_WINDOWS_VALIDACION.md
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: m04-validacion-windows
          path: |
            M04_WINDOWS_VALIDACION.md
          retention-days: 30
  m05-windows:
    name: Prácticas M05 - xUnit, SQL y HTTP
    runs-on: windows-2022
    timeout-minutes: 55
    env:
      ACERIA_TEST_SQLSERVER: 'Server=.\SQLEXPRESS;Database=master;Trusted_Connection=True;TrustServerCertificate=True;Encrypt=False'
      ACERIA_SQL_ORIGIN: 'WindowsSQLExpress'
    steps:
      - name: Permitir rutas largas
        shell: pwsh
        run: git config --global core.longpaths true
      - uses: actions/checkout@v4
        with:
          ref: version-corregida
          sparse-checkout: |
            M03_ARQUITECTURA_HEXAGONAL
            M04_PATRONES_ARQUITECTURA
            M05_DDD_CQRS
            tools
          sparse-checkout-cone-mode: true
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Preparar SQL Server Express real
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $service = Get-Service -Name 'MSSQL$SQLEXPRESS' -ErrorAction SilentlyContinue
          if ($null -eq $service) {
            choco install sql-server-express --version=2022.16.0.20260305 -y --no-progress
            if ($LASTEXITCODE -notin @(0,3010,1641)) { throw "Falló la instalación de SQL Express" }
            $service = Get-Service -Name 'MSSQL$SQLEXPRESS' -ErrorAction Stop
          }
          if ($service.Status -ne 'Running') { Start-Service -Name 'MSSQL$SQLEXPRESS' }
          if ((Get-Service -Name 'MSSQL$SQLEXPRESS').Status -ne 'Running') { throw "SQL Express no disponible" }
          Write-Host 'SQL Server Express activo'
      - name: Auditar y ejecutar M05
        shell: pwsh
        run: |
          $env:ACERIA_SQL_EVIDENCE_DIR = Join-Path $env:RUNNER_TEMP 'evidencia-sql-m05'
          python tools/validar_practicas_m04_m05.py --module 5 --reconstruir-incremental --report M05_WINDOWS_VALIDACION.md
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: m05-validacion-windows
          path: |
            M05_WINDOWS_VALIDACION.md
          retention-days: 30
