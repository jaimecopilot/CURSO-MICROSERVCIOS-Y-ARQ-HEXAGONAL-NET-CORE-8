name: M02 - previsualizar fuentes reales sin síntesis

on:
  push:
    branches:
      - desarrollo/m02-apis-rest-20261015
    paths:
      - '.github/fuentes-originales/m02/**'
      - '.github/scripts/construir_m02_desde_fuentes.py'
      - '.github/scripts/pedagogia_m02.py'
      - '.github/scripts/maquetacion_m02.py'
      - 'M02_APIS_REST_ASPNET_CORE/TEORIA/IMAGENES/*.svg'
      - '.github/scripts/pdf_m02_previsualizacion.py'
      - '.github/workflows/m02-previsualizacion-fuentes-originales.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  previsualizacion:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Construir vista Markdown sólo con originales completos
        run: |
          python .github/scripts/construir_m02_desde_fuentes.py \
            --parcial --salida m02_previsualizacion
      - name: Copiar 8 figuras antes de producir PDF
        run: |
          mkdir -p m02_previsualizacion/IMAGENES
          cp M02_APIS_REST_ASPNET_CORE/TEORIA/IMAGENES/*.svg m02_previsualizacion/IMAGENES/
          test "$(find m02_previsualizacion/IMAGENES -name '*.svg' | wc -l)" -eq 8
      - name: Validar recuentos y origen exacto
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          base=Path("m02_previsualizacion")
          info=json.loads((base/"INFORME.json").read_text(encoding="utf-8"))
          docs=info["fuentes_presentes"]
          assert [d["point"] for d in docs]==["2.1","2.2","2.3","2.4"], docs
          assert all(d["blocks"]==10 and d["steps"]==24 for d in docs)
          teoria=next(base.glob("*_TEORIA.md")).read_text(encoding="utf-8")
          practicas=next(base.glob("*_PRACTICAS.md")).read_text(encoding="utf-8")
          assert teoria.count("](IMAGENES/") == 8
          assert practicas.count("| Error observado | Causa | Solución guiada |") == 4
          assert "Error Causa Solución" not in practicas
          for name in ("TEORIA","PRACTICAS"):
              text=next(base.glob("*_"+name+".md")).read_text(encoding="utf-8")
              assert "JAIME GALLO" in text
              assert "Duración: " not in text
              assert "PARTE TEÓRICA (" not in text
              assert "PARTE PRÁCTICA (" not in text
          print("REVISIÓN M02: 40 bloques y 96 pasos completos.")
          print("Cuatro fuentes protegidas; maquetación pendiente de revisión pedagógica.")
          PY
      - name: Instalar motor para las previsualizaciones PDF
        run: python -m pip install --disable-pip-version-check --quiet markdown weasyprint pymupdf
      - name: Generar y revisar PDFs provisionales
        run: python .github/scripts/pdf_m02_previsualizacion.py --directorio m02_previsualizacion
      - name: Conservar previsualización y huellas de procedencia
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: m02-originales-2-1-a-2-4-previsualizacion
          path: m02_previsualizacion/
          if-no-files-found: error
