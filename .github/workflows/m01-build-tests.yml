name: M01 - AceriaApp por punto
on:
  push:
    paths:
      - 'M01_INTRODUCCION_MICROSERVICIOS/PROYECTO/**'
      - '.github/workflows/m01-build-tests.yml'
      - '.github/scripts/activar_punto_ci.py'
  workflow_dispatch:
jobs:
  puntos:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        punto:
          - 1.1-monolito-vs-microservicios
          - 1.2-ventajas-inconvenientes
          - 1.3-principios-diseno
          - 1.4-organizacion-solucion
          - 1.5-buenas-practicas
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'
      - name: Activar el código didáctico del punto para la prueba
        run: python .github/scripts/activar_punto_ci.py M01_INTRODUCCION_MICROSERVICIOS/PROYECTO/${{ matrix.punto }}
      - name: Compilar
        run: dotnet build M01_INTRODUCCION_MICROSERVICIOS/PROYECTO/${{ matrix.punto }}/AceriaApp.sln --configuration Release
      - name: Probar
        run: dotnet test M01_INTRODUCCION_MICROSERVICIOS/PROYECTO/${{ matrix.punto }}/AceriaApp.sln --configuration Release --no-build
