name: Auditoria estructural y previsualizacion de 17 PDFs

on:
  push:
    branches: [version-corregida]
    paths:
      - 'M01_INTRODUCCION_MICROSERVICIOS/TEORIA/M01_TEORIA.md'
      - 'M01_INTRODUCCION_MICROSERVICIOS/TEORIA/M01_TEORIA.pdf'
      - 'M01_INTRODUCCION_MICROSERVICIOS/PRACTICAS/M01_PRACTICAS.md'
      - 'M01_INTRODUCCION_MICROSERVICIOS/PRACTICAS/M01_PRACTICAS.pdf'
      - 'M02_APIS_REST_ASPNET_CORE/TEORIA/M02_TEORIA.md'
      - 'M02_APIS_REST_ASPNET_CORE/TEORIA/M02_TEORIA.pdf'
      - 'M02_APIS_REST_ASPNET_CORE/PRACTICAS/M02_PRACTICAS.md'
      - 'M02_APIS_REST_ASPNET_CORE/PRACTICAS/M02_PRACTICAS.pdf'
      - 'M03_ARQUITECTURA_HEXAGONAL/TEORIA/M03_TEORIA.md'
      - 'M03_ARQUITECTURA_HEXAGONAL/TEORIA/M03_TEORIA.pdf'
      - 'M03_ARQUITECTURA_HEXAGONAL/PRACTICAS/M03_PRACTICAS.md'
      - 'M03_ARQUITECTURA_HEXAGONAL/PRACTICAS/M03_PRACTICAS.pdf'
      - 'M04_PATRONES_ARQUITECTURA/TEORIA/M04_TEORIA.md'
      - 'M04_PATRONES_ARQUITECTURA/TEORIA/M04_TEORIA.pdf'
      - 'M04_PATRONES_ARQUITECTURA/PRACTICAS/M04_PRACTICAS.md'
      - 'M04_PATRONES_ARQUITECTURA/PRACTICAS/M04_PRACTICAS.pdf'
      - 'M05_DDD_CQRS/TEORIA/M05_TEORIA.md'
      - 'M05_DDD_CQRS/TEORIA/M05_TEORIA.pdf'
      - 'M05_DDD_CQRS/PRACTICAS/M05_PRACTICAS.md'
      - 'M05_DDD_CQRS/PRACTICAS/M05_PRACTICAS.pdf'
      - 'M06_COMUNICACION_MICROSERVICIOS/TEORIA/M06_TEORIA.md'
      - 'M06_COMUNICACION_MICROSERVICIOS/TEORIA/M06_TEORIA.pdf'
      - 'M06_COMUNICACION_MICROSERVICIOS/PRACTICAS/M06_PRACTICAS.md'
      - 'M06_COMUNICACION_MICROSERVICIOS/PRACTICAS/M06_PRACTICAS.pdf'
      - 'M07_OBSERVABILIDAD_RESILIENCIA/TEORIA/M07_TEORIA.md'
      - 'M07_OBSERVABILIDAD_RESILIENCIA/TEORIA/M07_TEORIA.pdf'
      - 'M07_OBSERVABILIDAD_RESILIENCIA/PRACTICAS/M07_PRACTICAS.md'
      - 'M07_OBSERVABILIDAD_RESILIENCIA/PRACTICAS/M07_PRACTICAS.pdf'
      - 'M08_API_GATEWAY/TEORIA/M08_TEORIA.md'
      - 'M08_API_GATEWAY/TEORIA/M08_TEORIA.pdf'
      - 'M08_API_GATEWAY/PRACTICAS/M08_PRACTICAS.md'
      - 'M08_API_GATEWAY/PRACTICAS/M08_PRACTICAS.pdf'
      - 'M09_DESPLIEGUE_DOCKER/PRACTICAS/M09_PRACTICAS.md'
      - 'M09_DESPLIEGUE_DOCKER/PRACTICAS/M09_PRACTICAS.pdf'
      - 'tools/validar_publicacion_pdf.py'
      - 'tools/pdf_running_headers.py'
      - '.github/workflows/auditar-publicacion-pdfs.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  inspeccionar:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          ref: version-corregida
          sparse-checkout: |
            M01_INTRODUCCION_MICROSERVICIOS/TEORIA
            M01_INTRODUCCION_MICROSERVICIOS/PRACTICAS
            M02_APIS_REST_ASPNET_CORE/TEORIA
            M02_APIS_REST_ASPNET_CORE/PRACTICAS
            M03_ARQUITECTURA_HEXAGONAL/TEORIA
            M03_ARQUITECTURA_HEXAGONAL/PRACTICAS
            M04_PATRONES_ARQUITECTURA/TEORIA
            M04_PATRONES_ARQUITECTURA/PRACTICAS
            M05_DDD_CQRS/TEORIA
            M05_DDD_CQRS/PRACTICAS
            M06_COMUNICACION_MICROSERVICIOS/TEORIA
            M06_COMUNICACION_MICROSERVICIOS/PRACTICAS
            M07_OBSERVABILIDAD_RESILIENCIA/TEORIA
            M07_OBSERVABILIDAD_RESILIENCIA/PRACTICAS
            M08_API_GATEWAY/TEORIA
            M08_API_GATEWAY/PRACTICAS
            M09_DESPLIEGUE_DOCKER/PRACTICAS
            tools
          sparse-checkout-cone-mode: true
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Instalar herramientas de inspeccion
        run: python -m pip install "PyMuPDF>=1.24,<2" "Pillow>=11,<13"
      - name: Auditar todos los PDF y generar miniaturas
        run: python tools/validar_publicacion_pdf.py
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: muestras-y-auditoria-17-pdf
          path: QA_PUBLICACION_PDF/
          retention-days: 30
