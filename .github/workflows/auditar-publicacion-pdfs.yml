name: Auditoria estructural y previsualizacion de 17 PDFs

on:
  push:
    branches: [version-corregida]
    paths:
      - 'M??_*/TEORIA/*.md'
      - 'M??_*/TEORIA/*.pdf'
      - 'M??_*/PRACTICAS/*.md'
      - 'M??_*/PRACTICAS/*.pdf'
      - 'tools/validar_publicacion_pdf.py'
      - 'tools/pdf_running_headers.py'
      - '.github/workflows/auditar-publicacion-pdfs.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  inspeccionar:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          ref: version-corregida
          sparse-checkout: |
            M01_INTRODUCCION_MICROSERVICIOS/TEORIA
            M01_INTRODUCCION_MICROSERVICIOS/PRACTICAS
            M02_APIS_REST_ASPNET_CORE/TEORIA
            M02_APIS_REST_ASPNET_CORE/PRACTICAS
            M03_ARQUITECTURA_HEXAGONAL/TEORIA
            M03_ARQUITECTURA_HEXAGONAL/PRACTICAS
            M04_PATRONES_ARQUITECTURA/TEORIA
            M04_PATRONES_ARQUITECTURA/PRACTICAS
            M05_DDD_CQRS/TEORIA
            M05_DDD_CQRS/PRACTICAS
            M06_COMUNICACION_MICROSERVICIOS/TEORIA
            M06_COMUNICACION_MICROSERVICIOS/PRACTICAS
            M07_OBSERVABILIDAD_RESILIENCIA/TEORIA
            M07_OBSERVABILIDAD_RESILIENCIA/PRACTICAS
            M08_API_GATEWAY/TEORIA
            M08_API_GATEWAY/PRACTICAS
            M09_DESPLIEGUE_DOCKER/PRACTICAS
            tools
          sparse-checkout-cone-mode: true
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Instalar herramientas de inspeccion
        run: python -m pip install "PyMuPDF>=1.24,<2" "Pillow>=11,<13"
      - name: Auditar todos los PDF y generar miniaturas
        run: python tools/validar_publicacion_pdf.py
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: muestras-y-auditoria-17-pdf
          path: QA_PUBLICACION_PDF/
          retention-days: 30
