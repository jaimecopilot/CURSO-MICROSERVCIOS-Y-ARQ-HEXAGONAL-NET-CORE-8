name: M02 - fidelidad a la fuente y tests de regresión

on:
  push:
    branches:
      - desarrollo/m02-apis-rest-20261015
    paths:
      - '.github/scripts/verificar_fidelidad_m02.py'
      - '.github/fuentes-originales/m02/**'
      - '.github/workflows/m02-generacion-verificacion.yml'
      - 'M02_APIS_REST_ASPNET_CORE/**'
  pull_request:
    branches:
      - revision/m01-correccion-pedagogica-20261015
    paths:
      - '.github/scripts/verificar_fidelidad_m02.py'
      - '.github/fuentes-originales/m02/**'
      - '.github/workflows/m02-generacion-verificacion.yml'
      - 'M02_APIS_REST_ASPNET_CORE/**'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  fidelidad:
    name: Exigir fuente literal y código activable por pasos
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Validar cuatro originales sin admitir síntesis de texto
        run: python .github/scripts/verificar_fidelidad_m02.py --out m02-fidelidad.json
      - name: Conservar informe de fidelidad
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: m02-diagnostico-fidelidad
          path: m02-fidelidad.json
          if-no-files-found: warn

  regresion:
    name: Compilar y probar el punto ${{ matrix.punto }}
    needs: fidelidad
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        punto:
          - 2.1-diseno-apis-rest
          - 2.2-recursos-verbos-codigos
          - 2.3-validacion-peticiones
          - 2.4-documentacion-openapi
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x
      - name: Probar el código publicado sin regenerar teoría ni prácticas
        shell: bash
        run: |
          set -euo pipefail
          sol="M02_APIS_REST_ASPNET_CORE/PROYECTO/${{ matrix.punto }}/AceriaApp.sln"
          dotnet restore "$sol"
          dotnet build "$sol" -c Release --no-restore
          dotnet test "$sol" -c Release --no-build --no-restore

# Verificación de regresión final no sustituye E2E de 96 pasos comentados/descomentados.
# Está prohibida la sobrescritura automática de los Markdown o PDF originales.
