name: M02 - generar proyectos, pruebas y PDF

on:
  push:
    branches:
      - desarrollo/m02-apis-rest-20261015
    paths:
      - '.github/scripts/generar_proyectos_m02.py'
      - '.github/scripts/generar_materiales_m02.py'
      - '.github/scripts/generar_pdf_m02.py'
      - '.github/workflows/m02-generacion-verificacion.yml'
  pull_request:
    branches:
      - revision/m01-correccion-pedagogica-20261015
    paths:
      - '.github/scripts/generar_proyectos_m02.py'
      - '.github/scripts/generar_materiales_m02.py'
      - '.github/scripts/generar_pdf_m02.py'
      - '.github/workflows/m02-generacion-verificacion.yml'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: m02-generacion-verificacion
  cancel-in-progress: false

jobs:
  m02:
    name: Generar, compilar, probar y publicar M02
    runs-on: ubuntu-24.04
    timeout-minutes: 55
    steps:
      - name: Checkout rama M02
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: desarrollo/m02-apis-rest-20261015
      - name: Instalar .NET 8
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x
      - name: Instalar librerías para PDF
        run: |
          python -m pip install --upgrade pip
          python -m pip install 'weasyprint>=62,<70' 'mistune>=3,<4' 'pymupdf>=1.24,<2'
      - name: Generar cuatro soluciones acumulativas
        run: python .github/scripts/generar_proyectos_m02.py
      - name: Generar teoría, prácticas y gráficos SVG
        run: python .github/scripts/generar_materiales_m02.py
      - name: Verificar cada solución con pruebas reales
        shell: bash
        run: |
          set -euo pipefail
          for punto in \
            2.1-diseno-apis-rest \
            2.2-recursos-verbos-codigos \
            2.3-validacion-peticiones \
            2.4-documentacion-openapi
          do
            dir="M02_APIS_REST_ASPNET_CORE/PROYECTO/$punto"
            echo "::group::DOTNET restore/build/test - $punto"
            dotnet restore "$dir/AceriaApp.sln"
            dotnet build "$dir/AceriaApp.sln" -c Release --no-restore
            dotnet test "$dir/AceriaApp.sln" -c Release --no-build --no-restore --verbosity normal
            echo "::endgroup::"
          done
      - name: Generar PDF de teoría y prácticas con portadas
        run: python .github/scripts/generar_pdf_m02.py
      - name: Verificar entregables y publicar en la rama
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path
          import re, json, fitz
          base=Path("M02_APIS_REST_ASPNET_CORE")
          t=(base/"TEORIA/M02_TEORIA.md").read_text(encoding="utf-8")
          p=(base/"PRACTICAS/M02_PRACTICAS.md").read_text(encoding="utf-8")
          assert len(re.findall(r"^### Bloque \d+",t,re.M))==40
          assert len(re.findall(r"^### PASO 2\.\d+\.\d+",p,re.M))==96
          for kind in ["TEORIA","PRACTICAS"]:
              doc=fitz.open(base/kind/("M02_"+kind+".pdf"))
              assert len(doc)>1
              assert all("JAIME GALLO" in page.get_text() for page in doc)
              print(kind, len(doc),"páginas")
          print("Validación documental PASS")
          PY
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add M02_APIS_REST_ASPNET_CORE
          if ! git diff --cached --quiet; then
            git commit -m "feat(m02): publicar teoria practicas PDF y proyectos verificados"
            git push origin HEAD:desarrollo/m02-apis-rest-20261015
          fi
      - name: Subir entregables de M02
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: m02-materiales-y-proyectos
          path: |
            M02_APIS_REST_ASPNET_CORE/TEORIA
            M02_APIS_REST_ASPNET_CORE/PRACTICAS
            M02_APIS_REST_ASPNET_CORE/manifiesto_proyectos.json
          if-no-files-found: warn
