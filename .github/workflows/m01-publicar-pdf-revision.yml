name: M01 - Publicar PDF en rama de revision

on:
  push:
    branches:
      - 'revision/m01-correccion-pedagogica-20261015'
    paths:
      - '.github/workflows/m01-publicar-pdf-revision.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  pdfs_revision:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Preparar herramientas PDF
        run: python -m pip install --disable-pip-version-check Markdown beautifulsoup4 WeasyPrint PyMuPDF
      - name: Regenerar Markdown y aplicar portada y cabeceras
        run: |
          python .github/scripts/generar_pdf_m01.py
          python .github/scripts/portadas_pdf_m01.py
      - name: Actualizar solo los PDF docentes en rama de revision
        shell: bash
        run: |
          cp _revision_m01_pdf/M01_TEORIA_CON_PORTADA.pdf M01_INTRODUCCION_MICROSERVICIOS/TEORIA/M01_TEORIA.pdf
          cp _revision_m01_pdf/M01_PRACTICAS_CON_PORTADA.pdf M01_INTRODUCCION_MICROSERVICIOS/PRACTICAS/M01_PRACTICAS.pdf
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add M01_INTRODUCCION_MICROSERVICIOS/TEORIA/M01_TEORIA.pdf M01_INTRODUCCION_MICROSERVICIOS/PRACTICAS/M01_PRACTICAS.pdf
          if ! git diff --cached --quiet; then
            git commit -m "docs(m01): publicar PDF de revision con portada y autor"
            git push origin HEAD:revision/m01-correccion-pedagogica-20261015
          fi
      - name: Guardar pruebas documentales
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: m01-pdf-publicados-revision
          path: |
            _revision_m01_pdf/reporte_pdf_m01.json
            _revision_m01_pdf/reporte_portadas_m01.json
