name: PDF corregidos y cabeceras del curso

on:
  push:
    branches: [version-corregida]
    paths:
      - 'M01_INTRODUCCION_MICROSERVICIOS/PRACTICAS/M01_PRACTICAS.md'
      - 'M02_APIS_REST_ASPNET_CORE/PRACTICAS/M02_PRACTICAS.md'
      - 'M03_ARQUITECTURA_HEXAGONAL/PRACTICAS/M03_PRACTICAS.md'
      - 'M04_PATRONES_ARQUITECTURA/PRACTICAS/M04_PRACTICAS.md'
      - 'M05_DDD_CQRS/PRACTICAS/M05_PRACTICAS.md'
      - 'M06_COMUNICACION_MICROSERVICIOS/TEORIA/M06_TEORIA.md'
      - 'M07_OBSERVABILIDAD_RESILIENCIA/TEORIA/M07_TEORIA.md'
      - 'M08_API_GATEWAY/TEORIA/M08_TEORIA.md'
      - '.github/workflows/rebuild-corrected-theory-pdfs.yml'
      - 'tools/pdf_running_headers.py'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  render:
    if: ${{ github.actor != 'github-actions[bot]' }}
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Obtener rama
        uses: actions/checkout@v4
        with:
          ref: version-corregida
          persist-credentials: true

      - name: Preparar Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Instalar renderizador
        run: |
          python -m pip install --upgrade pip
          python -m pip install "Markdown>=3.7,<4" "weasyprint>=62,<69" "Pygments>=2.18,<3" "PyMuPDF>=1.24,<2"

      - name: Regenerar documentos PDF a partir de los Markdown aprobados
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          from html import escape
          import markdown
          from weasyprint import HTML

          documents = [
              Path("M06_COMUNICACION_MICROSERVICIOS/TEORIA/M06_TEORIA.md"),
              Path("M07_OBSERVABILIDAD_RESILIENCIA/TEORIA/M07_TEORIA.md"),
              Path("M08_API_GATEWAY/TEORIA/M08_TEORIA.md"),
              Path("M01_INTRODUCCION_MICROSERVICIOS/PRACTICAS/M01_PRACTICAS.md"),
              Path("M02_APIS_REST_ASPNET_CORE/PRACTICAS/M02_PRACTICAS.md"),
              Path("M03_ARQUITECTURA_HEXAGONAL/PRACTICAS/M03_PRACTICAS.md"),
              Path("M04_PATRONES_ARQUITECTURA/PRACTICAS/M04_PRACTICAS.md"),
              Path("M05_DDD_CQRS/PRACTICAS/M05_PRACTICAS.md"),
          ]
          style = """
          @page {
            size: A4;
            margin: 18mm 17mm 19mm 17mm;
            @bottom-center { content: counter(page); color: #536173; font: 8pt 'DejaVu Sans', sans-serif; }
          }
          body { font-family: 'DejaVu Sans', 'Liberation Sans', sans-serif; font-size: 9.2pt; line-height: 1.49; color: #202733; }
          h1 { font-size: 17pt; color: #162942; margin: 18pt 0 11pt; break-after: avoid; }
          h1:not(:first-of-type) { break-before: page; }
          h2 { font-size: 13pt; color: #254365; margin: 17pt 0 8pt; break-after: avoid; }
          h3 { font-size: 11pt; color: #2e5678; margin: 13pt 0 6pt; break-after: avoid; }
          h4 { font-size: 10pt; color: #2e5678; margin: 11pt 0 5pt; break-after: avoid; }
          p { margin: 0 0 8pt; orphans: 3; widows: 3; }
          ul, ol { margin: 5pt 0 9pt; padding-left: 17pt; }
          li { margin: 2pt 0; }
          pre { font-family: 'DejaVu Sans Mono', monospace; font-size: 7.2pt; line-height: 1.34;
                color: #263442; background: #f4f6f9; border-left: 2pt solid #b6cce0;
                padding: 6pt; white-space: pre-wrap; overflow-wrap: anywhere; margin: 8pt 0 10pt; }
          code { font-family: 'DejaVu Sans Mono', monospace; font-size: 0.88em; overflow-wrap: anywhere; }
          pre code { font-size: 1em; }
          img { display: block; max-width: 96%; max-height: 157mm; width: auto; height: auto;
                margin: 7pt auto 9pt; object-fit: contain; }
          table { border-collapse: collapse; width: 100%; font-size: 8.1pt; margin: 8pt 0; }
          th, td { border: 0.55pt solid #bbc5cf; padding: 4.5pt; vertical-align: top; overflow-wrap: anywhere; }
          th { background: #edf1f5; }
          blockquote { padding: 4pt 10pt; margin: 8pt 0; border-left: 2pt solid #8099b3; }
          hr { border: none; border-top: 0.6pt solid #bdc7d3; margin: 13pt 0; }
          a { color: #1d5680; text-decoration: none; }
          """
          for md in documents:
              body = markdown.markdown(
                  md.read_text(encoding="utf-8"),
                  extensions=["fenced_code", "tables", "sane_lists", "attr_list"],
              )
              html = "<!doctype html><html lang='es'><head><meta charset='utf-8'>" +                      "<title>" + escape(md.stem) + "</title><style>" + style +                      "</style></head><body>" + body + "</body></html>"
              output = md.with_suffix(".pdf")
              HTML(string=html, base_url=md.parent.resolve().as_uri() + "/").write_pdf(str(output))
              assert output.is_file() and output.stat().st_size > 30000, str(output)
              print(f"{md} → {output}: {output.stat().st_size:,} bytes")
          PY

      - name: Validar paginación y texto de los PDF
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          import fitz

          cases = {
            "M06_COMUNICACION_MICROSERVICIOS/TEORIA/M06_TEORIA.pdf": ("Punto 6.1", "Punto 6.2", "Punto 6.3"),
            "M07_OBSERVABILIDAD_RESILIENCIA/TEORIA/M07_TEORIA.pdf": ("Punto 7.1", "Punto 7.2", "Punto 7.3", "Punto 7.4"),
            "M08_API_GATEWAY/TEORIA/M08_TEORIA.pdf": ("Punto 8.1", "Punto 8.2", "Punto 8.3", "Punto 8.4"),
            "M01_INTRODUCCION_MICROSERVICIOS/PRACTICAS/M01_PRACTICAS.pdf": ("Punto 1.1", "Punto 1.2", "Punto 1.3", "Punto 1.4", "Punto 1.5"),
            "M02_APIS_REST_ASPNET_CORE/PRACTICAS/M02_PRACTICAS.pdf": ("Punto 2.1", "Punto 2.2", "Punto 2.3", "Punto 2.4"),
            "M03_ARQUITECTURA_HEXAGONAL/PRACTICAS/M03_PRACTICAS.pdf": ("Punto 3.1", "Punto 3.2", "Punto 3.3", "Punto 3.4"),
            "M04_PATRONES_ARQUITECTURA/PRACTICAS/M04_PRACTICAS.pdf": ("Punto 4.1", "Punto 4.2", "Punto 4.3", "Punto 4.4", "Punto 4.5"),
            "M05_DDD_CQRS/PRACTICAS/M05_PRACTICAS.pdf": ("Punto 5.1", "Punto 5.2", "Punto 5.3", "Punto 5.4", "Punto 5.5"),
          }
          for file, headings in cases.items():
              doc = fitz.open(file)
              assert not doc.needs_pass, file
              assert 20 <= len(doc) <= 180, f"{file}: numero de paginas anomalo {len(doc)}"
              full_text = " ".join(page.get_text("text") for page in doc)
              for heading in headings:
                  assert heading in full_text, f"{file}: falta {heading}"
              for page_index in sorted({0, len(doc)//2, len(doc)-1}):
                  page = doc[page_index]
                  pix = page.get_pixmap(matrix=fitz.Matrix(.4, .4), alpha=False)
                  assert len(page.get_text("text").strip()) > 40, f"{file}: pagina {page_index+1} vacia"
                  assert len(pix.samples) > 1000, f"{file}: render de pagina fallido"
              print(f"VALIDADO: {file} | {len(doc)} paginas | {len(full_text.split()):,} palabras extraibles")
          PY

      - name: Aplicar cabeceras de teoría en M01-M08
        run: python tools/pdf_running_headers.py

      - name: Aplicar cabeceras de prácticas en M01-M05
        run: python tools/pdf_running_headers.py --practicas

      - name: Validar por separado todas las cabeceras
        run: |
          python tools/pdf_running_headers.py --check
          python tools/pdf_running_headers.py --practicas --check

      - name: Publicar los PDF en la misma rama
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -- \
            M01_INTRODUCCION_MICROSERVICIOS/TEORIA/M01_TEORIA.pdf \
            M02_APIS_REST_ASPNET_CORE/TEORIA/M02_TEORIA.pdf \
            M03_ARQUITECTURA_HEXAGONAL/TEORIA/M03_TEORIA.pdf \
            M04_PATRONES_ARQUITECTURA/TEORIA/M04_TEORIA.pdf \
            M05_DDD_CQRS/TEORIA/M05_TEORIA.pdf \
            M06_COMUNICACION_MICROSERVICIOS/TEORIA/M06_TEORIA.pdf \
            M07_OBSERVABILIDAD_RESILIENCIA/TEORIA/M07_TEORIA.pdf \
            M08_API_GATEWAY/TEORIA/M08_TEORIA.pdf \
            M01_INTRODUCCION_MICROSERVICIOS/PRACTICAS/M01_PRACTICAS.pdf \
            M02_APIS_REST_ASPNET_CORE/PRACTICAS/M02_PRACTICAS.pdf \
            M03_ARQUITECTURA_HEXAGONAL/PRACTICAS/M03_PRACTICAS.pdf \
            M04_PATRONES_ARQUITECTURA/PRACTICAS/M04_PRACTICAS.pdf \
            M05_DDD_CQRS/PRACTICAS/M05_PRACTICAS.pdf
          if git diff --cached --quiet; then
            echo "No hay cambios de PDF"
          else
            git commit -m "Actualizar PDF de prácticas y cabeceras M01-M05"
            git push origin HEAD:version-corregida
          fi
