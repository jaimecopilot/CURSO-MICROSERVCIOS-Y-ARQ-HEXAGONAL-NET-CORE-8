name: M01 - Reconstruccion desde cero Windows SQL HTTP

on:
  push:
    branches: [version-corregida]
    paths:
      - 'M01_INTRODUCCION_MICROSERVICIOS/PRACTICAS/M01_PRACTICAS.md'
      - 'tools/reconstruir_m01_desde_cero.py'
      - 'tools/validar_m01_windows.py'
      - '.github/workflows/m01-desde-cero-windows-e2e.yml'
  workflow_dispatch:

concurrency:
  group: m01-desde-cero-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  PYTHONIOENCODING: utf-8
  DOTNET_CLI_TELEMETRY_OPTOUT: '1'

jobs:
  reconstruir:
    name: M01 cinco puntos desde vacío y SQL Express real
    runs-on: windows-2022
    timeout-minutes: 95
    steps:
      - name: Habilitar rutas largas
        shell: pwsh
        run: git config --global core.longpaths true
      - uses: actions/checkout@v4
        with:
          ref: version-corregida
          sparse-checkout: |
            M01_INTRODUCCION_MICROSERVICIOS
            tools
          sparse-checkout-cone-mode: true
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Comprobar SQL Server 2022 Express
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $service = Get-Service -Name 'MSSQL$SQLEXPRESS' -ErrorAction SilentlyContinue
          if ($null -eq $service) {
            choco install sql-server-express --version=2022.16.0.20260305 -y --no-progress
            if ($LASTEXITCODE -notin @(0,3010,1641)) {
              throw 'No pudo instalarse SQL Server Express 2022'
            }
            $service = Get-Service -Name 'MSSQL$SQLEXPRESS' -ErrorAction Stop
          }
          if ($service.Status -ne 'Running') { Start-Service 'MSSQL$SQLEXPRESS' }
          if ((Get-Service 'MSSQL$SQLEXPRESS').Status -ne 'Running') {
            throw 'SQL Express no disponible'
          }
      - name: Crear desde carpeta vacia, compilar y E2E real
        shell: pwsh
        run: |
          python tools/reconstruir_m01_desde_cero.py --e2e --report M01_RECONSTRUCCION_CERO.md
          if ($LASTEXITCODE -ne 0) { throw 'No se ha completado M01 desde cero' }
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: evidencia-m01-desde-cero-windows
          path: M01_RECONSTRUCCION_CERO.md
          retention-days: 30
