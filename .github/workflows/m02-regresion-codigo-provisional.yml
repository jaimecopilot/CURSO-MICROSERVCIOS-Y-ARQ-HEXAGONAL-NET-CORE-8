name: M02 - regresion tecnica provisional (sin certificado editorial)

on:
  push:
    branches:
      - desarrollo/m02-apis-rest-20261015
    paths:
      - 'M02_APIS_REST_ASPNET_CORE/PROYECTO/**'
      - '.github/scripts/e2e_m02_stages.py'
      - '.github/workflows/m02-regresion-codigo-provisional.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  soluciones:
    name: "Punto ${{ matrix.punto }} - ${{ matrix.tests }} tests"
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        include:
          - { punto: '2.1-diseno-apis-rest', tests: 31, proyectos: 7 }
          - { punto: '2.2-recursos-verbos-codigos', tests: 36, proyectos: 8 }
          - { punto: '2.3-validacion-peticiones', tests: 42, proyectos: 9 }
          - { punto: '2.4-documentacion-openapi', tests: 51, proyectos: 10 }
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x
      - name: Restaurar y compilar la solución independiente
        if: contains(matrix.punto, '2.4')
        shell: bash
        run: |
          set -euo pipefail
          base="M02_APIS_REST_ASPNET_CORE/PROYECTO/${{ matrix.punto }}"
          count=$(find "$base" -name '*.csproj' | wc -l)
          test "$count" -eq "${{ matrix.proyectos }}"
          dotnet restore "$base/AceriaApp.sln"
          dotnet build "$base/AceriaApp.sln" -c Release --no-restore
      - name: Ejecutar cada proyecto xUnit y registrar resultados TRX
        if: contains(matrix.punto, '2.4')
        shell: bash
        run: |
          set -euo pipefail
          base="M02_APIS_REST_ASPNET_CORE/PROYECTO/${{ matrix.punto }}"
          mkdir -p m02-trx
          for project in "$base"/tests/*/*.csproj; do
            name=$(basename "$project" .csproj)
            dotnet test "$project" -c Release --no-build --no-restore \
              --logger "trx;LogFileName=$name.trx" --results-directory "$GITHUB_WORKSPACE/m02-trx"
          done
      - name: Comprobar recuento real de pruebas y ausencia de fallos
        if: contains(matrix.punto, '2.4')
        env:
          EXPECTED_TESTS: "${{ matrix.tests }}"
          EXPECTED_TEST_PROJECTS: "${{ matrix.proyectos }}"
        shell: bash
        run: |
          python - <<'PY'
          import glob,os,xml.etree.ElementTree as ET
          files=glob.glob('m02-trx/*.trx')
          expected_projects=int(os.environ['EXPECTED_TEST_PROJECTS'])-1
          assert len(files)==expected_projects, (len(files),expected_projects,files)
          passed=0
          for f in files:
              root=ET.parse(f).getroot()
              c=root.find('.//{*}ResultSummary/{*}Counters')
              assert c is not None,f
              total=int(c.attrib['total'])
              ok=int(c.attrib['passed'])
              failed=int(c.attrib['failed'])
              assert total==ok and failed==0,(f,total,ok,failed)
              passed+=ok
          expected=int(os.environ['EXPECTED_TESTS'])
          assert passed==expected, (passed,expected)
          print(f'REGRESION DE CODIGO: {passed} pruebas pasadas en {len(files)} proyectos.')
          print('ESTO NO CERTIFICA LA FIDELIDAD DE LOS TEXTOS NI LOS 96 PASOS.')
          PY
      - name: Ejecutar 24 estados progresivos de 2.1 y 2.2
        if: !contains(matrix.punto, '2.4')
        run: python .github/scripts/e2e_m02_stages.py --root . --point "${{ matrix.punto == '2.1-diseno-apis-rest' && '2.1' || (matrix.punto == '2.2-recursos-verbos-codigos' && '2.2' || '2.3') }}"
      - name: Conservar resultados por punto
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: "m02-regresion-${{ matrix.punto }}"
          path: |
            m02-trx/*.trx
            m02-stages-*.json
          if-no-files-found: warn
