name: M07 - Diagnostico de puerto RabbitMQ
on:
  push:
    branches: ['diagnostico/m07-rabbit']
    paths: ['.github/workflows/m07-broker-diagnostico.yml']
jobs:
  puerto:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Comparar mapeo automatico y explicito al reiniciar
        run: |
          python - <<'PY'
          import subprocess,json,socket,time
          def cmd(*args):return subprocess.check_output(args,text=True).strip()
          def info(cid):
              data=json.loads(cmd('docker','inspect',cid))[0]
              return {'running':data['State']['Running'],'binding':data['HostConfig']['PortBindings'].get('5672/tcp'),'published':data['NetworkSettings']['Ports'].get('5672/tcp')}
          def port(data):return int(data['published'][0]['HostPort'])
          def connects(p):
              try:
                  with socket.create_connection(('127.0.0.1',p),timeout=1):return True
              except OSError:return False
          def ready(cid):
              deadline=time.monotonic()+90
              while time.monotonic()<deadline:
                  data=info(cid)
                  if data['running'] and data['published'] and connects(port(data)):
                      if subprocess.run(['docker','exec',cid,'rabbitmq-diagnostics','-q','ping'],stdout=subprocess.DEVNULL,stderr=subprocess.DEVNULL).returncode==0:return data
                  time.sleep(1)
              print(json.dumps({'ultimo_estado':info(cid)}),flush=True)
              raise TimeoutError('RabbitMQ no arranco')
          results=[]
          for kind in ('automatico','explicito'):
              with socket.socket() as candidate:
                  candidate.bind(('127.0.0.1',0));chosen=candidate.getsockname()[1]
              mapping='127.0.0.1::5672' if kind=='automatico' else f'127.0.0.1:{chosen}:5672'
              cid=cmd('docker','run','-d','-p',mapping,'rabbitmq:4.1.5-management')
              try:
                  before=ready(cid)
                  subprocess.run(['docker','stop','--time','3',cid],check=True)
                  subprocess.run(['docker','start',cid],check=True)
                  after=ready(cid)
                  row={'caso':kind,'antes':before,'despues':after,'puerto_original_accesible':connects(port(before)),'puerto_actual_accesible':connects(port(after))}
                  print(json.dumps(row),flush=True);results.append(row)
              finally:subprocess.run(['docker','rm','-f',cid],check=True)
          changed=port(results[0]['antes'])!=port(results[0]['despues'])
          stable=port(results[1]['antes'])==port(results[1]['despues']) and results[1]['puerto_original_accesible']
          print(json.dumps({'hipotesis_puerto_dinamico_confirmada':changed,'mapeo_explicito_estable':stable}),flush=True)
          assert changed and stable
          PY
