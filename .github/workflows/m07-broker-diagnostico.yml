name: M07 - Diagnostico de puerto RabbitMQ
on:
  push:
    branches: ['diagnostico/m07-rabbit']
    paths: ['.github/workflows/m07-broker-diagnostico.yml']
jobs:
  puerto:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      DOTNET_PROCESSOR_COUNT: '1'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with: {dotnet-version: '8.0.x'}
      - name: Reproducir con el host real y registrar puertos estado y permisos
        run: |
          mkdir -p .qa
          cat > .qa/m07_broker_probe.py <<'PY'
          import os,subprocess,json,socket,time,urllib.parse
          cid=os.environ['ACERIA_RABBIT_CONTAINER_ID']
          configured=urllib.parse.urlsplit(os.environ['ACERIA_TEST_RABBITMQ']).port
          def info():
              data=json.loads(subprocess.check_output(['docker','inspect',cid],text=True))[0]
              return {'state':data['State'],'binding':data['HostConfig']['PortBindings'],'published':data['NetworkSettings']['Ports'],'user':data['Config']['User'],'entrypoint':data['Config']['Entrypoint'],'cmd':data['Config']['Cmd']}
          def connects(port):
              try:
                  with socket.create_connection(('127.0.0.1',port),timeout=1):return True
              except OSError:return False
          before=info();print(json.dumps({'antes':before,'puerto_configurado':configured,'tcp_inicial':connects(configured)}),flush=True)
          subprocess.run(['docker','exec','--user','0',cid,'stat','-c','%u:%g %a %n','/var/lib/rabbitmq/.erlang.cookie'])
          subprocess.run(['docker','stop','--time','3',cid],check=True)
          subprocess.run(['docker','start',cid],check=True)
          deadline=time.monotonic()+45
          while time.monotonic()<deadline:
              after=info()
              if not after['state']['Running'] or connects(configured):break
              time.sleep(1)
          print(json.dumps({'despues':after,'tcp_puerto_inicial':connects(configured)}),flush=True)
          subprocess.run(['docker','logs','--tail','80',cid])
          assert after['state']['Running'] and connects(configured),'El host deja de responder tras el reinicio'
          PY
          dotnet run --project tools/M07ValidationHost -c Release -- python .qa/m07_broker_probe.py
