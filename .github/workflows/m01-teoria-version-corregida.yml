name: M01 teoria corregida - revision de PDF
on:
  push:
    branches:
      - 'resguardo/tecnico-m01-m08-20261112'
    paths:
      - '.github/workflows/m01-teoria-version-corregida.yml'
  workflow_dispatch:
permissions:
  contents: write
jobs:
  generar:
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    steps:
      - name: Herramientas técnicas de generación
        uses: actions/checkout@v4
        with:
          ref: resguardo/tecnico-m01-m08-20261112
          path: _ci_tecnica
      - name: Teoría editorial sin las prácticas del profesor
        uses: actions/checkout@v4
        with:
          ref: version-corregida
          fetch-depth: 1
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Instalar dependencias de PDF
        shell: bash
        run: |
          python -m pip install --disable-pip-version-check \
            'markdown==3.10.1' 'weasyprint==67.0' 'pymupdf==1.26.5'
      - name: Renderizar, conservar ejemplos y auditar geometría
        shell: bash
        run: |
          set -euo pipefail
          python _ci_tecnica/.github/scripts/m01_regenerar_teoria_editorial.py
      - name: Publicar solo el PDF verificado en version-corregida
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add M01_INTRODUCCION_MICROSERVICIOS/TEORIA/M01_TEORIA.pdf
          if ! git diff --cached --quiet; then
            git commit -m 'docs(m01 teoria): PDF corregido conforme a Markdown'
            git push origin HEAD:refs/heads/version-corregida
          else
            echo 'PDF ya sincronizado'
          fi
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: auditoria-editorial-m01-teoria
          path: |
            M01_INTRODUCCION_MICROSERVICIOS/TEORIA/M01_TEORIA.pdf
            /tmp/m01_teoria_editorial_auditoria.json
