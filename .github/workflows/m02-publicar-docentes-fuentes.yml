name: M02 - publicar docentes desde fuentes originales

on:
  push:
    branches:
      - desarrollo/m02-apis-rest-20261015
    paths:
      - '.github/workflows/m02-publicar-docentes-fuentes.yml'
      - '.github/scripts/construir_m02_desde_fuentes.py'
      - '.github/scripts/pedagogia_m02.py'
      - '.github/scripts/maquetacion_m02.py'
      - 'M02_APIS_REST_ASPNET_CORE/TEORIA/IMAGENES/*.svg'
      - '.github/scripts/pdf_m02_previsualizacion.py'
      - '.github/fuentes-originales/m02/punto-2.*.md'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: m02-fuentes-publicacion
  cancel-in-progress: true

jobs:
  publicar:
    name: Generar, comprobar y publicar MD y PDF en rama M02
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
          ref: desarrollo/m02-apis-rest-20261015
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Instalar motor de maquetación
        run: python -m pip install --disable-pip-version-check --quiet markdown weasyprint pymupdf
      - name: Construir los DOS Markdown desde cuatro fuentes
        run: |
          python .github/scripts/construir_m02_desde_fuentes.py --salida m02_publicacion
      - name: Copiar figuras vectoriales reproducibles antes del PDF
        run: |
          mkdir -p m02_publicacion/IMAGENES
          cp M02_APIS_REST_ASPNET_CORE/TEORIA/IMAGENES/*.svg m02_publicacion/IMAGENES/
          test "$(find m02_publicacion/IMAGENES -maxdepth 1 -name '*.svg' | wc -l)" -eq 8
      - name: Comprobar recuentos, correcciones y ausencia de cortes
        run: |
          python - <<'PY'
          import json,re
          from pathlib import Path
          root=Path("m02_publicacion")
          info=json.loads((root/"INFORME.json").read_text(encoding="utf-8"))
          assert info["es_material_final"] is True and not info["faltan"]
          assert [x["point"] for x in info["fuentes_presentes"]]==["2.1","2.2","2.3","2.4"]
          teoria=(root/"M02_TEORIA.md").read_text(encoding="utf-8")
          practicas=(root/"M02_PRACTICAS.md").read_text(encoding="utf-8")
          assert len(re.findall(r"(?m)^### Bloque \d+ —",teoria)) == 40
          assert len(re.findall(r"(?m)^### PASO 2\.[1-4]\.\d+ —",practicas)) == 96
          assert teoria.count("](IMAGENES/")==8, "Faltan gráficos en teoría"
          assert practicas.count("| Error observado | Causa | Solución guiada |")==4, "No hay cuatro tablas de errores"
          assert len(re.findall(r"(?m)^\| [^|]+ \| [^|]+ \| [^|]+ \|$",practicas))>=44, "Faltan filas de tablas"
          assert "Error Causa Solución" not in practicas, "Persiste una tabla sin maquetación"
          assert len(list((root/"IMAGENES").glob("*.svg")))==8
          assert len(re.findall(r"(?m)^for %f in",practicas)) == 3
          assert "Cincuenta y una pruebas" in practicas
          assert "equipo@acerialocal" in practicas
          assert "DocumentacionExtensionsTests.cs" in practicas
          assert "EsEntornoDeProduccion" in practicas
          assert "ValidacionExtensions.cs" in practicas
          assert "FluentValidation.DependencyInjectionExtensions" in practicas
          assert "Cuarenta y cuatro pruebas" not in practicas
          assert "FluentValidation.AspNetCore" not in practicas
          assert "```markdown\n\n```" not in practicas
          assert all("Duración:" not in content for content in (teoria,practicas))
          assert "JAIME GALLO" in teoria and "JAIME GALLO" in practicas
          for text in (teoria,practicas):
              assert text.count("\n```")%2 == 0, "Hay una delimitación de código abierta"
          print("VALIDADO: cuatro fuentes, 40 bloques, 96 pasos y correcciones.")
          PY
      - name: Construir los dos PDF desde Markdown generado
        run: python .github/scripts/pdf_m02_previsualizacion.py --directorio m02_publicacion
      - name: Copiar a las carpetas lectivas del alumno
        run: |
          set -euo pipefail
          cp m02_publicacion/M02_TEORIA.md M02_APIS_REST_ASPNET_CORE/TEORIA/M02_TEORIA.md
          cp m02_publicacion/M02_TEORIA.pdf M02_APIS_REST_ASPNET_CORE/TEORIA/M02_TEORIA.pdf
          cp m02_publicacion/IMAGENES/*.svg M02_APIS_REST_ASPNET_CORE/TEORIA/IMAGENES/
          cp m02_publicacion/M02_PRACTICAS.md M02_APIS_REST_ASPNET_CORE/PRACTICAS/M02_PRACTICAS.md
          cp m02_publicacion/M02_PRACTICAS.pdf M02_APIS_REST_ASPNET_CORE/PRACTICAS/M02_PRACTICAS.pdf
      - name: Commit SOLO materiales de la rama M02
        env:
          TARGET_BRANCH: desarrollo/m02-apis-rest-20261015
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add \
            M02_APIS_REST_ASPNET_CORE/TEORIA/M02_TEORIA.md \
            M02_APIS_REST_ASPNET_CORE/TEORIA/M02_TEORIA.pdf \
            M02_APIS_REST_ASPNET_CORE/TEORIA/IMAGENES/*.svg \
            M02_APIS_REST_ASPNET_CORE/PRACTICAS/M02_PRACTICAS.md \
            M02_APIS_REST_ASPNET_CORE/PRACTICAS/M02_PRACTICAS.pdf
          if ! git diff --cached --quiet; then
            git commit -m "docs(m02): regenerar materiales fieles a 2.1-2.4"
            git push origin "HEAD:$TARGET_BRANCH"
          else
            echo "No hay diferencias materiales que publicar."
          fi
      - name: Subir informe de procedencia
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: m02-procedencia-materiales-y-pdfs
          path: m02_publicacion/
          if-no-files-found: warn
