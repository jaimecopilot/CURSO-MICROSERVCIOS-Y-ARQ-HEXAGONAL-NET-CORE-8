name: M02 - sincronizar laboratorio MD y PDF
on:
  push:
    branches:
      - 'verificacion/e2e-main-20261110'
    paths:
      - 'M02_APIS_REST_ASPNET_CORE/PRACTICAS/M02_PRACTICAS.md'
      - '.github/scripts/generar_pdf_m02.py'
      - '.github/workflows/m02-labs-pdf.yml'
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: m02-labs-pdf
  cancel-in-progress: false
jobs:
  maquetar:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Instalar herramientas de maquetacion
        run: python -m pip install markdown weasyprint pymupdf
      - name: Generar PDF M02 desde el Markdown del laboratorio
        run: python .github/scripts/generar_pdf_m02.py
      - name: Publicar el mismo PDF verificado en esta rama
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add M02_APIS_REST_ASPNET_CORE/PRACTICAS/M02_PRACTICAS.pdf
          if ! git diff --cached --quiet; then
            git commit -m "docs(m02): actualizar PDF de practicas desde Markdown validado"
            git push
          fi
