name: Conservar dos ramas y archivar historicos 2026-11-13

on:
  push:
    branches: [version-corregida]
    paths:
      - '.github/workflows/depurar-ramas-final-20261113.yml'

permissions:
  contents: write

jobs:
  archivar-y-depurar:
    if: github.ref == 'refs/heads/version-corregida'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
    steps:
      - name: Inventario exacto y comprobacion de HEADs
        shell: bash
        run: |
          set -euo pipefail
          cat > /tmp/ramas_a_depurarse.txt <<'EOF'
          alumnos/m01-m08-limpio-20261112|5f2aeee6b8b40a9d5e727580fbfca3032f2f8e4c|archivo/20261113/alumnos-m01-m08-limpio
          resguardo/tecnico-m01-m08-20261112|28917e95de76d1214dc0d842211a845002fd37e4|archivo/20261113/resguardo-tecnico-m01-m08
          revision/cierre-windows-m01-m08-20261112|db47ece81925b1f0e14661211ad40376e9038210|archivo/20261113/revision-cierre-windows-m01-m08
          EOF
          ramas="$(gh api "repos/${GH_REPO}/branches?per_page=100" --jq '.[].name' | sort)"
          echo "Inventario actual:"
          printf '%s\n' "$ramas"
          while IFS= read -r ref; do
            case "$ref" in
              main|version-corregida|alumnos/m01-m08-limpio-20261112|resguardo/tecnico-m01-m08-20261112|revision/cierre-windows-m01-m08-20261112) ;;
              *) echo "::error::Rama inesperada $ref; cancelando eliminacion"; exit 1 ;;
            esac
          done <<< "$ramas"
          grep -qx 'main' <<< "$ramas"
          grep -qx 'version-corregida' <<< "$ramas"
          while IFS='|' read -r ref sha tag; do
            if grep -qxF "$ref" <<< "$ramas"; then
              actual="$(gh api "repos/${GH_REPO}/git/ref/heads/${ref}" --jq '.object.sha')"
              if [[ "$actual" != "$sha" ]]; then
                echo "::error::El HEAD de $ref cambió. Esperado $sha, encontrado $actual. No borrar."
                exit 1
              fi
            fi
          done < /tmp/ramas_a_depurarse.txt

      - name: Archivar los tres HEADs como etiquetas de respaldo
        shell: bash
        run: |
          set -euo pipefail
          while IFS='|' read -r ref sha tag; do
            if existing="$(gh api "repos/${GH_REPO}/git/ref/tags/${tag}" --jq '.object.sha' 2>/dev/null)"; then
              if [[ "$existing" != "$sha" ]]; then
                echo "::error::La etiqueta $tag ya existe y apunta a un commit diferente. Se detiene."
                exit 1
              fi
            else
              gh api -X POST "repos/${GH_REPO}/git/refs" -f "ref=refs/tags/${tag}" -f "sha=${sha}" --jq '.ref'
            fi
            confirmed="$(gh api "repos/${GH_REPO}/git/ref/tags/${tag}" --jq '.object.sha')"
            if [[ "$confirmed" != "$sha" ]]; then
              echo "::error::No se preservó el SHA original de $ref."
              exit 1
            fi
            echo "ARCHIVADO: $ref @$sha --> refs/tags/$tag"
          done < /tmp/ramas_a_depurarse.txt

      - name: Retirar solo las tres ramas antiguas, verificando cada SHA
        shell: bash
        run: |
          set -euo pipefail
          while IFS='|' read -r ref sha tag; do
            if existing="$(gh api "repos/${GH_REPO}/git/ref/heads/${ref}" --jq '.object.sha' 2>/dev/null)"; then
              if [[ "$existing" != "$sha" ]]; then
                echo "::error::El HEAD de $ref cambió mientras se archivaba; abortar."
                exit 1
              fi
              archived="$(gh api "repos/${GH_REPO}/git/ref/tags/${tag}" --jq '.object.sha')"
              if [[ "$archived" != "$sha" ]]; then
                echo "::error::La etiqueta $tag no conserva el SHA correcto."
                exit 1
              fi
              gh api -X DELETE "repos/${GH_REPO}/git/refs/heads/${ref}" >/dev/null
              echo "ELIMINADA: $ref (historial conservado en $tag)"
            fi
          done < /tmp/ramas_a_depurarse.txt
          current="$(gh api "repos/${GH_REPO}/branches?per_page=100" --jq '.[].name' | sort)"
          expected="$(printf '%s\n' main version-corregida | sort)"
          if [[ "$current" != "$expected" ]]; then
            echo "::error::El inventario final no contiene exactamente main y version-corregida."
            printf 'Ramas: %s\n' "$current"
            exit 1
          fi
          echo "PASS: exactamente DOS ramas: main y version-corregida."
