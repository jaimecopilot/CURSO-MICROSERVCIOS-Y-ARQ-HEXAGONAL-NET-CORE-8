V275.0 H445" fill="none" stroke="#147E92" stroke-width="3" marker-end="url(#teal)"/><rect x="388.8" y="248.0" width="42.4" height="23" rx="5" fill="#F8FAFC"/><text x="410.0" y="265.0" text-anchor="middle" font-family="DejaVu Sans,Arial,sans-serif" font-size="13" font-weight="400" fill="#147E92">HTTP</text><path d="M755,275.0 H790.0 V275.0 H825" fill="none" stroke="#147E92" stroke-width="3" marker-end="url(#teal)"/><rect x="768.8" y="248.0" width="42.4" height="23" rx="5" fill="#F8FAFC"/><text x="790.0" y="265.0" text-anchor="middle" font-family="DejaVu Sans,Arial,sans-serif" font-size="13" font-weight="400" fill="#147E92">dato</text><rect x="65" y="195" width="310" height="160" rx="15" fill="#EBF3F9" stroke="#247397" stroke-width="2"/><rect x="65" y="195" width="7" height="160" rx="3" fill="#247397"/><text x="220.0" y="227" text-anchor="middle" font-family="DejaVu Sans,Arial,sans-serif" font-size="20" font-weight="700" fill="#247397">Producción solicita</text><text x="220.0" y="257" text-anchor="middle" font-family="DejaVu Sans,Arial,sans-serif" font-size="17" font-weight="400" fill="#17314A">Necesita el dato para</text><text x="220.0" y="281" text-anchor="middle" font-family="DejaVu Sans,Arial,sans-serif" font-size="17" font-weight="400" fill="#17314A">continuar</text><rect x="445" y="195" width="310" height="160" rx="15" fill="#E7F6F6" stroke="#147E92" stroke-width="2"/><rect x="445" y="195" width="7" height="160" rx="3" fill="#147E92"/><text x="600.0" y="227" text-anchor="middle" font-family="DejaVu Sans,Arial,sans-serif" font-size="20" font-weight="700" fill="#147E92">Inventario responde</text><text x="600.0" y="257" text-anchor="middle" font-family="DejaVu Sans,Arial,sans-serif" font-size="17" font-weight="400" fill="#17314A">Consulta su propio estado</text><rect x="825" y="195" width="310" height="160" rx="15" fill="#E7F6EE" stroke="#177D65" stroke-width="2"/><rect x="825" y="195" width="7" height="160" rx="3" fill="#177D65"/><text x="980.0" y="227" text-anchor="middle" font-family="DejaVu Sans,Arial,sans-serif" font-size="20" font-weight="700" fill="#177D65">Producción continúa</text><text x="980.0" y="257" text-anchor="middle" font-family="DejaVu Sans,Arial,sans-serif" font-size="17" font-weight="400" fill="#17314A">Resultado, error o</text><text x="980.0" y="281" text-anchor="middle" font-family="DejaVu Sans,Arial,sans-serif" font-size="17" font-weight="400" fill="#17314A">cancelación</text><rect x="295" y="465" width="630" height="140" rx="15" fill="#FEF5E9" stroke="#98621C" stroke-width="2"/><rect x="295" y="465" width="7" height="140" rx="3" fill="#98621C"/><text x="610.0" y="497" text-anchor="middle" font-family="DejaVu Sans,Arial,sans-serif" font-size="20" font-weight="700" fill="#98621C">Durante await</text><text x="610.0" y="527" text-anchor="middle" font-family="DejaVu Sans,Arial,sans-serif" font-size="17" font-weight="400" fill="#17314A">El hilo puede atender otro trabajo mientras espera la E/S</text><line x1="45" y1="670" x2="1175" y2="670" stroke="#D3E1EB"/><text x="60" y="701" text-anchor="start" font-family="DejaVu Sans,Arial,sans-serif" font-size="17" font-weight="400" fill="#526779">El acoplamiento temporal permanece. HTTP/1.1 y HTTP/2 usan TCP; HTTP/3 utiliza QUIC sobre UDP.</text></svg>