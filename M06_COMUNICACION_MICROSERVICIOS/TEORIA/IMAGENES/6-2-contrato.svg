<svg xmlns="http://www.w3.org/2000/svg" width="1220" height="760" viewBox="0 0 1220 760" role="img" aria-label="Un evento comunica un hecho con identidad estable"><title>Un evento comunica un hecho con identidad estable</title><desc>Contrato público del módulo: OrdenPlanificadaV1, validado por Inventario.</desc><defs><marker id="blue" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10Z" fill="#247397"/></marker><marker id="green" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10Z" fill="#177D65"/></marker><marker id="gold" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10Z" fill="#98621C"/></marker><marker id="teal" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10Z" fill="#147E92"/></marker><marker id="red" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10Z" fill="#A23D48"/></marker><marker id="gray" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10Z" fill="#526779"/></marker></defs><rect width="1220" height="760" fill="white"/><rect width="1220" height="760" rx="20" fill="#F8FAFC"/><rect x="38" y="31" width="7" height="62" rx="3" fill="#147E92"/><text x="65" y="65" text-anchor="start" font-family="DejaVu Sans,Arial,sans-serif" font-size="28" font-weight="700" fill="#17314A">Un evento comunica un hecho con identidad estable</text><text x="65" y="102" text-anchor="start" font-family="DejaVu Sans,Arial,sans-serif" font-size="18" font-weight="400" fill="#526779">Contrato público del módulo: OrdenPlanificadaV1, validado por Inventario.</text><line x1="45" y1="128" x2="1175" y2="128" stroke="#D3E1EB"/><rect x="65" y="215" width="310" height="180" rx="15" fill="#E7F6F6" stroke="#147E92" stroke-width="2"/><rect x="65" y="215" width="7" height="180" rx="3" fill="#147E92"/><text x="220.0" y="247" text-anchor="middle" font-family="DejaVu Sans,Arial,sans-serif" font-size="20" font-weight="700" fill="#147E92">EventoId</text><text x="220.0" y="277" text-anchor="middle" font-family="DejaVu Sans,Arial,sans-serif" font-size="17" font-weight="400" fill="#17314A">Una ocurrencia</text><text x="220.0" y="301" text-anchor="middle" font-family="DejaVu Sans,Arial,sans-serif" font-size="17" font-weight="400" fill="#17314A">Se conserva al reintentar</text><rect x="445" y="215" width="310" height="180" rx="15" fill="#E7F6EE" stroke="#177D65" stroke-width="2"/><rect x="445" y="215" width="7" height="180" rx="3" fill="#177D65"/><text x="600.0" y="247" text-anchor="middle" font-family="DejaVu Sans,Arial,sans-serif" font-size="20" font-weight="700" fill="#177D65">OrdenId y Lineas</text><text x="600.0" y="277" text-anchor="middle" font-family="DejaVu Sans,Arial,sans-serif" font-size="17" font-weight="400" fill="#17314A">Identidad del agregado</text><text x="600.0" y="301" text-anchor="middle" font-family="DejaVu Sans,Arial,sans-serif" font-size="17" font-weight="400" fill="#17314A">Material y cantidad</text><rect x="825" y="215" width="310" height="180" rx="15" fill="#EBF3F9" stroke="#247397" stroke-width="2"/><rect x="825" y="215" width="7" height="180" rx="3" fill="#247397"/><text x="980.0" y="247" text-anchor="middle" font-family="DejaVu Sans,Arial,sans-serif" font-size="20" font-weight="700" fill="#247397">Version = 1</text><text x="980.0" y="277" text-anchor="middle" font-family="DejaVu Sans,Arial,sans-serif" font-size="17" font-weight="400" fill="#17314A">Esquema y significado</text><text x="980.0" y="301" text-anchor="middle" font-family="DejaVu Sans,Arial,sans-serif" font-size="17" font-weight="400" fill="#17314A">Validación del consumidor</text><rect x="295" y="480" width="630" height="135" rx="15" fill="#FEF5E9" stroke="#98621C" stroke-width="2"/><rect x="295" y="480" width="7" height="135" rx="3" fill="#98621C"/><text x="610.0" y="512" text-anchor="middle" font-family="DejaVu Sans,Arial,sans-serif" font-size="20" font-weight="700" fill="#98621C">OcurridoEnUtc</text><text x="610.0" y="542" text-anchor="middle" font-family="DejaVu Sans,Arial,sans-serif" font-size="17" font-weight="400" fill="#17314A">Diagnóstico y antigüedad; no garantiza un orden global</text><line x1="45" y1="670" x2="1175" y2="670" stroke="#D3E1EB"/><text x="60" y="701" text-anchor="start" font-family="DejaVu Sans,Arial,sans-serif" font-size="17" font-weight="400" fill="#526779">El inbox comprueba identidad y huella del payload. Reutilizar un identificador con otro contenido es un</text><text x="60" y="726" text-anchor="start" font-family="DejaVu Sans,Arial,sans-serif" font-size="17" font-weight="400" fill="#526779">conflicto.</text></svg>