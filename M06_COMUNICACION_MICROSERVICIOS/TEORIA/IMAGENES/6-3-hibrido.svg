<svg xmlns="http://www.w3.org/2000/svg" width="1220" height="760" viewBox="0 0 1220 760" role="img" aria-label="Flujo híbrido: aceptación local y resultado diferido"><title>Flujo híbrido: aceptación local y resultado diferido</title><desc>El endpoint de planificación combina una observación HTTP con un hecho que se propaga.</desc><defs><marker id="blue" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10Z" fill="#247397"/></marker><marker id="green" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10Z" fill="#177D65"/></marker><marker id="gold" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10Z" fill="#98621C"/></marker><marker id="teal" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10Z" fill="#147E92"/></marker><marker id="red" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10Z" fill="#A23D48"/></marker><marker id="gray" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10Z" fill="#526779"/></marker></defs><rect width="1220" height="760" fill="white"/><rect width="1220" height="760" rx="20" fill="#F8FAFC"/><rect x="38" y="31" width="7" height="62" rx="3" fill="#147E92"/><text x="65" y="65" text-anchor="start" font-family="DejaVu Sans,Arial,sans-serif" font-size="28" font-weight="700" fill="#17314A">Flujo híbrido: aceptación local y resultado diferido</text><text x="65" y="102" text-anchor="start" font-family="DejaVu Sans,Arial,sans-serif" font-size="18" font-weight="400" fill="#526779">El endpoint de planificación combina una observación HTTP con un hecho que se propaga.</text><line x1="45" y1="128" x2="1175" y2="128" stroke="#D3E1EB"/><path d="M375,272.5 H410.0 V272.5 H445" fill="none" stroke="#147E92" stroke-width="3" marker-end="url(#teal)"/><rect x="385.0" y="245.5" width="50.0" height="23" rx="5" fill="#F8FAFC"/><text x="410.0" y="262.5" text-anchor="middle" font-family="DejaVu Sans,Arial,sans-serif" font-size="13" font-weight="400" fill="#147E92">sigue</text><path d="M755,272.5 H790.0 V272.5 H825" fill="none" stroke="#147E92" stroke-width="3" marker-end="url(#teal)"/><rect x="772.6" y="245.5" width="34.8" height="23" rx="5" fill="#F8FAFC"/><text x="790.0" y="262.5" text-anchor="middle" font-family="DejaVu Sans,Arial,sans-serif" font-size="13" font-weight="400" fill="#147E92">202</text><path d="M600.0,355 V410.0 H600.0 V465" fill="none" stroke="#147E92" stroke-width="3" marker-end="url(#teal)"/><rect x="559.8" y="384.0" width="80.39999999999999" height="23" rx="5" fill="#F8FAFC"/><text x="600.0" y="401.0" text-anchor="middle" font-family="DejaVu Sans,Arial,sans-serif" font-size="13" font-weight="400" fill="#147E92">pendiente</text><path d="M755,547.5 H790.0 V547.5 H825" fill="none" stroke="#147E92" stroke-width="3" marker-end="url(#teal)"/><rect x="757.4" y="520.5" width="65.19999999999999" height="23" rx="5" fill="#F8FAFC"/><text x="790.0" y="537.5" text-anchor="middle" font-family="DejaVu Sans,Arial,sans-serif" font-size="13" font-weight="400" fill="#147E92">propaga</text><rect x="65" y="190" width="310" height="165" rx="15" fill="#EBF3F9" stroke="#247397" stroke-width="2"/><rect x="65" y="190" width="7" height="165" rx="3" fill="#247397"/><text x="220.0" y="222" text-anchor="middle" font-family="DejaVu Sans,Arial,sans-serif" font-size="20" font-weight="700" fill="#247397">1 · Consulta HTTP</text><text x="220.0" y="252" text-anchor="middle" font-family="DejaVu Sans,Arial,sans-serif" font-size="17" font-weight="400" fill="#17314A">Disponibilidad informativa</text><text x="220.0" y="276" text-anchor="middle" font-family="DejaVu Sans,Arial,sans-serif" font-size="17" font-weight="400" fill="#17314A">Puede fallar o caducar</text><rect x="445" y="190" width="310" height="165" rx="15" fill="#E7F6EE" stroke="#177D65" stroke-width="2"/><rect x="445" y="190" width="7" height="165" rx="3" fill="#177D65"/><text x="600.0" y="222" text-anchor="middle" font-family="DejaVu Sans,Arial,sans-serif" font-size="20" font-weight="700" fill="#177D65">2 · Commit local</text><text x="600.0" y="252" text-anchor="middle" font-family="DejaVu Sans,Arial,sans-serif" font-size="17" font-weight="400" fill="#17314A">Planificación + outbox</text><text x="600.0" y="276" text-anchor="middle" font-family="DejaVu Sans,Arial,sans-serif" font-size="17" font-weight="400" fill="#17314A">Transacción de Producción</text><rect x="825" y="190" width="310" height="165" rx="15" fill="#EBF3F9" stroke="#247397" stroke-width="2"/><rect x="825" y="190" width="7" height="165" rx="3" fill="#247397"/><text x="980.0" y="222" text-anchor="middle" font-family="DejaVu Sans,Arial,sans-serif" font-size="20" font-weight="700" fill="#247397">3 · Respuesta 202</text><text x="980.0" y="252" text-anchor="middle" font-family="DejaVu Sans,Arial,sans-serif" font-size="17" font-weight="400" fill="#17314A">Referencia a la orden</text><text x="980.0" y="276" text-anchor="middle" font-family="DejaVu Sans,Arial,sans-serif" font-size="17" font-weight="400" fill="#17314A">No acredita consumo remoto</text><rect x="445" y="465" width="310" height="165" rx="15" fill="#E7F6F6" stroke="#147E92" stroke-width="2"/><rect x="445" y="465" width="7" height="165" rx="3" fill="#147E92"/><text x="600.0" y="497" text-anchor="middle" font-family="DejaVu Sans,Arial,sans-serif" font-size="20" font-weight="700" fill="#147E92">4 · Publicación de</text><text x="600.0" y="522" text-anchor="middle" font-family="DejaVu Sans,Arial,sans-serif" font-size="20" font-weight="700" fill="#147E92">fondo</text><text x="600.0" y="552" text-anchor="middle" font-family="DejaVu Sans,Arial,sans-serif" font-size="17" font-weight="400" fill="#17314A">RabbitMQ con confirms</text><text x="600.0" y="576" text-anchor="middle" font-family="DejaVu Sans,Arial,sans-serif" font-size="17" font-weight="400" fill="#17314A">Reenvíos posibles</text><rect x="825" y="465" width="310" height="165" rx="15" fill="#FEF5E9" stroke="#98621C" stroke-width="2"/><rect x="825" y="465" width="7" height="165" rx="3" fill="#98621C"/><text x="980.0" y="497" text-anchor="middle" font-family="DejaVu Sans,Arial,sans-serif" font-size="20" font-weight="700" fill="#98621C">5 · Proyección eventual</text><text x="980.0" y="527" text-anchor="middle" font-family="DejaVu Sans,Arial,sans-serif" font-size="17" font-weight="400" fill="#17314A">Inbox y efecto local</text><text x="980.0" y="551" text-anchor="middle" font-family="DejaVu Sans,Arial,sans-serif" font-size="17" font-weight="400" fill="#17314A">Lectura HTTP posterior</text><line x1="45" y1="670" x2="1175" y2="670" stroke="#D3E1EB"/><text x="60" y="701" text-anchor="start" font-family="DejaVu Sans,Arial,sans-serif" font-size="17" font-weight="400" fill="#526779">202 se emite tras guardar el trabajo. El flujo no implementa reserva, descuento de stock, facturación ni</text><text x="60" y="726" text-anchor="start" font-family="DejaVu Sans,Arial,sans-serif" font-size="17" font-weight="400" fill="#526779">Event Sourcing.</text></svg>