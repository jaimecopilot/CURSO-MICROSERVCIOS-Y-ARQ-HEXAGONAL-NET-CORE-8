"#E7F6F6" stroke="#147E92" stroke-width="2"/><rect x="455" y="240" width="7" height="210" rx="3" fill="#147E92"/><text x="610.0" y="272" text-anchor="middle" font-family="DejaVu Sans,Arial,sans-serif" font-size="20" font-weight="700" fill="#147E92">Mensajería</text><text x="610.0" y="302" text-anchor="middle" font-family="DejaVu Sans,Arial,sans-serif" font-size="17" font-weight="400" fill="#17314A">Publicador, broker</text><text x="610.0" y="326" text-anchor="middle" font-family="DejaVu Sans,Arial,sans-serif" font-size="17" font-weight="400" fill="#17314A">y receptor</text><rect x="830" y="240" width="310" height="210" rx="15" fill="#EBF3F9" stroke="#247397" stroke-width="2"/><rect x="830" y="240" width="7" height="210" rx="3" fill="#247397"/><text x="985.0" y="272" text-anchor="middle" font-family="DejaVu Sans,Arial,sans-serif" font-size="20" font-weight="700" fill="#247397">SQL de Inventario</text><text x="985.0" y="302" text-anchor="middle" font-family="DejaVu Sans,Arial,sans-serif" font-size="17" font-weight="400" fill="#17314A">Inbox</text><text x="985.0" y="326" text-anchor="middle" font-family="DejaVu Sans,Arial,sans-serif" font-size="17" font-weight="400" fill="#17314A">+ proyección</text><line x1="45" y1="670" x2="1175" y2="670" stroke="#D3E1EB"/><text x="60" y="701" text-anchor="start" font-family="DejaVu Sans,Arial,sans-serif" font-size="17" font-weight="400" fill="#526779">Saga coordina transacciones y compensaciones; no aporta atomicidad ACID global. Consultar stock tampoco</text><text x="60" y="726" text-anchor="start" font-family="DejaVu Sans,Arial,sans-serif" font-size="17" font-weight="400" fill="#526779">reserva.</text></svg>