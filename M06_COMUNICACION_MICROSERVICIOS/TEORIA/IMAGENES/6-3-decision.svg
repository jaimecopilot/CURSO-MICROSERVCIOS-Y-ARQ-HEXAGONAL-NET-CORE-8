<svg xmlns="http://www.w3.org/2000/svg" width="1220" height="760" viewBox="0 0 1220 760" role="img" aria-label="Decidir por interacción y con condiciones explícitas"><title>Decidir por interacción y con condiciones explícitas</title><desc>El ADR documenta la necesidad, la frontera y la recuperación antes de elegir un transporte.</desc><defs><marker id="blue" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10Z" fill="#247397"/></marker><marker id="green" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10Z" fill="#177D65"/></marker><marker id="gold" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10Z" fill="#98621C"/></marker><marker id="teal" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10Z" fill="#147E92"/></marker><marker id="red" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10Z" fill="#A23D48"/></marker><marker id="gray" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10Z" fill="#526779"/></marker></defs><rect width="1220" height="760" fill="white"/><rect width="1220" height="760" rx="20" fill="#F8FAFC"/><rect x="38" y="31" width="7" height="62" rx="3" fill="#147E92"/><text x="65" y="65" text-anchor="start" font-family="DejaVu Sans,Arial,sans-serif" font-size="28" font-weight="700" fill="#17314A">Decidir por interacción y con condiciones explícitas</text><text x="65" y="102" text-anchor="start" font-family="DejaVu Sans,Arial,sans-serif" font-size="18" font-weight="400" fill="#526779">El ADR documenta la necesidad, la frontera y la recuperación antes de elegir un transporte.</text><line x1="45" y1="128" x2="1175" y2="128" stroke="#D3E1EB"/><path d="M220.0,375 V425.0 H610.0 V475" fill="none" stroke="#147E92" stroke-width="3" marker-end="url(#teal)"/><rect x="390.0" y="399.0" width="50.0" height="23" rx="5" fill="#F8FAFC"/><text x="415.0" y="416.0" text-anchor="middle" font-family="DejaVu Sans,Arial,sans-serif" font-size="13" font-weight="400" fill="#147E92">plazo</text><path d="M600.0,375 V425.0 H610.0 V475" fill="none" stroke="#147E92" stroke-width="3" marker-end="url(#teal)"/><rect x="568.6" y="399.0" width="72.8" height="23" rx="5" fill="#F8FAFC"/><text x="605.0" y="416.0" text-anchor="middle" font-family="DejaVu Sans,Arial,sans-serif" font-size="13" font-weight="400" fill="#147E92">frontera</text><path d="M980.0,375 V425.0 H610.0 V475" fill="none" stroke="#147E92" stroke-width="3" marker-end="url(#teal)"/><rect x="766.2" y="399.0" width="57.599999999999994" height="23" rx="5" fill="#F8FAFC"/><text x="795.0" y="416.0" text-anchor="middle" font-family="DejaVu Sans,Arial,sans-serif" font-size="13" font-weight="400" fill="#147E92">fallos</text><rect x="65" y="200" width="310" height="175" rx="15" fill="#EBF3F9" stroke="#247397" stroke-width="2"/><rect x="65" y="200" width="7" height="175" rx="3" fill="#247397"/><text x="220.0" y="232" text-anchor="middle" font-family="DejaVu Sans,Arial,sans-serif" font-size="20" font-weight="700" fill="#247397">Respuesta necesaria</text><text x="220.0" y="262" text-anchor="middle" font-family="DejaVu Sans,Arial,sans-serif" font-size="17" font-weight="400" fill="#17314A">¿Resultado ahora</text><text x="220.0" y="286" text-anchor="middle" font-family="DejaVu Sans,Arial,sans-serif" font-size="17" font-weight="400" fill="#17314A">o aceptación duradera?</text><rect x="445" y="200" width="310" height="175" rx="15" fill="#E7F6EE" stroke="#177D65" stroke-width="2"/><rect x="445" y="200" width="7" height="175" rx="3" fill="#177D65"/><text x="600.0" y="232" text-anchor="middle" font-family="DejaVu Sans,Arial,sans-serif" font-size="20" font-weight="700" fill="#177D65">Regla de negocio</text><text x="600.0" y="262" text-anchor="middle" font-family="DejaVu Sans,Arial,sans-serif" font-size="17" font-weight="400" fill="#17314A">¿Qué datos deben</text><text x="600.0" y="286" text-anchor="middle" font-family="DejaVu Sans,Arial,sans-serif" font-size="17" font-weight="400" fill="#17314A">cambiar juntos?</text><rect x="825" y="200" width="310" height="175" rx="15" fill="#FEF5E9" stroke="#98621C" stroke-width="2"/><rect x="825" y="200" width="7" height="175" rx="3" fill="#98621C"/><text x="980.0" y="232" text-anchor="middle" font-family="DejaVu Sans,Arial,sans-serif" font-size="20" font-weight="700" fill="#98621C">Recuperación</text><text x="980.0" y="262" text-anchor="middle" font-family="DejaVu Sans,Arial,sans-serif" font-size="17" font-weight="400" fill="#17314A">¿Qué se conserva,</text><text x="980.0" y="286" text-anchor="middle" font-family="DejaVu Sans,Arial,sans-serif" font-size="17" font-weight="400" fill="#17314A">reintenta y observa?</text><rect x="295" y="475" width="630" height="145" rx="15" fill="#E7F6F6" stroke="#147E92" stroke-width="2"/><rect x="295" y="475" width="7" height="145" rx="3" fill="#147E92"/><text x="610.0" y="507" text-anchor="middle" font-family="DejaVu Sans,Arial,sans-serif" font-size="20" font-weight="700" fill="#147E92">Decisión trazable</text><text x="610.0" y="537" text-anchor="middle" font-family="DejaVu Sans,Arial,sans-serif" font-size="17" font-weight="400" fill="#17314A">HTTP, eventos o flujo híbrido; plazos, contratos y</text><text x="610.0" y="561" text-anchor="middle" font-family="DejaVu Sans,Arial,sans-serif" font-size="17" font-weight="400" fill="#17314A">criterio de revisión</text><line x1="45" y1="670" x2="1175" y2="670" stroke="#D3E1EB"/><text x="60" y="701" text-anchor="start" font-family="DejaVu Sans,Arial,sans-serif" font-size="17" font-weight="400" fill="#526779">No hay equivalencias automáticas: HTTP ≠ consistencia fuerte; eventos ≠ baja criticidad; frecuencia ≠</text><text x="60" y="726" text-anchor="start" font-family="DejaVu Sans,Arial,sans-serif" font-size="17" font-weight="400" fill="#526779">protocolo.</text></svg>