roke="#147E92" stroke-width="3" marker-end="url(#teal)"/><rect x="388.8" y="263.0" width="42.4" height="23" rx="5" fill="#F8FAFC"/><text x="410.0" y="280.0" text-anchor="middle" font-family="DejaVu Sans,Arial,sans-serif" font-size="13" font-weight="400" fill="#147E92">dato</text><path d="M755,290.0 H790.0 V290.0 H825" fill="none" stroke="#147E92" stroke-width="3" marker-end="url(#teal)"/><rect x="768.8" y="263.0" width="42.4" height="23" rx="5" fill="#F8FAFC"/><text x="790.0" y="280.0" text-anchor="middle" font-family="DejaVu Sans,Arial,sans-serif" font-size="13" font-weight="400" fill="#147E92">dato</text><rect x="65" y="205" width="310" height="170" rx="15" fill="#EBF3F9" stroke="#247397" stroke-width="2"/><rect x="65" y="205" width="7" height="170" rx="3" fill="#247397"/><text x="220.0" y="237" text-anchor="middle" font-family="DejaVu Sans,Arial,sans-serif" font-size="20" font-weight="700" fill="#247397">Petición A consulta</text><text x="220.0" y="267" text-anchor="middle" font-family="DejaVu Sans,Arial,sans-serif" font-size="17" font-weight="400" fill="#17314A">Stock observado: 10</text><text x="220.0" y="291" text-anchor="middle" font-family="DejaVu Sans,Arial,sans-serif" font-size="17" font-weight="400" fill="#17314A">Necesita: 8</text><rect x="445" y="205" width="310" height="170" rx="15" fill="#FEF5E9" stroke="#98621C" stroke-width="2"/><rect x="445" y="205" width="7" height="170" rx="3" fill="#98621C"/><text x="600.0" y="237" text-anchor="middle" font-family="DejaVu Sans,Arial,sans-serif" font-size="20" font-weight="700" fill="#98621C">Inventario</text><text x="600.0" y="267" text-anchor="middle" font-family="DejaVu Sans,Arial,sans-serif" font-size="17" font-weight="400" fill="#17314A">Responde 10 a ambas</text><text x="600.0" y="291" text-anchor="middle" font-family="DejaVu Sans,Arial,sans-serif" font-size="17" font-weight="400" fill="#17314A">No reserva ni descuenta</text><rect x="825" y="205" width="310" height="170" rx="15" fill="#EBF3F9" stroke="#247397" stroke-width="2"/><rect x="825" y="205" width="7" height="170" rx="3" fill="#247397"/><text x="980.0" y="237" text-anchor="middle" font-family="DejaVu Sans,Arial,sans-serif" font-size="20" font-weight="700" fill="#247397">Petición B consulta</text><text x="980.0" y="267" text-anchor="middle" font-family="DejaVu Sans,Arial,sans-serif" font-size="17" font-weight="400" fill="#17314A">Stock observado: 10</text><text x="980.0" y="291" text-anchor="middle" font-family="DejaVu Sans,Arial,sans-serif" font-size="17" font-weight="400" fill="#17314A">Necesita: 8</text><rect x="295" y="470" width="630" height="140" rx="15" fill="#FFF0F1" stroke="#A23D48" stroke-width="2"/><rect x="295" y="470" width="7" height="140" rx="3" fill="#A23D48"/><text x="610.0" y="502" text-anchor="middle" font-family="DejaVu Sans,Arial,sans-serif" font-size="20" font-weight="700" fill="#A23D48">Ambas comprobaciones son verdaderas</text><text x="610.0" y="532" text-anchor="middle" font-family="DejaVu Sans,Arial,sans-serif" font-size="17" font-weight="400" fill="#17314A">8 ≤ 10 en cada lectura; las dos intenciones suman 16</text><line x1="45" y1="670" x2="1175" y2="670" stroke="#D3E1EB"/><text x="60" y="701" text-anchor="start" font-family="DejaVu Sans,Arial,sans-serif" font-size="17" font-weight="400" fill="#526779">Para garantizar disponibilidad se necesitaría una operación autoritativa de reserva con concurrencia, fuera</text><text x="60" y="726" text-anchor="start" font-family="DejaVu Sans,Arial,sans-serif" font-size="17" font-weight="400" fill="#526779">del alcance.</text></svg>