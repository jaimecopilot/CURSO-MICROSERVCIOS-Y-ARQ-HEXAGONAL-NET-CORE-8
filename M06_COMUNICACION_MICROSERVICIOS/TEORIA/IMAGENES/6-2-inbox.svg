<svg xmlns="http://www.w3.org/2000/svg" width="1220" height="760" viewBox="0 0 1220 760" role="img" aria-label="Inbox: confirmar SQL antes de reconocer la entrega"><title>Inbox: confirmar SQL antes de reconocer la entrega</title><desc>El ack manual permite reentrega; la transacción local evita repetir el efecto.</desc><defs><marker id="blue" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10Z" fill="#247397"/></marker><marker id="green" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10Z" fill="#177D65"/></marker><marker id="gold" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10Z" fill="#98621C"/></marker><marker id="teal" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10Z" fill="#147E92"/></marker><marker id="red" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10Z" fill="#A23D48"/></marker><marker id="gray" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10Z" fill="#526779"/></marker></defs><rect width="1220" height="760" fill="white"/><rect width="1220" height="760" rx="20" fill="#F8FAFC"/><rect x="38" y="31" width="7" height="62" rx="3" fill="#147E92"/><text x="65" y="65" text-anchor="start" font-family="DejaVu Sans,Arial,sans-serif" font-size="28" font-weight="700" fill="#17314A">Inbox: confirmar SQL antes de reconocer la entrega</text><text x="65" y="102" text-anchor="start" font-family="DejaVu Sans,Arial,sans-serif" font-size="18" font-weight="400" fill="#526779">El ack manual permite reentrega; la transacción local evita repetir el efecto.</text><line x1="45" y1="128" x2="1175" y2="128" stroke="#D3E1EB"/><path d="M375,277.5 H410.0 V277.5 H445" fill="none" stroke="#147E92" stroke-width="3" marker-end="url(#teal)"/><rect x="381.2" y="250.5" width="57.599999999999994" height="23" rx="5" fill="#F8FAFC"/><text x="410.0" y="267.5" text-anchor="middle" font-family="DejaVu Sans,Arial,sans-serif" font-size="13" font-weight="400" fill="#147E92">válido</text><path d="M755,277.5 H790.0 V277.5 H825" fill="none" stroke="#147E92" stroke-width="3" marker-end="url(#teal)"/><rect x="761.2" y="250.5" width="57.599999999999994" height="23" rx="5" fill="#F8FAFC"/><text x="790.0" y="267.5" text-anchor="middle" font-family="DejaVu Sans,Arial,sans-serif" font-size="13" font-weight="400" fill="#147E92">commit</text><rect x="65" y="195" width="310" height="165" rx="15" fill="#EBF3F9" stroke="#247397" stroke-width="2"/><rect x="65" y="195" width="7" height="165" rx="3" fill="#247397"/><text x="220.0" y="227" text-anchor="middle" font-family="DejaVu Sans,Arial,sans-serif" font-size="20" font-weight="700" fill="#247397">Mensaje recibido</text><text x="220.0" y="257" text-anchor="middle" font-family="DejaVu Sans,Arial,sans-serif" font-size="17" font-weight="400" fill="#17314A">BasicGetAsync</text><text x="220.0" y="281" text-anchor="middle" font-family="DejaVu Sans,Arial,sans-serif" font-size="17" font-weight="400" fill="#17314A">Validar contrato</text><rect x="445" y="195" width="310" height="165" rx="15" fill="#E7F6EE" stroke="#177D65" stroke-width="2"/><rect x="445" y="195" width="7" height="165" rx="3" fill="#177D65"/><text x="600.0" y="227" text-anchor="middle" font-family="DejaVu Sans,Arial,sans-serif" font-size="20" font-weight="700" fill="#177D65">Commit de Inventario</text><text x="600.0" y="257" text-anchor="middle" font-family="DejaVu Sans,Arial,sans-serif" font-size="17" font-weight="400" fill="#17314A">Inbox + proyección</text><text x="600.0" y="281" text-anchor="middle" font-family="DejaVu Sans,Arial,sans-serif" font-size="17" font-weight="400" fill="#17314A">Unicidad y huella</text><rect x="825" y="195" width="310" height="165" rx="15" fill="#E7F6F6" stroke="#147E92" stroke-width="2"/><rect x="825" y="195" width="7" height="165" rx="3" fill="#147E92"/><text x="980.0" y="227" text-anchor="middle" font-family="DejaVu Sans,Arial,sans-serif" font-size="20" font-weight="700" fill="#147E92">Ack manual</text><text x="980.0" y="257" text-anchor="middle" font-family="DejaVu Sans,Arial,sans-serif" font-size="17" font-weight="400" fill="#17314A">Después del commit</text><text x="980.0" y="281" text-anchor="middle" font-family="DejaVu Sans,Arial,sans-serif" font-size="17" font-weight="400" fill="#17314A">En el canal receptor</text><rect x="65" y="475" width="500" height="145" rx="15" fill="#FEF5E9" stroke="#98621C" stroke-width="2"/><rect x="65" y="475" width="7" height="145" rx="3" fill="#98621C"/><text x="315.0" y="507" text-anchor="middle" font-family="DejaVu Sans,Arial,sans-serif" font-size="20" font-weight="700" fill="#98621C">Si llega otra vez</text><text x="315.0" y="537" text-anchor="middle" font-family="DejaVu Sans,Arial,sans-serif" font-size="17" font-weight="400" fill="#17314A">Evento ya aplicado: reconocer sin duplicar la</text><text x="315.0" y="561" text-anchor="middle" font-family="DejaVu Sans,Arial,sans-serif" font-size="17" font-weight="400" fill="#17314A">proyección</text><rect x="655" y="475" width="500" height="145" rx="15" fill="#FFF0F1" stroke="#A23D48" stroke-width="2"/><rect x="655" y="475" width="7" height="145" rx="3" fill="#A23D48"/><text x="905.0" y="507" text-anchor="middle" font-family="DejaVu Sans,Arial,sans-serif" font-size="20" font-weight="700" fill="#A23D48">Tratamiento de errores</text><text x="905.0" y="537" text-anchor="middle" font-family="DejaVu Sans,Arial,sans-serif" font-size="17" font-weight="400" fill="#17314A">Formato o versión inválidos: DLQ</text><text x="905.0" y="561" text-anchor="middle" font-family="DejaVu Sans,Arial,sans-serif" font-size="17" font-weight="400" fill="#17314A">Fallo técnico: requeue</text><line x1="45" y1="670" x2="1175" y2="670" stroke="#D3E1EB"/><text x="60" y="701" text-anchor="start" font-family="DejaVu Sans,Arial,sans-serif" font-size="17" font-weight="400" fill="#526779">Un commit correcto seguido de ack perdido es recuperable. La proyección registra planificación y no</text><text x="60" y="726" text-anchor="start" font-family="DejaVu Sans,Arial,sans-serif" font-size="17" font-weight="400" fill="#526779">modifica stock.</text></svg>