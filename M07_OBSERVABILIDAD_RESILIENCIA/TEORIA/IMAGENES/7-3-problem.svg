<svg xmlns="http://www.w3.org/2000/svg" width="1220" height="760" viewBox="0 0 1220 760" role="img" aria-label="El error público y el diagnóstico tienen límites"><title>El error público y el diagnóstico tienen límites</title><desc>ProblemDetails sigue RFC 9457 y debe concordar con el estado HTTP del transporte.</desc><defs><marker id="blue" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10Z" fill="#247397"/></marker><marker id="green" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10Z" fill="#177D65"/></marker><marker id="gold" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10Z" fill="#98621C"/></marker><marker id="teal" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10Z" fill="#147E92"/></marker><marker id="red" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10Z" fill="#A23D48"/></marker><marker id="gray" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10Z" fill="#526779"/></marker></defs><rect width="1220" height="760" fill="white"/><rect width="1220" height="760" rx="20" fill="#F8FAFC"/><rect x="38" y="31" width="7" height="62" rx="3" fill="#147E92"/><text x="65" y="65" text-anchor="start" font-family="DejaVu Sans,Arial,sans-serif" font-size="28" font-weight="700" fill="#17314A">El error público y el diagnóstico tienen límites</text><text x="65" y="102" text-anchor="start" font-family="DejaVu Sans,Arial,sans-serif" font-size="18" font-weight="400" fill="#526779">ProblemDetails sigue RFC 9457 y debe concordar con el estado HTTP del transporte.</text><line x1="45" y1="128" x2="1175" y2="128" stroke="#D3E1EB"/><path d="M375,300.0 H410.0 V300.0 H445" fill="none" stroke="#147E92" stroke-width="3" marker-end="url(#teal)"/><rect x="377.4" y="273.0" width="65.19999999999999" height="23" rx="5" fill="#F8FAFC"/><text x="410.0" y="290.0" text-anchor="middle" font-family="DejaVu Sans,Arial,sans-serif" font-size="13" font-weight="400" fill="#147E92">incluye</text><path d="M755,300.0 H790.0 V300.0 H825" fill="none" stroke="#147E92" stroke-width="3" marker-end="url(#teal)"/><rect x="749.8" y="273.0" width="80.39999999999999" height="23" rx="5" fill="#F8FAFC"/><text x="790.0" y="290.0" text-anchor="middle" font-family="DejaVu Sans,Arial,sans-serif" font-size="13" font-weight="400" fill="#147E92">relaciona</text><rect x="65" y="205" width="310" height="190" rx="15" fill="#EBF3F9" stroke="#247397" stroke-width="2"/><rect x="65" y="205" width="7" height="190" rx="3" fill="#247397"/><text x="220.0" y="237" text-anchor="middle" font-family="DejaVu Sans,Arial,sans-serif" font-size="20" font-weight="700" fill="#247397">Respuesta HTTP</text><text x="220.0" y="267" text-anchor="middle" font-family="DejaVu Sans,Arial,sans-serif" font-size="17" font-weight="400" fill="#17314A">500</text><text x="220.0" y="291" text-anchor="middle" font-family="DejaVu Sans,Arial,sans-serif" font-size="17" font-weight="400" fill="#17314A">application/problem+json</text><rect x="445" y="205" width="310" height="190" rx="15" fill="#E7F6EE" stroke="#177D65" stroke-width="2"/><rect x="445" y="205" width="7" height="190" rx="3" fill="#177D65"/><text x="600.0" y="237" text-anchor="middle" font-family="DejaVu Sans,Arial,sans-serif" font-size="20" font-weight="700" fill="#177D65">Campos públicos</text><text x="600.0" y="267" text-anchor="middle" font-family="DejaVu Sans,Arial,sans-serif" font-size="17" font-weight="400" fill="#17314A">type y title</text><text x="600.0" y="291" text-anchor="middle" font-family="DejaVu Sans,Arial,sans-serif" font-size="17" font-weight="400" fill="#17314A">status = 500</text><text x="600.0" y="315" text-anchor="middle" font-family="DejaVu Sans,Arial,sans-serif" font-size="17" font-weight="400" fill="#17314A">correlationId / traceId</text><rect x="825" y="205" width="310" height="190" rx="15" fill="#E7F6F6" stroke="#147E92" stroke-width="2"/><rect x="825" y="205" width="7" height="190" rx="3" fill="#147E92"/><text x="980.0" y="237" text-anchor="middle" font-family="DejaVu Sans,Arial,sans-serif" font-size="20" font-weight="700" fill="#147E92">Diagnóstico interno</text><text x="980.0" y="267" text-anchor="middle" font-family="DejaVu Sans,Arial,sans-serif" font-size="17" font-weight="400" fill="#17314A">Buscar por correlación</text><text x="980.0" y="291" text-anchor="middle" font-family="DejaVu Sans,Arial,sans-serif" font-size="17" font-weight="400" fill="#17314A">Tipo de fallo permitido</text><rect x="295" y="485" width="630" height="135" rx="15" fill="#FFF0F1" stroke="#A23D48" stroke-width="2"/><rect x="295" y="485" width="7" height="135" rx="3" fill="#A23D48"/><text x="610.0" y="517" text-anchor="middle" font-family="DejaVu Sans,Arial,sans-serif" font-size="20" font-weight="700" fill="#A23D48">Información excluida</text><text x="610.0" y="547" text-anchor="middle" font-family="DejaVu Sans,Arial,sans-serif" font-size="17" font-weight="400" fill="#17314A">Mensaje arbitrario, stack trace, credenciales, SQL y rutas</text><text x="610.0" y="571" text-anchor="middle" font-family="DejaVu Sans,Arial,sans-serif" font-size="17" font-weight="400" fill="#17314A">internas</text><line x1="45" y1="670" x2="1175" y2="670" stroke="#D3E1EB"/><text x="60" y="701" text-anchor="start" font-family="DejaVu Sans,Arial,sans-serif" font-size="17" font-weight="400" fill="#526779">detail e instance son opcionales. Un título público genérico no impide localizar el incidente por su</text><text x="60" y="726" text-anchor="start" font-family="DejaVu Sans,Arial,sans-serif" font-size="17" font-weight="400" fill="#526779">identidad.</text></svg>