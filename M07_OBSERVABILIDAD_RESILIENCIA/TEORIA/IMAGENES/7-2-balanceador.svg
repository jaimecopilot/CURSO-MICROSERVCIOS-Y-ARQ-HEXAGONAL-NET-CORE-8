es</text><rect x="445" y="180" width="310" height="165" rx="15" fill="#E7F6EE" stroke="#177D65" stroke-width="2"/><rect x="445" y="180" width="7" height="165" rx="3" fill="#177D65"/><text x="600.0" y="212" text-anchor="middle" font-family="DejaVu Sans,Arial,sans-serif" font-size="20" font-weight="700" fill="#177D65">Instancia A: 200</text><text x="600.0" y="242" text-anchor="middle" font-family="DejaVu Sans,Arial,sans-serif" font-size="17" font-weight="400" fill="#17314A">Lista para el tráfico</text><text x="600.0" y="266" text-anchor="middle" font-family="DejaVu Sans,Arial,sans-serif" font-size="17" font-weight="400" fill="#17314A">según sus comprobaciones</text><rect x="445" y="455" width="310" height="165" rx="15" fill="#FFF0F1" stroke="#A23D48" stroke-width="2"/><rect x="445" y="455" width="7" height="165" rx="3" fill="#A23D48"/><text x="600.0" y="487" text-anchor="middle" font-family="DejaVu Sans,Arial,sans-serif" font-size="20" font-weight="700" fill="#A23D48">Instancia B: 503</text><text x="600.0" y="517" text-anchor="middle" font-family="DejaVu Sans,Arial,sans-serif" font-size="17" font-weight="400" fill="#17314A">Viva, pero no lista</text><text x="600.0" y="541" text-anchor="middle" font-family="DejaVu Sans,Arial,sans-serif" font-size="17" font-weight="400" fill="#17314A">Dependencia inaccesible</text><rect x="825" y="180" width="310" height="165" rx="15" fill="#E7F6EE" stroke="#177D65" stroke-width="2"/><rect x="825" y="180" width="7" height="165" rx="3" fill="#177D65"/><text x="980.0" y="212" text-anchor="middle" font-family="DejaVu Sans,Arial,sans-serif" font-size="20" font-weight="700" fill="#177D65">Recibe tráfico</text><text x="980.0" y="242" text-anchor="middle" font-family="DejaVu Sans,Arial,sans-serif" font-size="17" font-weight="400" fill="#17314A">Tras cumplir el criterio</text><text x="980.0" y="266" text-anchor="middle" font-family="DejaVu Sans,Arial,sans-serif" font-size="17" font-weight="400" fill="#17314A">de disponibilidad</text><rect x="825" y="455" width="310" height="165" rx="15" fill="#FEF5E9" stroke="#98621C" stroke-width="2"/><rect x="825" y="455" width="7" height="165" rx="3" fill="#98621C"/><text x="980.0" y="487" text-anchor="middle" font-family="DejaVu Sans,Arial,sans-serif" font-size="20" font-weight="700" fill="#98621C">Se retira del grupo</text><text x="980.0" y="517" text-anchor="middle" font-family="DejaVu Sans,Arial,sans-serif" font-size="17" font-weight="400" fill="#17314A">Peticiones en curso</text><text x="980.0" y="541" text-anchor="middle" font-family="DejaVu Sans,Arial,sans-serif" font-size="17" font-weight="400" fill="#17314A">todavía pueden fallar</text><line x1="45" y1="670" x2="1175" y2="670" stroke="#D3E1EB"/><text x="60" y="701" text-anchor="start" font-family="DejaVu Sans,Arial,sans-serif" font-size="17" font-weight="400" fill="#526779">Una dependencia compartida puede afectar a todas las instancias. Las sondas no crean capacidad ni recuperan</text><text x="60" y="726" text-anchor="start" font-family="DejaVu Sans,Arial,sans-serif" font-size="17" font-weight="400" fill="#526779">SQL.</text></svg>