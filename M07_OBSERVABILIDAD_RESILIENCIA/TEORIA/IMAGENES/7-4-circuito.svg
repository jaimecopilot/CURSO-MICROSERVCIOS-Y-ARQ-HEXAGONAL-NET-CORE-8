<svg xmlns="http://www.w3.org/2000/svg" width="1220" height="760" viewBox="0 0 1220 760" role="img" aria-label="El circuito conserva estado entre peticiones"><title>El circuito conserva estado entre peticiones</title><desc>Ventana: 10 s · Mínimo: 4 muestras · Ratio de fallo: 0,5 · Apertura: 5 s</desc><defs><marker id="blue" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10Z" fill="#247397"/></marker><marker id="green" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10Z" fill="#177D65"/></marker><marker id="gold" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10Z" fill="#98621C"/></marker><marker id="teal" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10Z" fill="#147E92"/></marker><marker id="red" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10Z" fill="#A23D48"/></marker><marker id="gray" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10Z" fill="#526779"/></marker></defs><rect width="1220" height="760" fill="white"/><rect width="1220" height="760" rx="20" fill="#F8FAFC"/><rect x="38" y="31" width="7" height="62" rx="3" fill="#147E92"/><text x="65" y="65" text-anchor="start" font-family="DejaVu Sans,Arial,sans-serif" font-size="28" font-weight="700" fill="#17314A">El circuito conserva estado entre peticiones</text><text x="65" y="102" text-anchor="start" font-family="DejaVu Sans,Arial,sans-serif" font-size="18" font-weight="400" fill="#526779">Ventana: 10 s · Mínimo: 4 muestras · Ratio de fallo: 0,5 · Apertura: 5 s</text><line x1="45" y1="128" x2="1175" y2="128" stroke="#D3E1EB"/><rect x="65" y="230" width="310" height="170" rx="15" fill="#E7F6EE" stroke="#177D65" stroke-width="2"/><rect x="65" y="230" width="7" height="170" rx="3" fill="#177D65"/><text x="220.0" y="262" text-anchor="middle" font-family="DejaVu Sans,Arial,sans-serif" font-size="20" font-weight="700" fill="#177D65">Cerrado</text><text x="220.0" y="292" text-anchor="middle" font-family="DejaVu Sans,Arial,sans-serif" font-size="17" font-weight="400" fill="#17314A">Permite intentos</text><text x="220.0" y="316" text-anchor="middle" font-family="DejaVu Sans,Arial,sans-serif" font-size="17" font-weight="400" fill="#17314A">Cuenta resultados</text><rect x="445" y="230" width="310" height="170" rx="15" fill="#FFF0F1" stroke="#A23D48" stroke-width="2"/><rect x="445" y="230" width="7" height="170" rx="3" fill="#A23D48"/><text x="600.0" y="262" text-anchor="middle" font-family="DejaVu Sans,Arial,sans-serif" font-size="20" font-weight="700" fill="#A23D48">Abierto</text><text x="600.0" y="292" text-anchor="middle" font-family="DejaVu Sans,Arial,sans-serif" font-size="17" font-weight="400" fill="#17314A">Rechaza sin envío</text><text x="600.0" y="316" text-anchor="middle" font-family="DejaVu Sans,Arial,sans-serif" font-size="17" font-weight="400" fill="#17314A">Falla rápido</text><rect x="825" y="230" width="310" height="170" rx="15" fill="#FEF5E9" stroke="#98621C" stroke-width="2"/><rect x="825" y="230" width="7" height="170" rx="3" fill="#98621C"/><text x="980.0" y="262" text-anchor="middle" font-family="DejaVu Sans,Arial,sans-serif" font-size="20" font-weight="700" fill="#98621C">Semiabierto</text><text x="980.0" y="292" text-anchor="middle" font-family="DejaVu Sans,Arial,sans-serif" font-size="17" font-weight="400" fill="#17314A">Una llamada prueba si el</text><text x="980.0" y="316" text-anchor="middle" font-family="DejaVu Sans,Arial,sans-serif" font-size="17" font-weight="400" fill="#17314A">destino se recuperó</text><path d="M375,275 H445" fill="none" stroke="#A23D48" stroke-width="3" marker-end="url(#red)"/><text x="410" y="255" text-anchor="middle" font-family="DejaVu Sans,Arial,sans-serif" font-size="17" font-weight="700" fill="#A23D48">umbral</text><path d="M755,275 H825" fill="none" stroke="#98621C" stroke-width="3" marker-end="url(#gold)"/><text x="790" y="215" text-anchor="middle" font-family="DejaVu Sans,Arial,sans-serif" font-size="17" font-weight="700" fill="#98621C">5 s + llamada</text><path d="M980,400 V470 H600 V400" fill="none" stroke="#A23D48" stroke-width="3" marker-end="url(#red)"/><text x="790" y="500" text-anchor="middle" font-family="DejaVu Sans,Arial,sans-serif" font-size="17" font-weight="700" fill="#A23D48">Prueba falla: vuelve a abrir</text><path d="M1060,400 V575 H220 V400" fill="none" stroke="#177D65" stroke-width="3" marker-end="url(#green)"/><text x="630" y="605" text-anchor="middle" font-family="DejaVu Sans,Arial,sans-serif" font-size="17" font-weight="700" fill="#177D65">Prueba correcta: vuelve a cerrar</text><text x="610" y="160" text-anchor="middle" font-family="DejaVu Sans,Arial,sans-serif" font-size="20" font-weight="700" fill="#17314A">Ejemplo de apertura: 200, 503, 200, 503 dentro de la ventana</text><line x1="45" y1="670" x2="1175" y2="670" stroke="#D3E1EB"/><text x="60" y="703" text-anchor="start" font-family="DejaVu Sans,Arial,sans-serif" font-size="17" font-weight="400" fill="#526779">Esperar cinco segundos no envía una sonda por sí solo; hace falta una nueva llamada.</text></svg>