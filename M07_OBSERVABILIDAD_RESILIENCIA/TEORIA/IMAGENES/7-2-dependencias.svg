ly="DejaVu Sans,Arial,sans-serif" font-size="17" font-weight="400" fill="#526779">Acceso a dependencias no equivale a vaciar outbox o inbox. La respuesta aplica una lista de campos</text><text x="60" y="726" text-anchor="start" font-family="DejaVu Sans,Arial,sans-serif" font-size="17" font-weight="400" fill="#526779">permitidos.</text></svg>