<svg xmlns="http://www.w3.org/2000/svg" width="1220" height="760" viewBox="0 0 1220 760" role="img" aria-label="Validar antes de propagar la correlación"><title>Validar antes de propagar la correlación</title><desc>Cada petición conserva un alcance independiente, incluso cuando hay concurrencia.</desc><defs><marker id="blue" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10Z" fill="#247397"/></marker><marker id="green" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10Z" fill="#177D65"/></marker><marker id="gold" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10Z" fill="#98621C"/></marker><marker id="teal" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10Z" fill="#147E92"/></marker><marker id="red" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10Z" fill="#A23D48"/></marker><marker id="gray" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10Z" fill="#526779"/></marker></defs><rect width="1220" height="760" fill="white"/><rect width="1220" height="760" rx="20" fill="#F8FAFC"/><rect x="38" y="31" width="7" height="62" rx="3" fill="#147E92"/><text x="65" y="65" text-anchor="start" font-family="DejaVu Sans,Arial,sans-serif" font-size="28" font-weight="700" fill="#17314A">Validar antes de propagar la correlación</text><text x="65" y="102" text-anchor="start" font-family="DejaVu Sans,Arial,sans-serif" font-size="18" font-weight="400" fill="#526779">Cada petición conserva un alcance independiente, incluso cuando hay concurrencia.</text><line x1="45" y1="128" x2="1175" y2="128" stroke="#D3E1EB"/><path d="M375,275.0 H410.0 V275.0 H445" fill="none" stroke="#147E92" stroke-width="3" marker-end="url(#teal)"/><rect x="392.6" y="248.0" width="34.8" height="23" rx="5" fill="#F8FAFC"/><text x="410.0" y="265.0" text-anchor="middle" font-family="DejaVu Sans,Arial,sans-serif" font-size="13" font-weight="400" fill="#147E92">lee</text><path d="M755,275.0 H790.0 V275.0 H825" fill="none" stroke="#147E92" stroke-width="3" marker-end="url(#teal)"/><rect x="761.2" y="248.0" width="57.599999999999994" height="23" rx="5" fill="#F8FAFC"/><text x="790.0" y="265.0" text-anchor="middle" font-family="DejaVu Sans,Arial,sans-serif" font-size="13" font-weight="400" fill="#147E92">decide</text><path d="M980.0,360 V412.5 H980.0 V465" fill="none" stroke="#147E92" stroke-width="3" marker-end="url(#teal)"/><rect x="947.4" y="386.5" width="65.19999999999999" height="23" rx="5" fill="#F8FAFC"/><text x="980.0" y="403.5" text-anchor="middle" font-family="DejaVu Sans,Arial,sans-serif" font-size="13" font-weight="400" fill="#147E92">propaga</text><path d="M825,545.0 H790.0 V545.0 H755" fill="none" stroke="#147E92" stroke-width="3" marker-end="url(#teal)"/><rect x="768.8" y="518.0" width="42.4" height="23" rx="5" fill="#F8FAFC"/><text x="790.0" y="535.0" text-anchor="middle" font-family="DejaVu Sans,Arial,sans-serif" font-size="13" font-weight="400" fill="#147E92">HTTP</text><rect x="65" y="190" width="310" height="170" rx="15" fill="#EBF3F9" stroke="#247397" stroke-width="2"/><rect x="65" y="190" width="7" height="170" rx="3" fill="#247397"/><text x="220.0" y="222" text-anchor="middle" font-family="DejaVu Sans,Arial,sans-serif" font-size="20" font-weight="700" fill="#247397">Cabecera de entrada</text><text x="220.0" y="252" text-anchor="middle" font-family="DejaVu Sans,Arial,sans-serif" font-size="17" font-weight="400" fill="#17314A">Un único valor</text><text x="220.0" y="276" text-anchor="middle" font-family="DejaVu Sans,Arial,sans-serif" font-size="17" font-weight="400" fill="#17314A">X-Correlation-ID</text><rect x="445" y="190" width="310" height="170" rx="15" fill="#FEF5E9" stroke="#98621C" stroke-width="2"/><rect x="445" y="190" width="7" height="170" rx="3" fill="#98621C"/><text x="600.0" y="222" text-anchor="middle" font-family="DejaVu Sans,Arial,sans-serif" font-size="20" font-weight="700" fill="#98621C">Validación</text><text x="600.0" y="252" text-anchor="middle" font-family="DejaVu Sans,Arial,sans-serif" font-size="17" font-weight="400" fill="#17314A">1–64 caracteres ASCII</text><text x="600.0" y="276" text-anchor="middle" font-family="DejaVu Sans,Arial,sans-serif" font-size="17" font-weight="400" fill="#17314A">Letras, dígitos, - y _</text><rect x="825" y="190" width="310" height="170" rx="15" fill="#E7F6EE" stroke="#177D65" stroke-width="2"/><rect x="825" y="190" width="7" height="170" rx="3" fill="#177D65"/><text x="980.0" y="222" text-anchor="middle" font-family="DejaVu Sans,Arial,sans-serif" font-size="20" font-weight="700" fill="#177D65">Contexto de petición</text><text x="980.0" y="252" text-anchor="middle" font-family="DejaVu Sans,Arial,sans-serif" font-size="17" font-weight="400" fill="#17314A">Válido: conservar</text><text x="980.0" y="276" text-anchor="middle" font-family="DejaVu Sans,Arial,sans-serif" font-size="17" font-weight="400" fill="#17314A">Inválido: generar nuevo</text><rect x="65" y="465" width="310" height="160" rx="15" fill="#E7F6F6" stroke="#147E92" stroke-width="2"/><rect x="65" y="465" width="7" height="160" rx="3" fill="#147E92"/><text x="220.0" y="497" text-anchor="middle" font-family="DejaVu Sans,Arial,sans-serif" font-size="20" font-weight="700" fill="#147E92">Respuesta y logs</text><text x="220.0" y="527" text-anchor="middle" font-family="DejaVu Sans,Arial,sans-serif" font-size="17" font-weight="400" fill="#17314A">Usan el identificador</text><text x="220.0" y="551" text-anchor="middle" font-family="DejaVu Sans,Arial,sans-serif" font-size="17" font-weight="400" fill="#17314A">efectivo de ese contexto</text><rect x="825" y="465" width="310" height="160" rx="15" fill="#EBF3F9" stroke="#247397" stroke-width="2"/><rect x="825" y="465" width="7" height="160" rx="3" fill="#247397"/><text x="980.0" y="497" text-anchor="middle" font-family="DejaVu Sans,Arial,sans-serif" font-size="20" font-weight="700" fill="#247397">Handler HTTP</text><text x="980.0" y="527" text-anchor="middle" font-family="DejaVu Sans,Arial,sans-serif" font-size="17" font-weight="400" fill="#17314A">Añade el valor validado a</text><text x="980.0" y="551" text-anchor="middle" font-family="DejaVu Sans,Arial,sans-serif" font-size="17" font-weight="400" fill="#17314A">la llamada de Inventario</text><rect x="445" y="465" width="310" height="160" rx="15" fill="#E7F6F6" stroke="#147E92" stroke-width="2"/><rect x="445" y="465" width="7" height="160" rx="3" fill="#147E92"/><text x="600.0" y="497" text-anchor="middle" font-family="DejaVu Sans,Arial,sans-serif" font-size="20" font-weight="700" fill="#147E92">Inventario</text><text x="600.0" y="527" text-anchor="middle" font-family="DejaVu Sans,Arial,sans-serif" font-size="17" font-weight="400" fill="#17314A">Recibe el identificador y</text><text x="600.0" y="551" text-anchor="middle" font-family="DejaVu Sans,Arial,sans-serif" font-size="17" font-weight="400" fill="#17314A">crea su propio alcance</text><line x1="45" y1="670" x2="1175" y2="670" stroke="#D3E1EB"/><text x="60" y="701" text-anchor="start" font-family="DejaVu Sans,Arial,sans-serif" font-size="17" font-weight="400" fill="#526779">El handler usa el contexto validado: no usa una cabecera arbitraria ni un campo estático compartido.</text></svg>