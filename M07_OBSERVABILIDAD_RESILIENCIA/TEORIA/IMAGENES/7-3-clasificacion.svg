<svg xmlns="http://www.w3.org/2000/svg" width="1220" height="760" viewBox="0 0 1220 760" role="img" aria-label="Clasificar antes de traducir a HTTP"><title>Clasificar antes de traducir a HTTP</title><desc>El estado público refleja el significado del resultado y conserva los contratos existentes.</desc><defs><marker id="blue" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10Z" fill="#247397"/></marker><marker id="green" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10Z" fill="#177D65"/></marker><marker id="gold" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10Z" fill="#98621C"/></marker><marker id="teal" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10Z" fill="#147E92"/></marker><marker id="red" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10Z" fill="#A23D48"/></marker><marker id="gray" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10Z" fill="#526779"/></marker></defs><rect width="1220" height="760" fill="white"/><rect width="1220" height="760" rx="20" fill="#F8FAFC"/><rect x="38" y="31" width="7" height="62" rx="3" fill="#147E92"/><text x="65" y="65" text-anchor="start" font-family="DejaVu Sans,Arial,sans-serif" font-size="28" font-weight="700" fill="#17314A">Clasificar antes de traducir a HTTP</text><text x="65" y="102" text-anchor="start" font-family="DejaVu Sans,Arial,sans-serif" font-size="18" font-weight="400" fill="#526779">El estado público refleja el significado del resultado y conserva los contratos existentes.</text><line x1="45" y1="128" x2="1175" y2="128" stroke="#D3E1EB"/><path d="M220.0,385 V425.0 H220.0 V465" fill="none" stroke="#147E92" stroke-width="3" marker-end="url(#teal)"/><rect x="187.4" y="399.0" width="65.19999999999999" height="23" rx="5" fill="#F8FAFC"/><text x="220.0" y="416.0" text-anchor="middle" font-family="DejaVu Sans,Arial,sans-serif" font-size="13" font-weight="400" fill="#147E92">traduce</text><path d="M600.0,385 V425.0 H600.0 V465" fill="none" stroke="#147E92" stroke-width="3" marker-end="url(#teal)"/><rect x="567.4" y="399.0" width="65.19999999999999" height="23" rx="5" fill="#F8FAFC"/><text x="600.0" y="416.0" text-anchor="middle" font-family="DejaVu Sans,Arial,sans-serif" font-size="13" font-weight="400" fill="#147E92">traduce</text><path d="M980.0,385 V425.0 H980.0 V465" fill="none" stroke="#147E92" stroke-width="3" marker-end="url(#teal)"/><rect x="943.6" y="399.0" width="72.8" height="23" rx="5" fill="#F8FAFC"/><text x="980.0" y="416.0" text-anchor="middle" font-family="DejaVu Sans,Arial,sans-serif" font-size="13" font-weight="400" fill="#147E92">gestiona</text><rect x="65" y="200" width="310" height="185" rx="15" fill="#E7F6EE" stroke="#177D65" stroke-width="2"/><rect x="65" y="200" width="7" height="185" rx="3" fill="#177D65"/><text x="220.0" y="232" text-anchor="middle" font-family="DejaVu Sans,Arial,sans-serif" font-size="20" font-weight="700" fill="#177D65">Resultado esperado</text><text x="220.0" y="262" text-anchor="middle" font-family="DejaVu Sans,Arial,sans-serif" font-size="17" font-weight="400" fill="#17314A">Validación, ausencia</text><text x="220.0" y="286" text-anchor="middle" font-family="DejaVu Sans,Arial,sans-serif" font-size="17" font-weight="400" fill="#17314A">Conflicto o regla de</text><text x="220.0" y="310" text-anchor="middle" font-family="DejaVu Sans,Arial,sans-serif" font-size="17" font-weight="400" fill="#17314A">negocio</text><rect x="445" y="200" width="310" height="185" rx="15" fill="#FEF5E9" stroke="#98621C" stroke-width="2"/><rect x="445" y="200" width="7" height="185" rx="3" fill="#98621C"/><text x="600.0" y="232" text-anchor="middle" font-family="DejaVu Sans,Arial,sans-serif" font-size="20" font-weight="700" fill="#98621C">Indisponibilidad remota</text><text x="600.0" y="262" text-anchor="middle" font-family="DejaVu Sans,Arial,sans-serif" font-size="17" font-weight="400" fill="#17314A">Sin dato fiable de</text><text x="600.0" y="286" text-anchor="middle" font-family="DejaVu Sans,Arial,sans-serif" font-size="17" font-weight="400" fill="#17314A">Inventario</text><text x="600.0" y="310" text-anchor="middle" font-family="DejaVu Sans,Arial,sans-serif" font-size="17" font-weight="400" fill="#17314A">Contrato técnico conocido</text><rect x="825" y="200" width="310" height="185" rx="15" fill="#FFF0F1" stroke="#A23D48" stroke-width="2"/><rect x="825" y="200" width="7" height="185" rx="3" fill="#A23D48"/><text x="980.0" y="232" text-anchor="middle" font-family="DejaVu Sans,Arial,sans-serif" font-size="20" font-weight="700" fill="#A23D48">Fallo inesperado</text><text x="980.0" y="262" text-anchor="middle" font-family="DejaVu Sans,Arial,sans-serif" font-size="17" font-weight="400" fill="#17314A">Excepción del flujo HTTP</text><text x="980.0" y="286" text-anchor="middle" font-family="DejaVu Sans,Arial,sans-serif" font-size="17" font-weight="400" fill="#17314A">Sin respuesta iniciada</text><rect x="65" y="465" width="310" height="155" rx="15" fill="#E7F6EE" stroke="#177D65" stroke-width="2"/><rect x="65" y="465" width="7" height="155" rx="3" fill="#177D65"/><text x="220.0" y="497" text-anchor="middle" font-family="DejaVu Sans,Arial,sans-serif" font-size="20" font-weight="700" fill="#177D65">Result → HTTP</text><text x="220.0" y="527" text-anchor="middle" font-family="DejaVu Sans,Arial,sans-serif" font-size="17" font-weight="400" fill="#17314A">400 / 404 / 409 / 422</text><text x="220.0" y="551" text-anchor="middle" font-family="DejaVu Sans,Arial,sans-serif" font-size="17" font-weight="400" fill="#17314A">Según contrato de la API</text><rect x="445" y="465" width="310" height="155" rx="15" fill="#FEF5E9" stroke="#98621C" stroke-width="2"/><rect x="445" y="465" width="7" height="155" rx="3" fill="#98621C"/><text x="600.0" y="497" text-anchor="middle" font-family="DejaVu Sans,Arial,sans-serif" font-size="20" font-weight="700" fill="#98621C">HTTP 503</text><text x="600.0" y="527" text-anchor="middle" font-family="DejaVu Sans,Arial,sans-serif" font-size="17" font-weight="400" fill="#17314A">No significa ausencia</text><text x="600.0" y="551" text-anchor="middle" font-family="DejaVu Sans,Arial,sans-serif" font-size="17" font-weight="400" fill="#17314A">Ni stock igual a cero</text><rect x="825" y="465" width="310" height="155" rx="15" fill="#FFF0F1" stroke="#A23D48" stroke-width="2"/><rect x="825" y="465" width="7" height="155" rx="3" fill="#A23D48"/><text x="980.0" y="497" text-anchor="middle" font-family="DejaVu Sans,Arial,sans-serif" font-size="20" font-weight="700" fill="#A23D48">HTTP 500</text><text x="980.0" y="527" text-anchor="middle" font-family="DejaVu Sans,Arial,sans-serif" font-size="17" font-weight="400" fill="#17314A">ProblemDetails genérico</text><text x="980.0" y="551" text-anchor="middle" font-family="DejaVu Sans,Arial,sans-serif" font-size="17" font-weight="400" fill="#17314A">Con correlación</text><line x1="45" y1="670" x2="1175" y2="670" stroke="#D3E1EB"/><text x="60" y="701" text-anchor="start" font-family="DejaVu Sans,Arial,sans-serif" font-size="17" font-weight="400" fill="#526779">Cancelación del usuario y respuesta ya iniciada tienen tratamiento específico: no se fabrica otro 500.</text></svg>