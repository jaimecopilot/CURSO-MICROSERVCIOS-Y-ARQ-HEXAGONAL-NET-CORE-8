<svg xmlns="http://www.w3.org/2000/svg" width="1220" height="760" viewBox="0 0 1220 760" role="img" aria-label="Un evento conserva plantilla, valores y contexto"><title>Un evento conserva plantilla, valores y contexto</title><desc>Las propiedades se pueden consultar sin reconstruirlas desde una frase.</desc><defs><marker id="blue" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10Z" fill="#247397"/></marker><marker id="green" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10Z" fill="#177D65"/></marker><marker id="gold" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10Z" fill="#98621C"/></marker><marker id="teal" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10Z" fill="#147E92"/></marker><marker id="red" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10Z" fill="#A23D48"/></marker><marker id="gray" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10Z" fill="#526779"/></marker></defs><rect width="1220" height="760" fill="white"/><rect width="1220" height="760" rx="20" fill="#F8FAFC"/><rect x="38" y="31" width="7" height="62" rx="3" fill="#147E92"/><text x="65" y="65" text-anchor="start" font-family="DejaVu Sans,Arial,sans-serif" font-size="28" font-weight="700" fill="#17314A">Un evento conserva plantilla, valores y contexto</text><text x="65" y="102" text-anchor="start" font-family="DejaVu Sans,Arial,sans-serif" font-size="18" font-weight="400" fill="#526779">Las propiedades se pueden consultar sin reconstruirlas desde una frase.</text><line x1="45" y1="128" x2="1175" y2="128" stroke="#D3E1EB"/><path d="M375,282.5 H410.0 V282.5 H445" fill="none" stroke="#147E92" stroke-width="3" marker-end="url(#teal)"/><rect x="381.2" y="255.5" width="57.599999999999994" height="23" rx="5" fill="#F8FAFC"/><text x="410.0" y="272.5" text-anchor="middle" font-family="DejaVu Sans,Arial,sans-serif" font-size="13" font-weight="400" fill="#147E92">asocia</text><path d="M755,282.5 H790.0 V282.5 H825" fill="none" stroke="#147E92" stroke-width="3" marker-end="url(#teal)"/><rect x="749.8" y="255.5" width="80.39999999999999" height="23" rx="5" fill="#F8FAFC"/><text x="790.0" y="272.5" text-anchor="middle" font-family="DejaVu Sans,Arial,sans-serif" font-size="13" font-weight="400" fill="#147E92">serializa</text><path d="M980.0,370 V417.5 H610.0 V465" fill="none" stroke="#147E92" stroke-width="3" marker-end="url(#teal)"/><rect x="758.6" y="391.5" width="72.8" height="23" rx="5" fill="#F8FAFC"/><text x="795.0" y="408.5" text-anchor="middle" font-family="DejaVu Sans,Arial,sans-serif" font-size="13" font-weight="400" fill="#147E92">consulta</text><rect x="65" y="195" width="310" height="175" rx="15" fill="#EBF3F9" stroke="#247397" stroke-width="2"/><rect x="65" y="195" width="7" height="175" rx="3" fill="#247397"/><text x="220.0" y="227" text-anchor="middle" font-family="DejaVu Sans,Arial,sans-serif" font-size="20" font-weight="700" fill="#247397">Plantilla estable</text><text x="220.0" y="257" text-anchor="middle" font-family="DejaVu Sans,Arial,sans-serif" font-size="17" font-weight="400" fill="#17314A">Orden {OrdenId} creada con</text><text x="220.0" y="281" text-anchor="middle" font-family="DejaVu Sans,Arial,sans-serif" font-size="17" font-weight="400" fill="#17314A">{CantidadLineas} líneas</text><rect x="445" y="195" width="310" height="175" rx="15" fill="#E7F6F6" stroke="#147E92" stroke-width="2"/><rect x="445" y="195" width="7" height="175" rx="3" fill="#147E92"/><text x="600.0" y="227" text-anchor="middle" font-family="DejaVu Sans,Arial,sans-serif" font-size="20" font-weight="700" fill="#147E92">Valores tipados</text><text x="600.0" y="257" text-anchor="middle" font-family="DejaVu Sans,Arial,sans-serif" font-size="17" font-weight="400" fill="#17314A">OrdenId: identidad técnica</text><text x="600.0" y="281" text-anchor="middle" font-family="DejaVu Sans,Arial,sans-serif" font-size="17" font-weight="400" fill="#17314A">CantidadLineas: número</text><rect x="825" y="195" width="310" height="175" rx="15" fill="#E7F6EE" stroke="#177D65" stroke-width="2"/><rect x="825" y="195" width="7" height="175" rx="3" fill="#177D65"/><text x="980.0" y="227" text-anchor="middle" font-family="DejaVu Sans,Arial,sans-serif" font-size="20" font-weight="700" fill="#177D65">Evento JSON</text><text x="980.0" y="257" text-anchor="middle" font-family="DejaVu Sans,Arial,sans-serif" font-size="17" font-weight="400" fill="#17314A">Nivel + plantilla</text><text x="980.0" y="281" text-anchor="middle" font-family="DejaVu Sans,Arial,sans-serif" font-size="17" font-weight="400" fill="#17314A">Propiedades + contexto</text><rect x="295" y="465" width="630" height="145" rx="15" fill="#FEF5E9" stroke="#98621C" stroke-width="2"/><rect x="295" y="465" width="7" height="145" rx="3" fill="#98621C"/><text x="610.0" y="497" text-anchor="middle" font-family="DejaVu Sans,Arial,sans-serif" font-size="20" font-weight="700" fill="#98621C">Pregunta operativa</text><text x="610.0" y="527" text-anchor="middle" font-family="DejaVu Sans,Arial,sans-serif" font-size="17" font-weight="400" fill="#17314A">Buscar una orden, filtrar un nivel o comparar una duración</text><line x1="45" y1="670" x2="1175" y2="670" stroke="#D3E1EB"/><text x="60" y="701" text-anchor="start" font-family="DejaVu Sans,Arial,sans-serif" font-size="17" font-weight="400" fill="#526779">La interpolación previa pierde campos estructurados. El JSON no justifica copiar objetos completos o datos</text><text x="60" y="726" text-anchor="start" font-family="DejaVu Sans,Arial,sans-serif" font-size="17" font-weight="400" fill="#526779">privados.</text></svg>