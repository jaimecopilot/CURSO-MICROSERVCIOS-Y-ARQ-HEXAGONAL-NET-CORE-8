<svg xmlns="http://www.w3.org/2000/svg" width="1220" height="760" viewBox="0 0 1220 760" role="img" aria-label="Reintentar requiere método seguro y fallo transitorio"><title>Reintentar requiere método seguro y fallo transitorio</title><desc>La clasificación preserva cancelación, respuestas definitivas y el límite de intentos.</desc><defs><marker id="blue" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10Z" fill="#247397"/></marker><marker id="green" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10Z" fill="#177D65"/></marker><marker id="gold" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10Z" fill="#98621C"/></marker><marker id="teal" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10Z" fill="#147E92"/></marker><marker id="red" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10Z" fill="#A23D48"/></marker><marker id="gray" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10Z" fill="#526779"/></marker></defs><rect width="1220" height="760" fill="white"/><rect width="1220" height="760" rx="20" fill="#F8FAFC"/><rect x="38" y="31" width="7" height="62" rx="3" fill="#147E92"/><text x="65" y="65" text-anchor="start" font-family="DejaVu Sans,Arial,sans-serif" font-size="28" font-weight="700" fill="#17314A">Reintentar requiere método seguro y fallo transitorio</text><text x="65" y="102" text-anchor="start" font-family="DejaVu Sans,Arial,sans-serif" font-size="18" font-weight="400" fill="#526779">La clasificación preserva cancelación, respuestas definitivas y el límite de intentos.</text><line x1="45" y1="128" x2="1175" y2="128" stroke="#D3E1EB"/><path d="M375,282.5 H410.0 V282.5 H445" fill="none" stroke="#147E92" stroke-width="3" marker-end="url(#teal)"/><rect x="396.4" y="255.5" width="27.2" height="23" rx="5" fill="#F8FAFC"/><text x="410.0" y="272.5" text-anchor="middle" font-family="DejaVu Sans,Arial,sans-serif" font-size="13" font-weight="400" fill="#147E92">sí</text><path d="M755,282.5 H790.0 V282.5 H825" fill="none" stroke="#147E92" stroke-width="3" marker-end="url(#teal)"/><rect x="776.4" y="255.5" width="27.2" height="23" rx="5" fill="#F8FAFC"/><text x="790.0" y="272.5" text-anchor="middle" font-family="DejaVu Sans,Arial,sans-serif" font-size="13" font-weight="400" fill="#147E92">sí</text><path d="M980.0,370 V417.5 H905.0 V465" fill="none" stroke="#147E92" stroke-width="3" marker-end="url(#teal)"/><rect x="928.9" y="391.5" width="27.2" height="23" rx="5" fill="#F8FAFC"/><text x="942.5" y="408.5" text-anchor="middle" font-family="DejaVu Sans,Arial,sans-serif" font-size="13" font-weight="400" fill="#147E92">sí</text><path d="M220.0,370 V417.5 H315.0 V465" fill="none" stroke="#147E92" stroke-width="3" marker-end="url(#teal)"/><rect x="253.89999999999998" y="391.5" width="27.2" height="23" rx="5" fill="#F8FAFC"/><text x="267.5" y="408.5" text-anchor="middle" font-family="DejaVu Sans,Arial,sans-serif" font-size="13" font-weight="400" fill="#147E92">no</text><rect x="65" y="195" width="310" height="175" rx="15" fill="#EBF3F9" stroke="#247397" stroke-width="2"/><rect x="65" y="195" width="7" height="175" rx="3" fill="#247397"/><text x="220.0" y="227" text-anchor="middle" font-family="DejaVu Sans,Arial,sans-serif" font-size="20" font-weight="700" fill="#247397">¿Consulta admitida?</text><text x="220.0" y="257" text-anchor="middle" font-family="DejaVu Sans,Arial,sans-serif" font-size="17" font-weight="400" fill="#17314A">El curso usa GET</text><text x="220.0" y="281" text-anchor="middle" font-family="DejaVu Sans,Arial,sans-serif" font-size="17" font-weight="400" fill="#17314A">Mutantes: no retry</text><rect x="445" y="195" width="310" height="175" rx="15" fill="#FEF5E9" stroke="#98621C" stroke-width="2"/><rect x="445" y="195" width="7" height="175" rx="3" fill="#98621C"/><text x="600.0" y="227" text-anchor="middle" font-family="DejaVu Sans,Arial,sans-serif" font-size="20" font-weight="700" fill="#98621C">¿Fallo transitorio?</text><text x="600.0" y="257" text-anchor="middle" font-family="DejaVu Sans,Arial,sans-serif" font-size="17" font-weight="400" fill="#17314A">408 / 429 / 5xx</text><text x="600.0" y="281" text-anchor="middle" font-family="DejaVu Sans,Arial,sans-serif" font-size="17" font-weight="400" fill="#17314A">Transporte o timeout de</text><text x="600.0" y="305" text-anchor="middle" font-family="DejaVu Sans,Arial,sans-serif" font-size="17" font-weight="400" fill="#17314A">intento</text><rect x="825" y="195" width="310" height="175" rx="15" fill="#E7F6F6" stroke="#147E92" stroke-width="2"/><rect x="825" y="195" width="7" height="175" rx="3" fill="#147E92"/><text x="980.0" y="227" text-anchor="middle" font-family="DejaVu Sans,Arial,sans-serif" font-size="20" font-weight="700" fill="#147E92">¿Queda presupuesto?</text><text x="980.0" y="257" text-anchor="middle" font-family="DejaVu Sans,Arial,sans-serif" font-size="17" font-weight="400" fill="#17314A">Máximo dos reintentos</text><text x="980.0" y="281" text-anchor="middle" font-family="DejaVu Sans,Arial,sans-serif" font-size="17" font-weight="400" fill="#17314A">Total de seis segundos</text><rect x="65" y="465" width="500" height="155" rx="15" fill="#FFF0F1" stroke="#A23D48" stroke-width="2"/><rect x="65" y="465" width="7" height="155" rx="3" fill="#A23D48"/><text x="315.0" y="497" text-anchor="middle" font-family="DejaVu Sans,Arial,sans-serif" font-size="20" font-weight="700" fill="#A23D48">Terminar sin otro envío</text><text x="315.0" y="527" text-anchor="middle" font-family="DejaVu Sans,Arial,sans-serif" font-size="17" font-weight="400" fill="#17314A">400 / 401 / 403 / 404, cancelación, circuito</text><text x="315.0" y="551" text-anchor="middle" font-family="DejaVu Sans,Arial,sans-serif" font-size="17" font-weight="400" fill="#17314A">abierto o límite agotado</text><rect x="655" y="465" width="500" height="155" rx="15" fill="#E7F6EE" stroke="#177D65" stroke-width="2"/><rect x="655" y="465" width="7" height="155" rx="3" fill="#177D65"/><text x="905.0" y="497" text-anchor="middle" font-family="DejaVu Sans,Arial,sans-serif" font-size="20" font-weight="700" fill="#177D65">Nuevo intento</text><text x="905.0" y="527" text-anchor="middle" font-family="DejaVu Sans,Arial,sans-serif" font-size="17" font-weight="400" fill="#17314A">Espera exponencial con jitter</text><text x="905.0" y="551" text-anchor="middle" font-family="DejaVu Sans,Arial,sans-serif" font-size="17" font-weight="400" fill="#17314A">El destino puede haberse recuperado</text><line x1="45" y1="670" x2="1175" y2="670" stroke="#D3E1EB"/><text x="60" y="701" text-anchor="start" font-family="DejaVu Sans,Arial,sans-serif" font-size="17" font-weight="400" fill="#526779">Los criterios son acumulativos: un fallo transitorio no autoriza repetir una escritura ni ignorar la</text><text x="60" y="726" text-anchor="start" font-family="DejaVu Sans,Arial,sans-serif" font-size="17" font-weight="400" fill="#526779">cancelación.</text></svg>