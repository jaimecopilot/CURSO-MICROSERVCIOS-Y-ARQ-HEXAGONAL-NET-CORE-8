<svg xmlns="http://www.w3.org/2000/svg" width="1220" height="760" viewBox="0 0 1220 760" role="img" aria-label="Un presupuesto exterior contiene intentos y esperas"><title>Un presupuesto exterior contiene intentos y esperas</title><desc>Orden Polly v8: total → retry → circuito → intento → transporte HTTP</desc><defs><marker id="blue" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10Z" fill="#247397"/></marker><marker id="green" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10Z" fill="#177D65"/></marker><marker id="gold" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10Z" fill="#98621C"/></marker><marker id="teal" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10Z" fill="#147E92"/></marker><marker id="red" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10Z" fill="#A23D48"/></marker><marker id="gray" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10Z" fill="#526779"/></marker></defs><rect width="1220" height="760" fill="white"/><rect width="1220" height="760" rx="20" fill="#F8FAFC"/><rect x="38" y="31" width="7" height="62" rx="3" fill="#147E92"/><text x="65" y="65" text-anchor="start" font-family="DejaVu Sans,Arial,sans-serif" font-size="28" font-weight="700" fill="#17314A">Un presupuesto exterior contiene intentos y esperas</text><text x="65" y="102" text-anchor="start" font-family="DejaVu Sans,Arial,sans-serif" font-size="18" font-weight="400" fill="#526779">Orden Polly v8: total → retry → circuito → intento → transporte HTTP</text><line x1="45" y1="128" x2="1175" y2="128" stroke="#D3E1EB"/><rect x="60" y="160" width="1100" height="465" rx="16" fill="#EBF3F9" stroke="#247397" stroke-width="2"/><text x="83" y="195" text-anchor="start" font-family="DejaVu Sans,Arial,sans-serif" font-size="20" font-weight="700" fill="#247397">Timeout total: 6 segundos</text><rect x="105" y="230" width="1010" height="355" rx="16" fill="#E7F6F6" stroke="#147E92" stroke-width="2"/><text x="128" y="265" text-anchor="start" font-family="DejaVu Sans,Arial,sans-serif" font-size="20" font-weight="700" fill="#147E92">Retry: 2 reintentos · 200 ms base · exponencial + jitter</text><rect x="150" y="300" width="920" height="245" rx="16" fill="#FEF5E9" stroke="#98621C" stroke-width="2"/><text x="173" y="335" text-anchor="start" font-family="DejaVu Sans,Arial,sans-serif" font-size="20" font-weight="700" fill="#98621C">Circuito compartido: decide si admite cada intento</text><rect x="195" y="370" width="830" height="135" rx="16" fill="#E7F6EE" stroke="#177D65" stroke-width="2"/><text x="218" y="405" text-anchor="start" font-family="DejaVu Sans,Arial,sans-serif" font-size="20" font-weight="700" fill="#177D65">Timeout de intento: 1 segundo</text><text x="610" y="467" text-anchor="middle" font-family="DejaVu Sans,Arial,sans-serif" font-size="20" font-weight="400" fill="#17314A">HttpClient usa el token recibido para la operación de E/S</text><line x1="45" y1="670" x2="1175" y2="670" stroke="#D3E1EB"/><text x="60" y="701" text-anchor="start" font-family="DejaVu Sans,Arial,sans-serif" font-size="17" font-weight="400" fill="#526779">El total limita también Retry-After. Cancelación del usuario termina antes; los timeouts requieren</text><text x="60" y="726" text-anchor="start" font-family="DejaVu Sans,Arial,sans-serif" font-size="17" font-weight="400" fill="#526779">cooperación del trabajo.</text></svg>