# Laboratorio docente Windows + Docker Desktop / motor Linux.
# Se conserva el código .NET 8 del M08 y se empaqueta por servicio.
# No se trata de una configuración segura para producción en Internet.
name: aceria-curso-docker
services:
  sqlserver:
    image: mcr.microsoft.com/mssql/server:2022-CU14-ubuntu-22.04
    environment:
      ACCEPT_EULA: "Y"
      MSSQL_PID: "Express"
      MSSQL_SA_PASSWORD: "${ACERIA_SA_PASSWORD:?Define_ACERIA_SA_PASSWORD_en_.env}"
    volumes:
      - sql-datos:/var/opt/mssql
    healthcheck:
      test: ["CMD-SHELL", '/opt/mssql-tools18/bin/sqlcmd -S localhost -U sa -P "$$MSSQL_SA_PASSWORD" -C -Q "SELECT 1" >/dev/null 2>&1']
      start_period: 60s
      interval: 10s
      timeout: 10s
      retries: 24
    networks: [aceria]

  rabbitmq:
    image: rabbitmq:4.1.5-management
    environment:
      RABBITMQ_DEFAULT_USER: curso
      RABBITMQ_DEFAULT_PASS: curso-local
    ports:
      - "127.0.0.1:5672:5672"
      - "127.0.0.1:15672:15672"
    volumes:
      - rabbit-datos:/var/lib/rabbitmq
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "-q", "ping"]
      start_period: 20s
      interval: 10s
      timeout: 10s
      retries: 18
    networks: [aceria]

  inventario-1:
    build:
      context: ../..
      dockerfile: PRACTICA_TRANSVERSAL_DOCKER_WINDOWS/docker/Dockerfile.Servicio
      args:
        PROYECTO: AceriaApp.Inventario.Api
    command: ["AceriaApp.Inventario.Api.dll"]
    environment:
      ASPNETCORE_ENVIRONMENT: Development
      ASPNETCORE_URLS: http://+:8080
      ConnectionStrings__AceriaInventario: "Server=sqlserver,1433;Database=AceriaDockerInventario;User Id=sa;Password=${ACERIA_SA_PASSWORD};Encrypt=True;TrustServerCertificate=True"
      Comunicacion__RabbitMqUri: amqp://curso:curso-local@rabbitmq:5672/
      Comunicacion__Prefijo: aceria-docker-integral
      Comunicacion__WorkersActivos: "true"
      Inventario__Instancia: inventario-1
    ports: ["127.0.0.1:5106:8080"]
    depends_on:
      sqlserver: {condition: service_healthy}
      rabbitmq: {condition: service_healthy}
    networks: [aceria]

  inventario-2:
    build:
      context: ../..
      dockerfile: PRACTICA_TRANSVERSAL_DOCKER_WINDOWS/docker/Dockerfile.Servicio
      args:
        PROYECTO: AceriaApp.Inventario.Api
    command: ["AceriaApp.Inventario.Api.dll"]
    environment:
      ASPNETCORE_ENVIRONMENT: Development
      ASPNETCORE_URLS: http://+:8080
      ConnectionStrings__AceriaInventario: "Server=sqlserver,1433;Database=AceriaDockerInventario;User Id=sa;Password=${ACERIA_SA_PASSWORD};Encrypt=True;TrustServerCertificate=True"
      Comunicacion__RabbitMqUri: amqp://curso:curso-local@rabbitmq:5672/
      Comunicacion__Prefijo: aceria-docker-integral
      Comunicacion__WorkersActivos: "true"
      Inventario__Instancia: inventario-2
    ports: ["127.0.0.1:5107:8080"]
    depends_on:
      sqlserver: {condition: service_healthy}
      rabbitmq: {condition: service_healthy}
    networks: [aceria]

  produccion:
    build:
      context: ../..
      dockerfile: PRACTICA_TRANSVERSAL_DOCKER_WINDOWS/docker/Dockerfile.Servicio
      args:
        PROYECTO: AceriaApp.Api
    command: ["AceriaApp.Api.dll"]
    environment:
      ASPNETCORE_ENVIRONMENT: Development
      ASPNETCORE_URLS: http://+:8080
      ConnectionStrings__AceriaApp: "Server=sqlserver,1433;Database=AceriaDockerApi;User Id=sa;Password=${ACERIA_SA_PASSWORD};Encrypt=True;TrustServerCertificate=True"
      ConnectionStrings__AceriaHexagonal: "Server=sqlserver,1433;Database=AceriaDockerHexagonal;User Id=sa;Password=${ACERIA_SA_PASSWORD};Encrypt=True;TrustServerCertificate=True"
      ConnectionStrings__AceriaProduccion: "Server=sqlserver,1433;Database=AceriaDockerProduccion;User Id=sa;Password=${ACERIA_SA_PASSWORD};Encrypt=True;TrustServerCertificate=True"
      Comunicacion__InventarioUrl: http://inventario-1:8080/
      Comunicacion__RabbitMqUri: amqp://curso:curso-local@rabbitmq:5672/
      Comunicacion__Prefijo: aceria-docker-integral
      Comunicacion__WorkersActivos: "true"
    ports: ["127.0.0.1:5105:8080"]
    depends_on:
      sqlserver: {condition: service_healthy}
      rabbitmq: {condition: service_healthy}
    networks: [aceria]

  gateway:
    build:
      context: ../..
      dockerfile: PRACTICA_TRANSVERSAL_DOCKER_WINDOWS/docker/Dockerfile.Servicio
      args:
        PROYECTO: AceriaApp.Gateway
    command: ["AceriaApp.Gateway.dll"]
    environment:
      ASPNETCORE_ENVIRONMENT: Development
      ASPNETCORE_URLS: http://+:8080
      Urls: http://+:8080
      ReverseProxy__Clusters__produccion-cluster__Destinations__produccion__Address: http://produccion:8080/
      ReverseProxy__Clusters__inventario-cluster__Destinations__inventario-1__Address: http://inventario-1:8080/
      ReverseProxy__Clusters__inventario-cluster__Destinations__inventario-2__Address: http://inventario-2:8080/
    ports: ["127.0.0.1:5100:8080"]
    depends_on: [produccion, inventario-1, inventario-2]
    networks: [aceria]

networks:
  aceria: {}

volumes:
  sql-datos: {}
  rabbit-datos: {}
